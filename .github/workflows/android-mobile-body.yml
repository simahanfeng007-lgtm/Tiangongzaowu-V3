name: Build Tiangong Mobile Body APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/android-mobile-body-v1
    paths:
      - 'android/tiangong-mobile-body/**'
      - '.github/workflows/android-mobile-body.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile debug APK
        working-directory: android/tiangong-mobile-body
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp android/tiangong-mobile-body/app/build/outputs/apk/debug/app-debug.apk dist/Tiangong-Mobile-Body-v0.1.0-dev.apk
          sha256sum dist/Tiangong-Mobile-Body-v0.1.0-dev.apk | tee dist/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tiangong-Mobile-Body-v0.1.0-dev
          path: dist/*
          if-no-files-found: error
          retention-days: 30
