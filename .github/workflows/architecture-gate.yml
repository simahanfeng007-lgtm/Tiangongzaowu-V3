name: Isolated Linux media diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose-media:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONHASHSEED: "0"
      TIANGONG_CI_ENV: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash scripts/setup-linux-ci-sandbox.sh
      - run: python -m pip install -r requirements-source.lock
      - name: Exact runtime and media result
        run: |
          git rev-parse HEAD
          cat /etc/os-release
          ffmpeg -version
          python -m pytest tests/test_execution_linux_and_artifacts.py::test_media_encoder_fits_real_sandbox_and_produces_decodable_frames -vv --showlocals
