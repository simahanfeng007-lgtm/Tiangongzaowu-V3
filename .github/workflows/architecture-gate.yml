name: Architecture gate

on:
  push:
    branches:
      - main
      - "agent/p17*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-regression:
    name: node-regression-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: true

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Python 3.12 for test enumeration
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked renderer dependencies
        working-directory: app
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Check desktop entry syntax
        working-directory: app
        run: npm run check:syntax

      - name: Run full Node regression
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          tests = sorted(str(path) for pattern in ('*.mjs', 'test_*.js', '*.test.cjs')
                         for path in Path('tests').glob(pattern))
          assert tests, 'Node regression selection is empty'
          subprocess.run(['node', '--test', *tests], check=True)

  source-authority:
    name: source-authority-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate source-authority topology
        run: python scripts/check-source-authority.py

      - name: Verify generated-source mirrors
        run: python scripts/sync-generated-sources.py --check-committed

      - name: Run P17 M1 source-authority regression
        run: python tests/test_source_authority_p17_m1.py -v

      - name: Run P17 M1-03 V3 boundary regression
        run: python tests/test_source_authority_p17_m1_03.py -v

      - name: Run P17 M2-01 Zongdiaodu composition regression
        run: python tests/test_zongdiaodu_p17_m2_01.py -v

      - name: Run P17 M2-02 turn orchestration regression
        run: python tests/test_zongdiaodu_p17_m2_02.py -v

      - name: Run P17 M2-03 tool-result continuation regression
        run: python tests/test_zongdiaodu_p17_m2_03.py -v

      - name: Run P17 M2-04 embedded life lifecycle regression
        run: python tests/test_embedded_life_p17_m2_04.py -v

      - name: Run P17 M2-05 embedded life gateway wiring regression
        run: python tests/test_embedded_life_p17_m2_05.py -v

      - name: Run P17 M3-01 life store connection regression
        run: python tests/test_life_store_p17_m3_01.py -v

      - name: Run P17 M3-02 life store schema regression
        run: python tests/test_life_store_p17_m3_02.py -v

      - name: Install P17 M3-03 Life store test dependencies
        run: python -m pip install cryptography==48.0.1 pydantic==2.13.4 pytest

      - name: Run P17 M3-03 life memory repository regression
        run: python tests/test_life_store_p17_m3_03.py -v

      - name: Run P17 M3-04 Gateway Store UoW regression
        run: python -m unittest discover -s tests -p "test_total_gateway_store_p17*.py" -v

      - name: Run P17 M3-05 store closeout regression
        run: python -m pytest tests/test_gateway_store.py tests/test_life_shadow_store.py tests/test_causal_memory_store.py tests/test_memory_derivation_store_p15.py -q

      - name: Run P17 M3-05 single-writer and cutover guards
        run: python -m pytest tests/test_memory_single_writer_p15.py tests/test_memory_p15_architecture_guards.py tests/test_p15_cutover_phases.py tests/test_p15_acceptance_gate.py -q

      - name: Run P17 M4 architecture guards
        run: python -m pytest tests/test_p17_m4_architecture_guards.py -q

      - name: Run provider identity persistence contract
        run: python -m pytest tests/test_provider_identity_persistence.py -q

      - name: Run settings authority contract
        run: python -m pytest tests/test_settings_authority_contract.py -q

      - name: Run P17.1 runtime integrity regression
        run: python -m pytest tests/test_p17_1_runtime_integrity.py -q

      - name: Compile P17 M2 and M3 seams
        run: python -m py_compile app/backend/tiangong-backend/v3/zongdiaodu.py app/backend/tiangong-backend/v3/runtime_bootstrap.py app/backend/tiangong-backend/v3/runtime_composition.py app/backend/tiangong-backend/v3/runtime_lifecycle.py app/backend/tiangong-backend/v3/runtime_turn_orchestration.py app/backend/tiangong-backend/v3/runtime_tool_result_boundary.py src/life_service/embedded_runtime.py src/life_service/embedded_runtime_lifecycle.py src/life_service/embedded_runtime_wiring.py src/life_service/store.py src/life_service/store_connection.py src/life_service/store_schema.py src/life_service/store_contract_support.py src/life_service/store_memory_repository.py src/total_gateway/runtime.py src/total_gateway/store.py src/total_gateway/store_unit_of_work.py

  full-regression:
    name: full-regression-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONHASHSEED: "0"
      TIANGONG_CI_ENV: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare and verify Linux containment and media runtimes
        run: bash scripts/setup-linux-ci-sandbox.sh

      - name: Install full source-runtime dependencies
        run: python -m pip install -r requirements-source.lock

      - name: Run full repository pytest
        run: python -m pytest -q


  windows-regression-shards:
    name: windows-pytest-shard-${{ matrix.shard }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONHASHSEED: "0"
      # Preserve the EXISTING Windows ci_fragile behavior; no new marks/skips.
      # The separate P12 native suite still exercises the repaired sandbox.
      TIANGONG_CI_ENV: "1"
      SHARD_INDEX: ${{ matrix.shard }}
      EXPECTED_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install unchanged source-runtime dependencies
        run: python -m pip install -r requirements-source.lock
      - name: Install AppContainer compatibility into this CI interpreter
        run: |
          python scripts/install-python-appcontainer-compat.py --ci-current-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/install-python-appcontainer-compat.py --ci-current-runtime --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import os, sitecustomize; import _tiangong_windows_python_compat; assert os.mkdir.__module__ == 'nt'; assert not getattr(os.mkdir, '_tiangong_appcontainer_private_acl', False)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect every test and execute assigned whole modules
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / ('pytest-shard-' + os.environ['SHARD_INDEX'])
          root.mkdir()
          cmd = [sys.executable, 'scripts/ci-pytest-shards.py', 'run', '--expected-head', os.environ['EXPECTED_HEAD'], '--shards', '8', '--shard', os.environ['SHARD_INDEX'], '--output', str(root / 'results')]
          with (root / 'pytest.log').open('wb') as log:
              process = subprocess.Popen(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              for line in process.stdout:
                  log.write(line)
                  log.flush()
                  print(line.decode('utf-8', errors='replace'), end='', flush=True)
              code = process.wait()
          raise SystemExit(code)
      - name: Preserve original shard outcomes even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-pytest-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/pytest-shard-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 90

  windows-regression-union:
    # Keep the former Windows full-regression check name for required checks.
    name: full-regression-windows-latest
    needs: windows-regression-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.sha }}
      SHARD_JOBS_RESULT: ${{ needs.windows-regression-shards.result }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download only this run attempt's separate shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: windows-pytest-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/pytest-shard-inputs
          merge-multiple: false
      - name: Require exact full-collection union and successful shard jobs
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          result = subprocess.run([sys.executable, 'scripts/ci-pytest-shards.py', 'aggregate', '--expected-head', os.environ['EXPECTED_HEAD'], '--shards', '8', '--inputs', str(root / 'pytest-shard-inputs'), '--output', str(root / 'pytest-union' / 'summary.json')])
          if result.returncode:
              raise SystemExit(result.returncode)
          if os.environ['SHARD_JOBS_RESULT'] != 'success':
              raise SystemExit('At least one shard job did not complete successfully')
      - name: Preserve union verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-pytest-union-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pytest-union/
          if-no-files-found: warn
          retention-days: 90
