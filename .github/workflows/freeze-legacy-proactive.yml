name: Freeze legacy proactive producers

on:
  push:
    branches:
      - agent/freeze-legacy-proactive-v0.1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout freeze branch
        uses: actions/checkout@v4
        with:
          ref: agent/freeze-legacy-proactive-v0.1
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply legacy producer freeze
        run: python scripts/freeze-legacy-proactive.py

      - name: Sync generated mirrors
        run: python scripts/sync-generated-sources.py --write

      - name: Install source-runtime dependencies
        run: python -m pip install -r requirements-source.lock

      - name: Compile frozen surface
        run: >-
          python -m compileall -q
          src/life_service/embedded_runtime.py
          app/life-service/runtime314/life_service/embedded_runtime.py
          tests/test_legacy_proactive_freeze.py

      - name: Run freeze regression
        run: >-
          python -m pytest -q
          tests/test_legacy_proactive_freeze.py
          tests/test_p15_cutover_phases.py
          tests/test_p15_acceptance_gate.py
          -k "legacy_proactive or cutover or acceptance or proactive or greeting or learning_report"

      - name: Verify generated mirrors
        run: python scripts/sync-generated-sources.py --check-committed

      - name: Commit freeze and generated mirrors
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No freeze diff to commit."
            exit 0
          fi
          git config user.name "tiangong-proactive-freeze"
          git config user.email "tiangong-proactive-freeze@users.noreply.github.com"
          git add -A
          git commit -m "freeze legacy proactive reply producers"
          git push origin HEAD:agent/freeze-legacy-proactive-v0.1
