def test_store_fallback_closes_oldest_when_runtime_cache_has_more_than_32_open_episodes():
    with tempfile.TemporaryDirectory() as temporary:
        life = runtime(Path(temporary))
        try:
            life_id = str(life._active()["life_id"])
            with life._lock:
                for index in range(33):
                    life._open_runtime_episode_locked(
                        life_id=life_id,
                        source="autonomy",
                        ref_id=f"task_many_{index}",
                        event_kind="autonomy.task.attempt.started",
                        intention=f"并发反思 {index}",
                        context_sha256=f"{index:064x}"[-64:],
                        prediction=build_prediction(
                            basis_inputs={"source": "autonomy", "task_id": f"task_many_{index}"}
                        ),
                        action_risk="A0",
                    )
            store = life._contract_store()
            assert len(store.open_causal_episodes(life_id, limit=64)) == 33
            registry = life._scope_state(life_id)["scheduler"]["open_episodes"]
            assert len(registry) == 32
            assert not any(row.get("ref") == "task_many_0" for row in registry)

            with life._lock:
                life._abort_runtime_episode_locked(
                    life_id=life_id,
                    source="autonomy",
                    ref_id="task_many_0",
                    reason="test.cache.eviction",
                )
            assert len(store.open_causal_episodes(life_id, limit=64)) == 32
            assert any(
                card.episode_id
                for card in store.list_reflection_cards(life_id, limit=64)
            )
        finally:
            life.close()


def test_restart_recovers_episode_committed_to_store_before_registry_persist():
    with tempfile.TemporaryDirectory() as temporary:
        root = Path(temporary)
        life = runtime(root)
        life_id = str(life._active()["life_id"])
        with life._lock:
            life._open_runtime_episode_locked(
                life_id=life_id,
                source="autonomy",
                ref_id="task_crash_window",
                event_kind="autonomy.task.attempt.started",
                intention="验证 Store 已写但缓存未写的崩溃窗口",
                context_sha256="a" * 64,
                prediction=build_prediction(
                    basis_inputs={"source": "autonomy", "task_id": "task_crash_window"}
                ),
                action_risk="A0",
            )
            assert len(life._contract_store().open_causal_episodes(life_id)) == 1
            life._scope_state(life_id)["scheduler"]["open_episodes"] = []
            life._persist(life_id, force=True)
        life.close()

        reopened = runtime(root)
        try:
            store = reopened._contract_store()
            assert store.open_causal_episodes(life_id) == ()
            cards = store.list_reflection_cards(life_id)
            assert len(cards) == 1
            assert "restart_recovery" in cards[0].observed_outcome
            assert reopened._scope_state(life_id)["scheduler"].get("open_episodes") == []
        finally:
            reopened.close()


def test_restart_recovers_capability_orphan_open_episode():
    with tempfile.TemporaryDirectory() as temporary:
        root = Path(temporary)
        life, life_id, artifact = _capability_runtime(
            root,
            risk_level="A1",
            invoker=lambda action_id, arguments, ctx: {"ok": True},
        )
        lineage_id = artifact["lineage_id"]
        pointer = life._scope_state(life_id)["capability_pointers"][lineage_id]
        with life._lock:
            life._open_capability_episode_locked(
                life_id=life_id,
                artifact=artifact,
                pointer=pointer,
                execution_id="caprun_restart_orphan",
            )
            assert len(life._contract_store().open_causal_episodes(life_id)) == 1
            life._scope_state(life_id)["scheduler"]["open_episodes"] = []
            life._persist(life_id, force=True)
        life.close()

        reopened = runtime(root)
        try:
            store = reopened._contract_store()
            assert store.open_causal_episodes(life_id) == ()
            assert len(store.list_reflection_cards(life_id)) == 1
        finally:
            reopened.close()


def test_capability_patch_timeout_counts_global_and_subpool_timeout_metrics():
    with tempfile.TemporaryDirectory() as temporary:
        life, life_id, artifact = _capability_runtime(
            Path(temporary),
            risk_level="A1",
            invoker=lambda action_id, arguments, ctx: {"ok": True},
        )
        try:
            pointer = life._scope_state(life_id)["capability_pointers"][artifact["lineage_id"]]
            health = pointer["health"]
            health["consecutive_failures"] = 99
            health["patch_pending"] = False
            health["patch_rounds"] = 0

            def timeout_decider(_material):
                raise TimeoutError("capability patch model timeout")

            life.set_capability_patch_decider(timeout_decider)
            life._schedule_capability_health_decision(life_id=life_id)
            deadline = time.monotonic() + 3.0
            while time.monotonic() < deadline:
                scheduler = life._scope_state(life_id)["scheduler"]
                if not scheduler.get("capability_health_inflight"):
                    break
                time.sleep(0.01)
            scheduler = life._scope_state(life_id)["scheduler"]
            assert scheduler["model_failures"] == 1
            assert scheduler["model_timeouts"] == 1
            assert scheduler["capability_patch_model_failures"] == 1
            assert scheduler["capability_patch_model_timeouts"] == 1
        finally:
            life.close()


