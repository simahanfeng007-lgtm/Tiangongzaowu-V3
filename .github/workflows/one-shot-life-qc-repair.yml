name: One-shot Life QC repair

on:
  push:
    branches:
      - fix/life-reflection-budget-qc-20260821

permissions:
  contents: write

concurrency:
  group: one-shot-life-qc-repair
  cancel-in-progress: false

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply in-place authoritative-source repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import shutil

          EMBEDDED = Path('src/life_service/embedded_runtime.py')
          STORE = Path('src/life_service/store.py')
          BUDGET_TEST = Path('tests/test_life_scheduler_budgets.py')
          REFLECTION_TEST = Path('tests/test_life_reflection_chain_wiring.py')

          def read(path: Path) -> str:
              return path.read_text(encoding='utf-8')

          def write(path: Path, text: str) -> None:
              path.write_text(text, encoding='utf-8', newline='\n')

          def replace_once(path: Path, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one literal match, got {count}')
              write(path, text.replace(old, new, 1))

          def regex_replace_once(path: Path, pattern: str, replacement: str) -> None:
              text = read(path)
              next_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one regex match, got {count}')
              write(path, next_text)

          # -----------------------------------------------------------------
          # P1-1: budget=0 means disabled.  Remove truthiness guards so zero
          # exhausts the pool before the first provider call.
          # -----------------------------------------------------------------
          replace_once(
              EMBEDDED,
              '''        if (\n            (success_limit and int(scheduler.get("model_successes") or 0) >= success_limit)\n            or (attempt_limit and int(scheduler.get("model_attempts") or 0) >= attempt_limit)\n        ):''',
              '''        if (\n            int(scheduler.get("model_successes") or 0) >= success_limit\n            or int(scheduler.get("model_attempts") or 0) >= attempt_limit\n        ):''',
          )
          replace_once(
              EMBEDDED,
              '''        exhausted = (\n            (global_success_limit and int(scheduler.get("model_successes") or 0) >= global_success_limit)\n            or (global_attempt_limit and int(scheduler.get("model_attempts") or 0) >= global_attempt_limit)\n            or (proactive_success_limit and int(scheduler.get("proactive_model_successes") or 0) >= proactive_success_limit)\n            or (proactive_attempt_limit and int(scheduler.get("proactive_model_attempts") or 0) >= proactive_attempt_limit)\n        )''',
              '''        exhausted = (\n            int(scheduler.get("model_successes") or 0) >= global_success_limit\n            or int(scheduler.get("model_attempts") or 0) >= global_attempt_limit\n            or int(scheduler.get("proactive_model_successes") or 0) >= proactive_success_limit\n            or int(scheduler.get("proactive_model_attempts") or 0) >= proactive_attempt_limit\n        )''',
          )
          replace_once(
              EMBEDDED,
              '''        return (\n            (global_success_limit and int(scheduler.get("model_successes") or 0) >= global_success_limit)\n            or (global_attempt_limit and int(scheduler.get("model_attempts") or 0) >= global_attempt_limit)\n            or (sub_success_limit and int(scheduler.get(f"{prefix}successes") or 0) >= sub_success_limit)\n            or (sub_attempt_limit and int(scheduler.get(f"{prefix}attempts") or 0) >= sub_attempt_limit)\n        )''',
              '''        return (\n            int(scheduler.get("model_successes") or 0) >= global_success_limit\n            or int(scheduler.get("model_attempts") or 0) >= global_attempt_limit\n            or int(scheduler.get(f"{prefix}successes") or 0) >= sub_success_limit\n            or int(scheduler.get(f"{prefix}attempts") or 0) >= sub_attempt_limit\n        )''',
          )

          # The six F6 sub-budget settings were allowed but were not included
          # in the integer/range validator.  Close that input-validation gap.
          replace_once(
              EMBEDDED,
              '''                    limits = {\n                        "llm_daily_budget": (0, 1000),\n                        "llm_daily_attempt_budget": (0, 2000),''',
              '''                    limits = {\n                        "llm_daily_budget": (0, 1000),\n                        "llm_daily_attempt_budget": (0, 2000),\n                        "learning_llm_daily_budget": (0, 1000),\n                        "learning_llm_daily_attempt_budget": (0, 2000),\n                        "self_iteration_llm_daily_budget": (0, 1000),\n                        "self_iteration_llm_daily_attempt_budget": (0, 2000),\n                        "capability_patch_llm_daily_budget": (0, 1000),\n                        "capability_patch_llm_daily_attempt_budget": (0, 2000),''',
          )

          # -----------------------------------------------------------------
          # P1-2: OPEN CausalEpisode durability.  Store becomes the SSoT and
          # scheduler.open_episodes remains only a bounded cache/index.
          # -----------------------------------------------------------------
          regex_replace_once(
              STORE,
              r'''    def open_causal_episodes\(\n        self, life_id: str, \*, limit: int = 32\n    \) -> tuple\[CausalEpisode, \.\.\.\]:\n.*?(?=\n    def )''',
              '''    def open_causal_episodes(\n        self, life_id: str, *, limit: int = 32, offset: int = 0\n    ) -> tuple[CausalEpisode, ...]:\n        """Episodes whose LATEST revision is still OPEN, oldest first.\n\n        ``offset`` makes the authoritative OPEN set pageable.  Runtime-side\n        registries are caches only; recovery must be able to walk the entire\n        Store result set instead of silently losing episodes beyond one page.\n        """\n\n        bounded_limit = max(1, min(int(limit), 256))\n        bounded_offset = max(0, int(offset))\n        rows = self._connection.execute(\n            """\n            SELECT current.payload\n            FROM causal_episodes AS current\n            JOIN (\n                SELECT episode_id, MAX(revision) AS latest_revision\n                FROM causal_episodes\n                WHERE life_id = ?\n                GROUP BY episode_id\n            ) AS latest\n              ON latest.episode_id = current.episode_id\n             AND latest.latest_revision = current.revision\n            WHERE current.life_id = ? AND current.terminal_status = 'OPEN'\n            ORDER BY current.created_at_ms ASC, current.episode_id ASC\n            LIMIT ? OFFSET ?\n            """,\n            (life_id, life_id, bounded_limit, bounded_offset),\n        ).fetchall()\n        return tuple(\n            _parse_stored_contract(\n                bytes(row["payload"]), CausalEpisode, "causal episode"\n            )\n            for row in rows\n        )\n''',
          )

          replace_once(
              STORE,
              '''    def put_action_candidate(self, candidate: ActionCandidate) -> bool:''',
              '''    def find_action_impact_for_source_event(\n        self, *, life_id: str, action_id: str, source_event_id: str\n    ) -> ActionImpact | None:\n        """Return the authoritative ActionImpact bound to one source event.\n\n        This is a read-only recovery primitive for reflection rehydration; it\n        does not create a second impact index or mutate the immutable ledger.\n        """\n\n        rows = self._connection.execute(\n            """\n            SELECT payload FROM action_impacts\n            WHERE life_id = ? AND action_id = ?\n            ORDER BY created_at_ms ASC, impact_id ASC\n            """,\n            (life_id, action_id),\n        ).fetchall()\n        for row in rows:\n            impact = _parse_stored_contract(\n                bytes(row["payload"]), ActionImpact, "action impact"\n            )\n            if source_event_id in impact.source_event_ids:\n                return impact\n        return None\n\n    def put_action_candidate(self, candidate: ActionCandidate) -> bool:''',
          )

          # Startup recovery runs before the scheduler starts, so every OPEN
          # episode visible here is an orphan left by the prior process.
          replace_once(
              EMBEDDED,
              '''            self._state = self._load_state()\n            heartbeat_recovered = self._reconcile_scheduler_heartbeat(active_life_id)\n            recovered_inflight = recover_inflight_scheduler_flags(self._state)''',
              '''            self._state = self._load_state()\n            reflection_recovered = self._reconcile_open_reflection_episodes(active_life_id)\n            heartbeat_recovered = self._reconcile_scheduler_heartbeat(active_life_id)\n            recovered_inflight = recover_inflight_scheduler_flags(self._state)''',
          )
          replace_once(
              EMBEDDED,
              '''            if projection_changed or classification_changed or memory_contract_changed or heartbeat_recovered or recovered_inflight:\n                self._persist(active_life_id)''',
              '''            if (\n                projection_changed\n                or classification_changed\n                or memory_contract_changed\n                or heartbeat_recovered\n                or recovered_inflight\n                or reflection_recovered\n            ):\n                self._persist(active_life_id)''',
          )

          helper_block = r'''    _REFLECTION_EPISODE_REGISTRY_CAP = 32

    def _reflection_registry_entry_from_episode_locked(
        self,
        *,
        life_id: str,
        episode: Any,
        event_by_id: Mapping[str, Any] | None = None,
    ) -> dict[str, Any] | None:
        """Rebuild the runtime cache entry from authoritative causal records.

        ``scheduler.open_episodes`` is deliberately not authoritative.  The
        OPEN CausalEpisode owns the prior PredictionSnapshot; its trigger
        LifeEvent owns source/ref correlation; capability ActionImpact is read
        back from the immutable Store when that extra is required.
        """

        if str(getattr(episode, "life_id", "") or "") != life_id:
            return None
        if str(getattr(episode, "terminal_status", "") or "") != "OPEN":
            return None
        trigger_ids = tuple(getattr(episode, "trigger_event_ids", ()) or ())
        if not trigger_ids:
            return None
        store = self._contract_store()
        events = event_by_id
        if events is None:
            events = {
                str(event.event_id): event
                for event in store.load_events(life_id)
            }
        trigger_id = str(trigger_ids[0])
        trigger = events.get(trigger_id) if isinstance(events, Mapping) else None
        if trigger is None:
            return None
        correlation_id = str(getattr(trigger, "correlation_id", "") or "")
        if ":" not in correlation_id:
            return None
        source, ref_id = correlation_id.split(":", 1)
        source = source.strip()
        ref_id = ref_id.strip()
        if not source or not ref_id:
            return None
        try:
            snapshot = json.loads(str(getattr(episode, "prior_prediction", "") or ""))
        except (TypeError, ValueError):
            return None
        if not isinstance(snapshot, Mapping):
            return None
        context_hashes = tuple(getattr(episode, "context_state_hashes", ()) or ())
        entry: dict[str, Any] = {
            "source": source,
            "ref": ref_id,
            "episode_id": str(getattr(episode, "episode_id", "") or ""),
            "correlation_id": correlation_id,
            "predicted_success_milli": int(snapshot.get("predicted_success_milli") or 0),
            "prediction_snapshot": deepcopy(dict(snapshot)),
            "context_sha256": str(context_hashes[0] if context_hashes else ""),
            "action_risk": "A1",
            "opened_at_ms": int(getattr(episode, "created_at_ms", 0) or 0),
        }
        scope = self._scope_state(life_id)
        if source == "autonomy":
            task = (self._autonomy_state(life_id).get("tasks") or {}).get(ref_id)
            if isinstance(task, Mapping):
                entry["action_risk"] = str(task.get("risk_class") or "A0")
        elif source == "capability":
            capability_id = str(
                getattr(episode, "selected_action_id", "")
                or snapshot.get("artifact_id")
                or ""
            )
            artifact = (scope.get("capabilities") or {}).get(capability_id)
            artifact = artifact if isinstance(artifact, Mapping) else {}
            entry.update({
                "capability_id": capability_id,
                "capability_version": str(
                    artifact.get("version") or snapshot.get("version") or ""
                ),
                "capability_scope": str(
                    artifact.get("title")
                    or getattr(episode, "intention", "")
                    or "能力学习"
                ),
                "action_risk": str(artifact.get("risk_level") or "A3"),
            })
            impact = store.find_action_impact_for_source_event(
                life_id=life_id,
                action_id=capability_id,
                source_event_id=trigger_id,
            )
            if impact is not None:
                entry["action_impact"] = impact.model_dump(mode="json")
        return entry

    def _resolve_runtime_episode_entry_locked(
        self, *, life_id: str, source: str, ref_id: str
    ) -> dict[str, Any] | None:
        """Resolve an OPEN episode from cache first, then the Store SSoT."""

        scheduler = self._scope_state(life_id).setdefault("scheduler", {})
        registry = [
            row
            for row in scheduler.get("open_episodes") or []
            if isinstance(row, Mapping)
        ]
        for row in registry:
            if (
                str(row.get("source") or "") == source
                and str(row.get("ref") or "") == ref_id
            ):
                return row
        store = self._contract_store()
        event_by_id = {
            str(event.event_id): event for event in store.load_events(life_id)
        }
        offset = 0
        while True:
            batch = store.open_causal_episodes(life_id, limit=256, offset=offset)
            if not batch:
                return None
            for episode in batch:
                entry = self._reflection_registry_entry_from_episode_locked(
                    life_id=life_id,
                    episode=episode,
                    event_by_id=event_by_id,
                )
                if entry is None:
                    continue
                if (
                    str(entry.get("source") or "") == source
                    and str(entry.get("ref") or "") == ref_id
                ):
                    registry.append(entry)
                    scheduler["open_episodes"] = registry[
                        -self._REFLECTION_EPISODE_REGISTRY_CAP:
                    ]
                    return entry
            if len(batch) < 256:
                return None
            offset += len(batch)

    def _reconcile_open_reflection_episodes(self, life_id: str) -> int:
        """Close OPEN episodes orphaned by a prior process before scheduling.

        The Store is authoritative and is paged in full.  Recovery is
        best-effort by episode so one malformed historical record cannot make
        the entire Life runtime unbootable; failures remain auditable via the
        existing reflection failure journal.
        """

        if not self._reflection_chain_enabled():
            return 0
        store = self._contract_store()
        event_by_id = {
            str(event.event_id): event for event in store.load_events(life_id)
        }
        open_episodes: list[Any] = []
        offset = 0
        while True:
            batch = store.open_causal_episodes(life_id, limit=256, offset=offset)
            open_episodes.extend(batch)
            if len(batch) < 256:
                break
            offset += len(batch)
        recovered = 0
        for episode in open_episodes:
            try:
                entry = self._reflection_registry_entry_from_episode_locked(
                    life_id=life_id,
                    episode=episode,
                    event_by_id=event_by_id,
                )
                if entry is None:
                    raise ValueError("open reflection episode cannot be rehydrated")
                scheduler = self._scope_state(life_id).setdefault("scheduler", {})
                registry = [
                    row
                    for row in scheduler.get("open_episodes") or []
                    if isinstance(row, Mapping)
                    and str(row.get("episode_id") or "")
                    != str(entry.get("episode_id") or "")
                ]
                registry.append(entry)
                scheduler["open_episodes"] = registry[
                    -self._REFLECTION_EPISODE_REGISTRY_CAP:
                ]
                self._abort_runtime_episode_locked(
                    life_id=life_id,
                    source=str(entry.get("source") or ""),
                    ref_id=str(entry.get("ref") or ""),
                    reason="life.runtime.restart_recovery",
                )
                recovered += 1
            except Exception as exc:
                self._reflection_journal_failure(life_id, "startup_recovery", exc)
        return recovered

    def _reflection_chain_enabled(self) -> bool:
'''
          replace_once(
              EMBEDDED,
              '''    _REFLECTION_EPISODE_REGISTRY_CAP = 32\n\n    def _reflection_chain_enabled(self) -> bool:\n''',
              helper_block,
          )

          replace_once(
              EMBEDDED,
              '''            scheduler = self._scope_state(life_id).setdefault("scheduler", {})\n            registry = [\n                row for row in scheduler.get("open_episodes") or [] if isinstance(row, Mapping)\n            ]\n            entry = next(\n                (\n                    row for row in registry\n                    if str(row.get("source") or "") == source\n                    and str(row.get("ref") or "") == ref_id\n                ),\n                None,\n            )\n            if entry is None:\n                return  # 没有事前落账（链路关闭或 opening 失败），无从收尾''',
              '''            scheduler = self._scope_state(life_id).setdefault("scheduler", {})\n            entry = self._resolve_runtime_episode_entry_locked(\n                life_id=life_id, source=source, ref_id=ref_id\n            )\n            if entry is None:\n                return  # Store 与缓存均无事前落账，无从收尾\n            registry = [\n                row for row in scheduler.get("open_episodes") or [] if isinstance(row, Mapping)\n            ]''',
          )

          replace_once(
              EMBEDDED,
              '''            scheduler = self._scope_state(life_id).setdefault("scheduler", {})\n            registry = [\n                row for row in scheduler.get("open_episodes") or [] if isinstance(row, Mapping)\n            ]\n            entry = next(\n                (\n                    row for row in registry\n                    if str(row.get("source") or "") == "capability"\n                    and str(row.get("ref") or "") == execution_id\n                ),\n                None,\n            )\n            if entry is None:\n                return None\n            from contracts import ActionImpact''',
              '''            scheduler = self._scope_state(life_id).setdefault("scheduler", {})\n            entry = self._resolve_runtime_episode_entry_locked(\n                life_id=life_id, source="capability", ref_id=execution_id\n            )\n            if entry is None:\n                return None\n            registry = [\n                row for row in scheduler.get("open_episodes") or [] if isinstance(row, Mapping)\n            ]\n            from contracts import ActionImpact''',
          )

          # -----------------------------------------------------------------
          # P2-1: capability patch TimeoutError must increment timeout metrics.
          # -----------------------------------------------------------------
          replace_once(
              EMBEDDED,
              '''                    except Exception:\n                        with self._lock:\n                            self._account_sub_model_failure_locked(\n                                self._scope_state(life_id).setdefault("scheduler", {}),\n                                pool="capability_patch",\n                            )\n                        continue\n                    if not valid_decision:''',
              '''                    except Exception as exc:\n                        with self._lock:\n                            self._account_sub_model_failure_locked(\n                                self._scope_state(life_id).setdefault("scheduler", {}),\n                                pool="capability_patch",\n                                timeout=isinstance(exc, TimeoutError),\n                            )\n                        continue\n                    if not valid_decision:''',
          )

          # -----------------------------------------------------------------
          # P2-2: idle must be an actual sort dimension before composite score.
          # -----------------------------------------------------------------
          replace_once(
              EMBEDDED,
              '''        rows.sort(\n            key=lambda item: (\n                -int(item.get("composite_score_milli") or 0),''',
              '''        rows.sort(\n            key=lambda item: (\n                bool(item.get("idle")),\n                -int(item.get("composite_score_milli") or 0),''',
          )

          # -----------------------------------------------------------------
          # Regression tests.
          # -----------------------------------------------------------------
          budget_append = r'''


def test_zero_budget_disables_global_subpool_and_proactive_before_first_call():
    with tempfile.TemporaryDirectory() as temporary:
        life = runtime(Path(temporary))
        try:
            today = utc_day()
            scope = life._scope_state()
            scheduler = scope["scheduler"]
            settings = scope["settings"]

            seed_global(scheduler, day=today)
            seed_pool(scheduler, prefix="learning_model_", day=today, attempts=0)
            settings["llm_daily_budget"] = 0
            assert life._reserve_sub_model_call_locked(
                scheduler=scheduler, settings=settings, pool="learning"
            ) is False
            assert scheduler["model_attempts"] == 0
            assert scheduler["learning_model_attempts"] == 0

            settings["llm_daily_budget"] = 20
            settings["learning_llm_daily_budget"] = 0
            assert life._reserve_sub_model_call_locked(
                scheduler=scheduler, settings=settings, pool="learning"
            ) is False
            assert scheduler["model_attempts"] == 0
            assert scheduler["learning_model_attempts"] == 0

            settings["learning_llm_daily_budget"] = 6
            settings["proactive_llm_daily_budget"] = 0
            scheduler["proactive_model_budget_date"] = today
            scheduler["proactive_model_attempts"] = 0
            scheduler["proactive_model_successes"] = 0
            assert life._reserve_proactive_model_call_locked(
                scheduler=scheduler, settings=settings
            ) is False
            assert scheduler["proactive_model_attempts"] == 0
        finally:
            life.close()


def test_f6_sub_budget_settings_are_strongly_typed_and_accept_zero():
    with tempfile.TemporaryDirectory() as temporary:
        life = runtime(Path(temporary))
        try:
            status, body, _ = life.request(
                "POST",
                "/api/v1/v3/life/settings",
                {"settings": {
                    "learning_llm_daily_budget": 0,
                    "self_iteration_llm_daily_attempt_budget": 0,
                    "capability_patch_llm_daily_budget": 0,
                }},
            )
            assert status == 200, body
            status, body, _ = life.request(
                "POST",
                "/api/v1/v3/life/settings",
                {"settings": {"learning_llm_daily_budget": "0"}},
            )
            assert status >= 400
            assert body["error_code"] == "life.settings.integer_invalid"
        finally:
            life.close()
'''
