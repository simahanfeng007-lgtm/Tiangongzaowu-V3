name: P10 verified patch transfer

# Temporary developer transfer, NOT a product test or source-publication authority.
on:
  push:
    branches: [codex/capability-composition-p10-life-learning-cutover-v1]
    paths: [.github/workflows/p10-r1-transfer.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          submodules: false
      - name: Verify hash-pinned bytes and push one normal source checkpoint
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, json, lzma, os, pathlib, re, shutil, subprocess, urllib.request
          repo = "simahanfeng007-lgtm/Tiangongzaowu-V3"
          branch = "codex/capability-composition-p10-life-learning-cutover-v1"
          base = "1510f174745d6446729e4ab488a1a0276b3ed8c1"
          workflow = ".github/workflows/p10-r1-transfer.yml"
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          os.chdir(root)
          def git(*args, env=None):
              return subprocess.check_output(["git", "-c", "core.hooksPath=/dev/null", *args], env=env).decode().strip()
          assert os.environ["GITHUB_REPOSITORY"] == repo
          assert os.environ["GITHUB_REF"] == "refs/heads/" + branch
          head = git("rev-parse", "HEAD")
          assert head == os.environ["GITHUB_SHA"]
          assert git("rev-parse", "HEAD^") == base
          assert git("diff", "--name-only", base, head).splitlines() == [workflow]
          assert git("ls-remote", "origin", "refs/heads/" + branch).split()[0] == head
          assert not git("status", "--porcelain")
          chunks = [('72c30d49f9702c832c842042b9579cf1b06573ce', 4096), ('ea8d000283a0f56e7111bf11cc4b77b5bd12ac1e', 4096), ('e639235659f30428e4781a19d63378a3e33d369b', 4096), ('de72f117483d7825eb974f06cabe40f3e95063d3', 4096), ('035a124f78c35b1887ce1c6f340c33e46f0ec195', 4096), ('3b300912468a006ab411b26ba1d2b1003465e536', 4096), ('e6422847cc86d655090288e215fb8ce2983f44ed', 1900)]
          parts = []
          for sha, size in chunks:
              request = urllib.request.Request("https://api.github.com/repos/" + repo + "/git/blobs/" + sha,
                  headers={"Accept": "application/vnd.github+json", "Authorization": "Bearer " + os.environ["GH_TOKEN"]})
              with urllib.request.urlopen(request, timeout=30) as response:
                  item = json.load(response)
              assert item["encoding"] == "base64" and item["sha"] == sha
              raw = base64.b64decode(item["content"])
              assert len(raw) == size
              assert hashlib.sha1(b"blob " + str(len(raw)).encode() + b"\0" + raw).hexdigest() == sha
              parts.append(raw)
          compressed = b"".join(parts)
          assert len(compressed) == 26476
          assert hashlib.sha256(compressed).hexdigest() == "a0ed509b6f72dd8c87d32b94664f5b0425b10f8a7f8e7b3842afc19a0f6456f0"
          patch = lzma.decompress(compressed, memlimit=128*1024*1024)
          assert len(patch) == 143343
          assert hashlib.sha256(patch).hexdigest() == "3a7242182c58842a961f1d8c8d045986aa8afb9756219aa2b6a0f17077640ba5"
          # Read identities from the now hash-verified full-index patch, never from code.
          entries = re.findall(r"^diff --git a/([^\s]+) b/\1\n(?:new file mode 100644\n)?index ([0-9a-f]{40})\.\.([0-9a-f]{40})(?: 100644)?\n", patch.decode("utf-8"), re.M)
          assert len(entries) == 33 and len({p for p,b,a in entries}) == 33
          for path, before, after in entries:
              assert not path.startswith(".github/")
              row = git("ls-tree", "HEAD", "--", path)
              assert (not row) if before == "0"*40 else row.split()[0:3] == ["100644", "blob", before]
          folder = pathlib.Path(os.environ["RUNNER_TEMP"]) / "p10-applied-source"
          folder.mkdir(exist_ok=False)
          patch_path = folder / "P10_R1.patch"
          patch_path.write_bytes(patch)
          git("apply", "--check", "--index", "--whitespace=error-all", str(patch_path))
          git("apply", "--index", "--whitespace=error-all", str(patch_path))
          assert git("diff", "--cached", "--name-only").splitlines() == sorted(e[0] for e in entries)
          for path, before, after in entries:
              assert git("rev-parse", ":" + path) == after
              assert git("hash-object", "--no-filters", path) == after
          index = folder / "verified.index"
          shutil.copyfile(git("rev-parse", "--git-path", "index"), index)
          env = dict(os.environ, GIT_INDEX_FILE=str(index))
          git("update-index", "--force-remove", workflow, env=env)
          assert git("write-tree", env=env) == "eeff80b6248b48b82fffc7af892013cde017cdf2"
          index.unlink()
          git("config", "user.name", "github-actions[bot]")
          git("config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com")
          git("commit", "-m", "feat(p10): freeze legacy full capability publication [skip ci]", "-m",
              "Apply the exact locally verified R1 patch: 821 passed, 10 existing environment skips, 11 subtests passed. "
              "Knowledge and historical invocation remain; old publication/patch/retry/activation/projection paths fail closed. "
              "Declare Plane 1.8 with inherited coverage plus seven source authorities; no Golden corpus or permission bypass. "
              "This transport job does not run tests or claim remote/platform/model acceptance. "
              "No main merge, production deployment or R2 cutover is performed.")
          commit = git("rev-parse", "HEAD")
          assert git("ls-remote", "origin", "refs/heads/" + branch).split()[0] == head
          git("push", "origin", "HEAD:refs/heads/" + branch)
          assert git("ls-remote", "origin", "refs/heads/" + branch).split()[0] == commit
          result = {"baseline": base, "workflow_commit": head, "applied_commit": commit,
              "tree": git("rev-parse", "HEAD^{tree}"), "product_tree_without_transport": "eeff80b6248b48b82fffc7af892013cde017cdf2",
              "patch_sha256": hashlib.sha256(patch).hexdigest(),
              "verified_files": [{"path": p, "blob": a} for p,b,a in entries],
              "tests_run_by_this_job": False, "force_push": False, "main_updated": False}
          (folder / "result.json").write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          bundle = folder / "repository.bundle"
          git("bundle", "create", str(bundle), "HEAD")
          git("bundle", "verify", str(bundle))
          (folder / "SHA256SUMS.txt").write_text(hashlib.sha256(bundle.read_bytes()).hexdigest() + "  repository.bundle\n")
          print(json.dumps(result))
      - uses: actions/upload-artifact@v4
        with:
          name: p10-applied-${{ github.sha }}
          path: ${{ runner.temp }}/p10-applied-source/
          if-no-files-found: error
          retention-days: 7
