name: P10 R3-A exact P7 contract fix
on:
  push:
    branches: [codex/capability-composition-p10-life-learning-cutover-v1]
    paths: [.github/workflows/p10-r3-test-contract-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Replace absolute journal count with exact relative execution-tail invariant
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          path = Path('tests/test_gateway_worker_orchestration_cutpoints_p7d2.py')
          text = path.read_text(encoding='utf-8')
          anchor = '    life_id = str(life._active()["life_id"])\n'
          insertion = ('    baseline_status, baseline_journal, _ = life.request(\n'
                       '        "GET",\n'
                       '        "/api/v1/v3/life/journal/verify",\n'
                       '        None,\n'
                       '    )\n'
                       '    assert baseline_status == 200\n'
                       '    assert baseline_journal["valid"] is True\n'
                       '    baseline_event_count = int(baseline_journal["event_count"])\n')
          old_assert = '        assert journal["event_count"] == 1\n'
          new_assert = ('        # Exactly one durable execution.commit is added across the ambiguous\n'
                        '        # persist failure and strict recovery. Legitimate baseline Life journal\n'
                        '        # events (for example P10 migration telemetry) are not duplicate tails.\n'
                        '        assert journal["event_count"] == baseline_event_count + 1\n')
          assert text.count(anchor) == 1
          assert text.count(old_assert) == 1
          text = text.replace(anchor, anchor + insertion, 1).replace(old_assert, new_assert, 1)
          path.write_text(text, encoding='utf-8')
          subprocess.check_call(['git', 'rm', '-f', '.github/workflows/p10-r3-test-contract-fix.yml'])
          subprocess.check_call(['git', 'diff', '--check'])
          subprocess.check_call(['git', 'config', 'user.name', 'github-actions[bot]'])
          subprocess.check_call(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'])
          subprocess.check_call(['git', 'add', str(path)])
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert changed == ['.github/workflows/p10-r3-test-contract-fix.yml', 'tests/test_gateway_worker_orchestration_cutpoints_p7d2.py'], changed
          subprocess.check_call(['git', 'commit', '-m', 'test(p10): bind P7 tail recovery to journal baseline', '-m',
              'R3-A adds one legitimate signed migration observation-window event at Life startup. Preserve the original P7 guarantee by measuring the startup journal baseline and requiring exactly one additional durable execution commit across ambiguous persist failure and strict recovery. This directly constrains duplicate execution tails and does not relax product behavior or any gate.'])
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          subprocess.check_call(['git', 'push', 'origin', 'HEAD:refs/heads/codex/capability-composition-p10-life-learning-cutover-v1'])
          print(commit)
