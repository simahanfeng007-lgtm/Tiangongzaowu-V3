name: P10 R3-A verified transfer
on:
  push:
    branches: [codex/capability-composition-p10-life-learning-cutover-v1]
    paths: [.github/workflows/p10-r3-transfer.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: codex/capability-composition-p10-life-learning-cutover-v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact patch and push one normal R3-A commit
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib, json, lzma, os, subprocess, tempfile
          BASE='a73021008ec97629a3456f55ff99bba91225426e'
          EXPECT_XZ_SIZE=17040
          EXPECT_XZ_SHA='4bfa3d614bf0c7186dc1678f8c219f98d335a28a92f2d2e752845c4809f4f439'
          EXPECT_PATCH_SIZE=83556
          EXPECT_PATCH_SHA='bcc338a7cca4250840d79fd5208f818a930ea49c7b74d75a56e70484c061898f'
          EXPECT_TREE='be86e3925710d039387203b53903960501465b77'
          CHUNKS=(
            ('docs/capability-composition/.p10-r3-transfer/chunk0.b64',7000,'c3d56a8011adc5ea636223a0e7f1699593149895'),
            ('docs/capability-composition/.p10-r3-transfer/chunk1.b64',7000,'f3d4015dcb0451224d62bc027ff511e75e4136c5'),
            ('docs/capability-composition/.p10-r3-transfer/chunk2.b64',3040,'b6774c533a292caff7364a4000e18f1b44abd9ad'),
          )
          WORKFLOW='.github/workflows/p10-r3-transfer.yml'
          def git(*args):
              return subprocess.check_output(['git','-c','core.hooksPath=/dev/null',*args],text=True).strip()
          head=git('rev-parse','HEAD')
          assert head==os.environ['GITHUB_SHA']
          subprocess.check_call(['git','merge-base','--is-ancestor',BASE,head])
          expected_temp=sorted([p for p,_,_ in CHUNKS]+[WORKFLOW])
          assert git('diff','--name-only',BASE,head).splitlines()==expected_temp
          assert git('ls-remote','origin','refs/heads/'+os.environ['BRANCH']).split()[0]==head
          parts=[]
          for path,size,blob in CHUNKS:
              raw=base64.b64decode(Path(path).read_text(encoding='utf-8'),validate=True)
              assert len(raw)==size
              actual=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              assert actual==blob,(path,actual,blob)
              parts.append(raw)
          packed=b''.join(parts)
          assert len(packed)==EXPECT_XZ_SIZE
          assert hashlib.sha256(packed).hexdigest()==EXPECT_XZ_SHA
          patch=lzma.decompress(packed,memlimit=128*1024*1024)
          assert len(patch)==EXPECT_PATCH_SIZE
          assert hashlib.sha256(patch).hexdigest()==EXPECT_PATCH_SHA
          with tempfile.TemporaryDirectory() as td:
              patch_path=Path(td)/'r3a.patch'; patch_path.write_bytes(patch)
              subprocess.check_call(['git','-c','core.hooksPath=/dev/null','apply','--check','--index','--whitespace=error-all',str(patch_path)])
              subprocess.check_call(['git','-c','core.hooksPath=/dev/null','apply','--index','--whitespace=error-all',str(patch_path)])
          subprocess.check_call(['git','rm','-f',WORKFLOW,*[p for p,_,_ in CHUNKS]])
          assert git('write-tree')==EXPECT_TREE
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          subprocess.check_call(['git','-c','core.hooksPath=/dev/null','commit','-m',
            'feat(p10): migrate legacy learning records and record actual entry usage','-m',
            'R3-A: conservatively freeze/migrate legacy learning records through the existing signed Life journal; retain pending patches, active/history source pins and unknown ownership. Add actual Embedded-Life legacy mutation entry telemetry with restart replay and a bounded observation window. Verification Plane 1.11 retains prior coverage and adds this migration authority. Local targeted evidence: 93 passed, source authority and committed mirrors PASS; broader partial timeout is not counted. No destructive migration, zero-use claim, R4 work, main merge or permission expansion.'])
          commit=git('rev-parse','HEAD')
          assert git('rev-parse','HEAD^{tree}')==EXPECT_TREE
          assert git('ls-remote','origin','refs/heads/'+os.environ['BRANCH']).split()[0]==head
          subprocess.check_call(['git','push','origin','HEAD:refs/heads/'+os.environ['BRANCH']])
          assert git('ls-remote','origin','refs/heads/'+os.environ['BRANCH']).split()[0]==commit
          print(json.dumps({'source_commit':commit,'tree':EXPECT_TREE,'patch_sha256':EXPECT_PATCH_SHA,
                            'transport_tests_run':False,'force_push':False,'main_updated':False}))
