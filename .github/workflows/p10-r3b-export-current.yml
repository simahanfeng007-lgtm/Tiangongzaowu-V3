name: P10 R3-B exact-tree export
on:
  push:
    branches: [codex/capability-composition-p10-life-learning-cutover-v1]
    paths: [.github/workflows/p10-r3b-export-current.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact commit bundle and identity
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, os, subprocess
          out = Path(os.environ['RUNNER_TEMP'])/'p10-r3b-export'; out.mkdir()
          head = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          tree = subprocess.check_output(['git','rev-parse','HEAD^{tree}'], text=True).strip()
          bundle = out/'repository.bundle'
          subprocess.check_call(['git','bundle','create',str(bundle),'HEAD'])
          subprocess.check_call(['git','bundle','verify',str(bundle)])
          result = {'head':head,'tree':tree,'bundle_sha256':hashlib.sha256(bundle.read_bytes()).hexdigest(),
                    'product_tests_run':False,'main_updated':False,'force_push':False}
          (out/'result.json').write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result))
      - uses: actions/upload-artifact@v4
        with:
          name: p10-r3b-export-${{ github.sha }}
          path: ${{ runner.temp }}/p10-r3b-export/
          if-no-files-found: error
          retention-days: 7
