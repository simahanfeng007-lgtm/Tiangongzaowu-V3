name: P11 formal shadow focused gate

on:
  push:
    branches:
      - 'codex/capability-composition-p11-*'
    paths:
      - src/contracts/**
      - src/world_understanding/capability_composition/**
      - src/world_understanding/context_output/**
      - src/total_gateway/composition_activation_shadow.py
      - src/total_gateway/skill_selection.py
      - tests/test_capability_formal_shadow_p11.py
      - tests/test_capability_composition_p4.py
      - tests/test_capability_context_evaluation_p6.py
      - tests/test_composition_activation_shadow_p7a.py
      - tests/test_skill_selection.py
      - docs/capability-composition/**
      - source-ownership.json
      - .github/workflows/p11-formal-shadow-focused.yml
  pull_request:
    branches:
      - main
    paths:
      - src/contracts/**
      - src/world_understanding/capability_composition/**
      - src/world_understanding/context_output/**
      - src/total_gateway/composition_activation_shadow.py
      - src/total_gateway/skill_selection.py
      - tests/test_capability_formal_shadow_p11.py
      - tests/test_capability_composition_p4.py
      - tests/test_capability_context_evaluation_p6.py
      - tests/test_composition_activation_shadow_p7a.py
      - tests/test_skill_selection.py
      - docs/capability-composition/**
      - source-ownership.json
      - .github/workflows/p11-formal-shadow-focused.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    name: p11-formal-shadow-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked source dependencies
        run: python -m pip install -r requirements-source.lock
      - name: Check source authority and committed mirrors
        run: |
          python scripts/check-source-authority.py
          python scripts/sync-generated-sources.py --check-committed
      - name: Build content-addressed recorded matrix evidence
        shell: python
        run: |
          from pathlib import Path
          import json, runpy, subprocess, sys
          repo_root = Path.cwd()
          sys.path[:0] = [str(repo_root), str(repo_root/'src')]
          fixtures = runpy.run_path('tests/test_capability_formal_shadow_p11.py')
          _cases, _faults = fixtures['_cases'], fixtures['_faults']
          from world_understanding.capability_composition import build_p11_formal_shadow_report
          out = Path('output/p11-r0')
          out.mkdir(parents=True, exist_ok=True)
          report = build_p11_formal_shadow_report(
              _cases(), _faults(), evidence_mode='RECORDED_FIXTURE'
          )
          assert report.has_valid_sha256()
          assert report.formal_gate_passed
          assert not report.cutover_gate_passed
          assert report.cutover_blockers == (
              'p11.independent_production_review.required',
              'p11.production_shadow_trace.required',
          )
          payload = {**report.payload(), 'report_sha256': report.report_sha256}
          (out/'recorded-matrix.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=1, sort_keys=True),
              encoding='utf-8',
              newline='\n',
          )
          (out/'identity.json').write_text(
              json.dumps({
                  'head': subprocess.check_output(
                      ['git', 'rev-parse', 'HEAD'], text=True
                  ).strip(),
                  'evidence_mode': report.evidence_mode,
                  'formal_gate_passed': report.formal_gate_passed,
                  'cutover_gate_passed': report.cutover_gate_passed,
                  'cutover_blockers': list(report.cutover_blockers),
                  'task_count': report.task_count,
                  'model_observation_count': report.model_observation_count,
                  'fault_case_count': report.fault_case_count,
                  'report_sha256': report.report_sha256,
              }, ensure_ascii=False, indent=1, sort_keys=True),
              encoding='utf-8',
              newline='\n',
          )
      - name: Run focused P4-P7A-P11 regression
        run: >-
          python -m pytest -q
          tests/test_capability_formal_shadow_p11.py
          tests/test_capability_composition_p4.py
          tests/test_capability_composition_p4_hardening.py
          tests/test_capability_context_evaluation_p6.py
          tests/test_composition_activation_shadow_p7a.py
          tests/test_skill_selection.py
          --junitxml=output/p11-r0/tests.xml
      - name: Preserve exact-head recorded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p11-formal-shadow-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: output/p11-r0/
          if-no-files-found: error
          retention-days: 90
