name: P12 R1A sandbox repair preparation (temporary)

on:
  push:
    branches: [codex/capability-composition-p12-retirement-preflight-v1]
    paths:
      - docs/capability-composition/p12-alias-repair.patch
      - docs/capability-composition/p12-alias-tests.py
      - scripts/_prepare_p12_alias_repair.py
      - .github/workflows/p12-alias-repair-preparation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-and-observe:
    if: github.repository == 'simahanfeng007-lgtm/Tiangongzaowu-V3' && github.ref == 'refs/heads/codex/capability-composition-p12-retirement-preflight-v1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing locked source-test environment
        run: python scripts/install-python-dependencies.py --requirements requirements-source.lock
      - name: Prepare exact repair through existing mirror and freeze generators
        run: python scripts/_prepare_p12_alias_repair.py
      - name: Transfer generated content objects only (no refs or commits)
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/_prepare_p12_alias_repair.py upload
      - name: Original diagnostics, new alias regressions and unchanged product tests
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'p12-repair-evidence'
          env = os.environ.copy()
          for key in ('UPDATE_FREEZE', 'UPDATE_FINGERPRINT', 'UPDATE_GOLDEN', 'UPDATE_PERF', 'GH_TOKEN'):
              env.pop(key, None)
          commands = [
              ('historical-diagnostics', [sys.executable, '-m', 'unittest', 'discover', '-s', 'tests', '-p', 'test_p12_retirement*.py', '-v']),
              ('alias-regressions', [sys.executable, '-m', 'pytest', '-q', 'tests/test_sandbox_workspace_alias_p12.py']),
              ('unchanged-product-regressions', [sys.executable, '-m', 'pytest', '-q', '-ra', 'tests/test_composition_execution_manifest_p7d1.py', 'tests/test_tool_manifest_loading_p8.py', 'tests/test_composition_grant_authority_p7d2.py', 'tests/test_composition_step_execution_p7d1.py', 'tests/test_foundation_closeout.py', '--junitxml=' + str(out / 'product-regressions.xml')]),
          ]
          failed = False
          for name, cmd in commands:
              result = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, env=env)
              (out / (name + '.log')).write_bytes(result.stdout)
              print(name + '\n' + result.stdout.decode('utf-8', errors='replace'), flush=True)
              failed = failed or result.returncode != 0
          raise SystemExit(1 if failed else 0)
      - name: Preserve exact preparation and native observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p12-alias-repair-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/p12-repair-evidence/
          if-no-files-found: error
          retention-days: 90
