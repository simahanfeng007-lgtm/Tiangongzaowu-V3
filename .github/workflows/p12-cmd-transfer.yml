name: P12 exact content transport (temporary)
on:
  push:
    branches: [codex/capability-composition-p12-retirement-preflight-v1]
    paths: [.codex/p12-cmd-transfer.patch, .github/workflows/p12-cmd-transfer.yml]
permissions:
  contents: read
jobs:
  transport:
    if: github.repository == 'simahanfeng007-lgtm/Tiangongzaowu-V3' && github.ref == 'refs/heads/codex/capability-composition-p12-retirement-preflight-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Transfer only locally generated exact content objects, never refs
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          repo = 'simahanfeng007-lgtm/Tiangongzaowu-V3'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip() == os.environ['GITHUB_SHA']
          subprocess.run(['git','merge-base','--is-ancestor','10e2759f04d807517aa529a2f467670a5020deca','HEAD'],check=True)
          subprocess.run(['git','diff','--quiet','HEAD','--'],check=True)
          patch = pathlib.Path('.codex/p12-cmd-transfer.patch').read_bytes()
          def blob(raw):
              return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert blob(patch) == 'edd8e20fc33211e78754f633efc6c58ed6acf714'
          expected = {
              '.github/workflows/p12-retirement-preflight.yml':'532d1a5bc8e1f5c4e69bff55dd9a3345e8a14bd9',
              'docs/p19-r2/m6/VERIFICATION_PLANE_FREEZE.json':'ab8cbb51b5cbb7a2483dccbabde029da1639b7e8',
              'readable-python-source/omni_body_skill/.tiangong-generated-source.json':'b091d60b37ced04a902f947cdc46ddb141cc9d56',
              'src/omni_body_skill/tools/sandbox_runtime.py':'20e91e29d1790e6356bc4f4716dd7918d89014c4',
              'src/total_gateway/verification_plane.py':'19f9caef560d8a4837cc3379aaa403815e598a54',
              'tests/golden/p19_r2/test_freeze_and_guards.py':'12e9590a9d52bff27f2893b94b7c77a9b0ee681f',
              'tests/test_composition_activation_store_p7b2.py':'8dc9faecf2d32cc5decb42800ad1d6a8a3732db1',
          }
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          actual = set(subprocess.check_output(['git','diff','--name-only']).decode().splitlines())
          assert actual == set(expected), actual
          for path, sha in expected.items():
              raw = pathlib.Path(path).read_bytes()
              assert blob(raw) == sha, path
          # This is object transport, not a test or a prepared-product acceptance.
          for path, sha in expected.items():
              raw = pathlib.Path(path).read_bytes()
              request = urllib.request.Request('https://api.github.com/repos/'+repo+'/git/blobs',
                  data=json.dumps({'content':base64.b64encode(raw).decode(),'encoding':'base64'}).encode(),
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request,timeout=30) as response:
                  result=json.load(response)
              assert result['sha'] == sha, path
          print('P12_TRANSPORT_RECEIPT='+json.dumps({'observer_head':os.environ['GITHUB_SHA'],'objects':expected,'product_acceptance':False,'ref_writes':False},sort_keys=True))
