name: P12 native path API observation (temporary)
on:
  push:
    branches: [codex/capability-composition-p12-retirement-preflight-v1]
    paths: [scripts/diagnose-p12-cmd-native-path.py, .github/workflows/p12-native-path-api.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-path:
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      PYTHONUTF8: '1'
      TIANGONG_SANDBOX_COMPAT: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Observe Win32 APIs and CMD under the unchanged native launcher
        run: python scripts/diagnose-p12-cmd-native-path.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p12-native-path-${{ github.sha }}
          path: ${{ runner.temp }}/p12-path-observation/
          if-no-files-found: error
          retention-days: 90
