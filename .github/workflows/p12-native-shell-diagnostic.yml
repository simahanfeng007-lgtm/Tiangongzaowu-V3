name: P12 native shell initialization probe (temporary)
on:
  push:
    branches: [codex/capability-composition-p12-retirement-preflight-v1]
    paths: [.github/workflows/p12-native-shell-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      TIANGONG_SANDBOX_COMPAT: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Observe explicit shell bootstrap and same-workspace path representations
        shell: python
        run: |
          import base64, ctypes, hashlib, importlib, json, os, pathlib, shutil, subprocess, sys, tempfile, time, types
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'p12-native-shell'
          out.mkdir()
          source = pathlib.Path('src/omni_body_skill/tools/sandbox_runtime.py')
          assert hashlib.sha256(source.read_bytes()).hexdigest() == 'f18aaef51a8446168af57e54be9ef885c55188202f0975b51e91b19df77fa501'
          subprocess.run(['git', 'apply', '--check', 'docs/capability-composition/p12-alias-repair.patch'], check=True)
          subprocess.run(['git', 'apply', 'docs/capability-composition/p12-alias-repair.patch'], check=True)
          pkg = types.ModuleType('p12_probe_tools')
          pkg.__path__ = [str(source.parent.resolve())]
          sys.modules[pkg.__name__] = pkg
          s = importlib.import_module('p12_probe_tools.sandbox_runtime')
          w = importlib.import_module('p12_probe_tools.windows_appcontainer')
          original, events = w.run_appcontainer, []
          case_name, mode = '', ''
          bootstrap = '$savedAutoload=$PSModuleAutoLoadingPreference;$PSModuleAutoLoadingPreference="None";Import-Module ($PSHOME+"\\Modules\\Microsoft.PowerShell.Management\\Microsoft.PowerShell.Management.psd1") -ErrorAction Stop;Import-Module ($PSHOME+"\\Modules\\Microsoft.PowerShell.Utility\\Microsoft.PowerShell.Utility.psd1") -ErrorAction Stop;'
          def capture(command, *, cwd, env, limits, sandbox_root):
              revised = command
              if mode.startswith('ps'):
                  assert not isinstance(command, str) and command[-2] == '-EncodedCommand'
                  inner = base64.b64decode(command[-1]).decode('utf-16-le')
                  prefix = bootstrap + ('$PSModuleAutoLoadingPreference=$savedAutoload;' if mode == 'ps-restore' else '')
                  revised = [*command[:-1], base64.b64encode((prefix + inner).encode('utf-16-le')).decode('ascii')]
              elif mode == 'extended':
                  revised = str(command).replace(str(cwd), '\\\\?\\' + str(cwd))
              elif mode == 'short':
                  buf = ctypes.create_unicode_buffer(32768)
                  n = ctypes.windll.kernel32.GetShortPathNameW(str(cwd), buf, len(buf))
                  if not 0 < n < len(buf):
                      raise RuntimeError('Cannot inspect same-workspace short spelling')
                  revised = str(command).replace(str(cwd), buf.value)
              event = {'case':case_name, 'mode':mode, 'cwd':str(cwd), 'command':revised if isinstance(revised,str) else revised[:4]}
              started = time.monotonic()
              try:
                  result = original(revised, cwd=cwd, env=env, limits=limits, sandbox_root=sandbox_root)
                  event.update(returncode=result[0], stdout=result[1].decode('utf-8', errors='replace')[:2500], stderr=result[2].decode('utf-8', errors='replace')[:2500])
                  return result
              except Exception as exc:
                  event['error'] = type(exc).__name__ + ': ' + str(exc)
                  raise
              finally:
                  event['elapsed'] = round(time.monotonic() - started,3)
                  for key in ('stdout','stderr'):
                      p=sandbox_root/(key+'.bin')
                      if key not in event and p.exists(): event[key]=p.read_bytes()[:2500].decode('utf-8',errors='replace')
                  events.append(event)
                  (out/'events.json').write_text(json.dumps(events,ensure_ascii=False,indent=2),encoding='utf-8')
                  print('P12_INIT_EVENT='+json.dumps(event,ensure_ascii=False),flush=True)
          w.run_appcontainer = capture
          with tempfile.TemporaryDirectory() as td:
              root=pathlib.Path(td); workspace=root/'工作 区'; project=workspace/'project'; project.mkdir(parents=True)
              cmd=os.environ.get('COMSPEC') or 'cmd.exe'
              quoted=subprocess.list2cmdline([cmd])
              body=f'cd /d "{project}" && echo sandbox-ok>result.txt'
              absolute=f'{quoted} /d /s /c "{body}"'
              cases=[
                ('cmd-cwd-observation','',[cmd,'/d','/s','/c','echo CWD=%CD% & cd /d project & echo CHILD=%CD%']),
                ('cmd-absolute-argv','',[cmd,'/d','/s','/c',body]),
                ('cmd-absolute-no-s','',absolute.replace(' /s ', ' ',1)),
                ('cmd-extended','extended',absolute),
                ('cmd-short','short',absolute),
                ('cmd-directory-list','',f'{quoted} /d /s /c dir /b "{project}"'),
                ('ps-wrapper-preload','ps',[s.WINDOWS_POWERSHELL_SHELL_MARKER,'Set-Content -NoNewline -LiteralPath legacy.txt -Value sandboxed']),
                ('ps-wrapper-preload-restore','ps-restore',[s.WINDOWS_POWERSHELL_SHELL_MARKER,'Set-Content -NoNewline -LiteralPath legacy.txt -Value sandboxed']),
                ('ps-wrapper-error','ps',[s.WINDOWS_POWERSHELL_SHELL_MARKER,"Write-Error 'sandbox failure'; exit 7"]),
                ('cmd-marked-preload','ps',[s.WINDOWS_UTF8_SHELL_MARKER,'echo marker-ok>marker.txt']),
              ]
              for name,variant,command in cases:
                  case_name,mode=name,variant
                  runner=s.SandboxRunner(workspace,root/'state',root/'trash',s.SandboxLimits(timeout_seconds=20))
                  try:
                      result=runner.run(command,cwd=workspace,op_id='p12-init-'+name)
                      readback={p.name:p.read_text(encoding='utf-8',errors='replace') for p in (workspace/'legacy.txt',workspace/'marker.txt',project/'result.txt') if p.exists()}
                      print('P12_INIT_RESULT='+json.dumps({'case':name,'returncode':result['returncode'],'containment':result['containment'],'changed_files':result['changed_files'],'readback':readback},ensure_ascii=False),flush=True)
                  except Exception as exc:
                      print('P12_INIT_ERROR='+json.dumps({'case':name,'error':str(exc)},ensure_ascii=False),flush=True)
                  for p in (workspace/'legacy.txt',workspace/'marker.txt',project/'result.txt'):
                      p.unlink(missing_ok=True)
          (out/'identity.json').write_text(json.dumps({'observer_commit':os.environ['GITHUB_SHA'],'prepared_source_sha256':hashlib.sha256(source.read_bytes()).hexdigest(),'diagnostic_only':True,'product_acceptance':False,'permissions_changed':False,'timeout_seconds':20},indent=2),encoding='utf-8')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p12-native-initialization-${{ github.sha }}
          path: ${{ runner.temp }}/p12-native-shell/
          if-no-files-found: error
          retention-days: 90
