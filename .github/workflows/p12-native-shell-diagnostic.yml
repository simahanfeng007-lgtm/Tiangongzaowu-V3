name: P12 native shell environment probe (temporary)
on:
  push:
    branches: [codex/capability-composition-p12-retirement-preflight-v1]
    paths: [.github/workflows/p12-native-shell-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      TIANGONG_SANDBOX_COMPAT: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare bounded shell environment hypotheses under unchanged AppContainer
        shell: python
        run: |
          import base64, hashlib, importlib, json, os, pathlib, shutil, subprocess, sys, tempfile, time, types
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'p12-native-shell'
          out.mkdir()
          source = pathlib.Path('src/omni_body_skill/tools/sandbox_runtime.py')
          assert hashlib.sha256(source.read_bytes()).hexdigest() == 'f18aaef51a8446168af57e54be9ef885c55188202f0975b51e91b19df77fa501'
          subprocess.run(['git', 'apply', '--check', 'docs/capability-composition/p12-alias-repair.patch'], check=True)
          subprocess.run(['git', 'apply', 'docs/capability-composition/p12-alias-repair.patch'], check=True)
          pkg = types.ModuleType('p12_probe_tools')
          pkg.__path__ = [str(source.parent.resolve())]
          sys.modules[pkg.__name__] = pkg
          s = importlib.import_module('p12_probe_tools.sandbox_runtime')
          w = importlib.import_module('p12_probe_tools.windows_appcontainer')
          original, events = w.run_appcontainer, []
          ps = shutil.which('powershell.exe')
          assert ps
          modules = str(pathlib.Path(ps).parent / 'Modules')
          case_name, mode = '', ''
          def capture(command, *, cwd, env, limits, sandbox_root):
              revised = dict(env)
              added = {}
              if mode in {'drive', 'all'}:
                  added['=' + cwd.drive.upper()] = str(cwd)
              if mode in {'modules', 'all'}:
                  added['PSModulePath'] = modules
              if mode in {'cache', 'all'}:
                  added['PSModuleAnalysisCachePath'] = str(cwd.parent / 'ModuleAnalysisCache')
              if mode == 'profile':
                  for name in ('USERPROFILE', 'HOME', 'APPDATA'):
                      added[name] = str(cwd.parent)
                  added['SystemDrive'] = cwd.drive
                  added['PSModulePath'] = modules
              revised.update(added)
              event = {'case': case_name, 'mode': mode, 'added_environment': added, 'cwd': str(cwd)}
              started = time.monotonic()
              try:
                  result = original(command, cwd=cwd, env=revised, limits=limits, sandbox_root=sandbox_root)
                  event.update(returncode=result[0], stdout=result[1].decode('utf-8', errors='replace')[:1500], stderr=result[2].decode('utf-8', errors='replace')[:1500])
                  return result
              except Exception as exc:
                  event['error'] = type(exc).__name__ + ': ' + str(exc)
                  raise
              finally:
                  event['elapsed'] = round(time.monotonic() - started, 3)
                  for key in ('stdout', 'stderr'):
                      p = sandbox_root / (key + '.bin')
                      if key not in event and p.exists():
                          event[key] = p.read_bytes()[:1500].decode('utf-8', errors='replace')
                  events.append(event)
                  (out / 'events.json').write_text(json.dumps(events, ensure_ascii=False, indent=2), encoding='utf-8')
                  print('P12_ENV_EVENT=' + json.dumps(event, ensure_ascii=False), flush=True)
          w.run_appcontainer = capture
          def encoded(script):
              return [ps, '-NoLogo', '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-EncodedCommand', base64.b64encode(script.encode('utf-16-le')).decode('ascii')]
          with tempfile.TemporaryDirectory() as td:
              root = pathlib.Path(td)
              workspace = root / '工作 区'
              project = workspace / 'project'
              project.mkdir(parents=True)
              cmd = os.environ.get('COMSPEC') or 'cmd.exe'
              cmd_absolute = f'{subprocess.list2cmdline([cmd])} /d /s /c "cd /d "{project}" && echo native-ok>result.txt"'
              ps_write = '[Console]::WriteLine("BEFORE"); Set-Content -NoNewline -LiteralPath direct.txt -Value sandboxed; [Console]::WriteLine("AFTER");exit 0'
              ps_import = '$PSModuleAutoLoadingPreference="None"; [Console]::WriteLine("IMPORT_START"); Import-Module ($PSHOME+"\\Modules\\Microsoft.PowerShell.Management\\Microsoft.PowerShell.Management.psd1") -ErrorAction Stop; [Console]::WriteLine("IMPORTED");' + ps_write
              cases = [
                  ('cmd-absolute-drive-env', 'drive', cmd_absolute),
                  ('cmd-absolute-no-drive-switch', '', cmd_absolute.replace('cd /d ', 'cd ', 1)),
                  ('ps-module-path', 'modules', encoded(ps_write)),
                  ('ps-cache-path', 'cache', encoded(ps_write)),
                  ('ps-all-environment', 'all', encoded(ps_write)),
                  ('ps-private-profile', 'profile', encoded(ps_write)),
                  ('ps-explicit-management', 'modules', encoded(ps_import)),
                  ('ps-wrapper-all', 'all', [s.WINDOWS_POWERSHELL_SHELL_MARKER, ps_write]),
              ]
              for name, env_mode, command in cases:
                  case_name, mode = name, env_mode
                  runner = s.SandboxRunner(workspace, root/'state', root/'trash', s.SandboxLimits(timeout_seconds=20))
                  try:
                      result = runner.run(command, cwd=workspace, op_id='p12-env-' + name)
                      print('P12_ENV_RESULT=' + json.dumps({'case':name, 'returncode':result['returncode'], 'containment':result['containment']}, ensure_ascii=False), flush=True)
                  except Exception as exc:
                      print('P12_ENV_ERROR=' + json.dumps({'case':name, 'error':str(exc)}, ensure_ascii=False), flush=True)
          (out / 'identity.json').write_text(json.dumps({'observer_commit':os.environ['GITHUB_SHA'], 'prepared_source_sha256':hashlib.sha256(source.read_bytes()).hexdigest(), 'diagnostic_only':True, 'product_acceptance':False, 'permissions_changed':False, 'timeout_seconds':20}, indent=2), encoding='utf-8')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p12-native-environment-${{ github.sha }}
          path: ${{ runner.temp }}/p12-native-shell/
          if-no-files-found: error
          retention-days: 90
