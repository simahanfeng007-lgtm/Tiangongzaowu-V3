name: P12 retirement preflight (read-only)

on:
  push:
    branches:
      - codex/capability-composition-p12-retirement-preflight-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p12-retirement-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: p12-preflight-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      EXPECTED_HEAD: ${{ github.sha }}
      BASELINE_HEAD: bf29542b3048c8d1806add8063b0db7c72be055b
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic Git contract tests
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'p12-evidence'
          out.mkdir(parents=True, exist_ok=True)
          result = subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', 'tests', '-p', 'test_p12_retirement_preflight.py', '-v'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          (out / 'tests.log').write_bytes(result.stdout)
          print(result.stdout.decode('utf-8', errors='replace'))
          raise SystemExit(result.returncode)
      - name: Exact-commit inventory and no-production-change check
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess, sys
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'p12-evidence'
          result = subprocess.run([sys.executable, 'scripts/audit-p12-static-skill-retirement.py', '--expected-head', os.environ['EXPECTED_HEAD'], '--baseline-head', os.environ['BASELINE_HEAD']], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          (out / 'inventory.json').write_bytes(result.stdout)
          (out / 'inventory.stderr.log').write_bytes(result.stderr)
          print(result.stderr.decode('utf-8', errors='replace'))
          if result.returncode:
              raise SystemExit(result.returncode)
          report = json.loads(result.stdout)
          identity = {key: report[key] for key in ('head', 'baseline_head', 'tree', 'observer_sha256', 'report_sha256', 'evidence_mode', 'r0_scope_passed', 'p12_authorized', 'retirement_authorized', 'production_zero_usage_proven')}
          identity['inventory_file_sha256'] = hashlib.sha256(result.stdout).hexdigest()
          identity['scanned_file_count'] = len(report['scanned_inputs'])
          identity['unscanned_file_count'] = len(report['unscanned_inputs'])
          identity['reference_file_counts'] = {key: len(rows) for key, rows in report['findings'].items()}
          (out / 'identity.json').write_bytes((json.dumps(identity, ensure_ascii=False, sort_keys=True, indent=2) + '\n').encode('utf-8'))
          print(json.dumps(identity, ensure_ascii=False, sort_keys=True, indent=2))
      - name: Preserve original diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p12-retirement-preflight-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/p12-evidence/
          if-no-files-found: error
          retention-days: 90
