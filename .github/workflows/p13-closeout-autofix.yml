name: P13 closeout autofix

on:
  push:
    branches:
      - agent/world-understanding-v0.1
    paths:
      - .github/workflows/p13-closeout-autofix.yml

permissions:
  contents: write

jobs:
  apply-closeout-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout P13 branch
        uses: actions/checkout@v4
        with:
          ref: agent/world-understanding-v0.1
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Align P8/P9/P12 tests with frozen contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          p8 = "tests/test_world_understanding_p8_semantic_pipeline.py"
          replace_once(
              p8,
              "from contracts.cognition_statement import CognitionStatement, CognitionValue",
              "from contracts.cognition_statement import CognitionStatement, CognitionValue, derive_cognition_id",
          )
          replace_once(
              p8,
              '    cid = "cog_" + canonical_sha256({"p8": "cognition"})',
              '    cid = derive_cognition_id(life_id=sc.life_id, domain="software", world_scope_hash=sc.world_scope_hash, principal_scope_hash=sc.principal_scope_hash, claim_kind="boundary", subject_ref="subject.1", predicate="is_boundary", condition_sha256=None)',
          )

          p9 = "tests/test_world_understanding_p9_world_state.py"
          replace_once(
              p9,
              "from contracts.cognition_statement import CognitionStatement, CognitionValue",
              "from contracts.cognition_statement import CognitionStatement, CognitionValue, derive_cognition_id",
          )
          replace_once(
              p9,
              "    scope=scope or sc(); cid='cog_'+canonical_sha256({'p9':'cog'})",
              "    scope=scope or sc(); cid=derive_cognition_id(life_id=scope.life_id,domain='software',world_scope_hash=scope.world_scope_hash,principal_scope_hash=scope.principal_scope_hash,claim_kind='boundary',subject_ref='subject.1',predicate='is_boundary',condition_sha256=None)",
          )
          replace_once(
              p9,
              "supporting_evidence_ids=('cev_'+'1'*64,'cev_'+'2'*64)",
              "supporting_evidence_ids=('cev_'+'1'*64,'cev_'+'2'*64,'cev_'+'3'*64)",
          )

          p12 = "tests/test_world_understanding_p12_dynamics.py"
          replace_once(
              p12,
              '        TransformCostObservation("world.semantic.l4", "v1", 1, 1, 10+i, 1, 20+i, 100+i, 10+i, True, None, 1000+i)',
              '        TransformCostObservation(transform_id="world.semantic.l4", transform_version="v1", input_count=1, output_count=1, token_cost=10+i, cpu_time_ms=1, wall_time_ms=20+i, io_bytes=100+i, llm_latency_ms=10+i, success=True, failure_type=None, created_at_ms=1000+i)',
          )
          PY

      - name: Regenerate authoritative mirrors
        run: |
          python scripts/sync-generated-sources.py --write
          python scripts/sync-generated-sources.py --check

      - name: Install source-runtime test dependencies
        run: python -m pip install -r requirements-source.lock

      - name: Run focused World Understanding regression set
        run: python -m pytest -q tests/test_world_understanding_p8_semantic_pipeline.py tests/test_world_understanding_p9_world_state.py tests/test_world_understanding_p12_dynamics.py

      - name: Remove one-shot helper and commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p13-closeout-autofix.yml
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No closeout changes to commit"
            exit 0
          fi
          git commit -m "P13 closeout: align contracts and generated mirrors"
          git push origin HEAD:agent/world-understanding-v0.1
