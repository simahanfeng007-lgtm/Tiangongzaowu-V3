name: P13 closeout validation

on:
  push:
    branches:
      - agent/world-understanding-v0.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-validation:
    name: full-validation-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout authoritative branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Record pre-fix generated-source state
        continue-on-error: true
        run: python scripts/sync-generated-sources.py --check

      - name: Regenerate existing generated-source mirrors
        run: python scripts/sync-generated-sources.py --write

      - name: Print regenerated life-service marker
        run: python -c "from pathlib import Path; print(Path('app/life-service/runtime314/life_service/.tiangong-generated-source.json').read_text(encoding='utf-8'))"

      - name: Verify generated-source mirrors after regeneration
        run: python scripts/sync-generated-sources.py --check

      - name: Show regeneration diff
        run: git diff --stat && git diff --name-only

      - name: Compile authoritative Python source
        run: python -m compileall -q src

      - name: Install source-runtime test dependencies
        run: python -m pip install -r requirements-source.lock

      - name: Run full repository pytest
        run: python -m pytest -q
