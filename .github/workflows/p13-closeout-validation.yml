name: P13 closeout validation

on:
  push:
    branches:
      - agent/world-understanding-v0.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-validation:
    name: full-validation-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout authoritative branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify committed generated-source mirrors
        run: python scripts/sync-generated-sources.py --check-committed

      - name: Verify checkout remains clean
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          status = subprocess.check_output(
              ["git", "status", "--porcelain", "--untracked-files=all"],
              text=True,
          ).strip()
          if status:
              print(status)
              raise SystemExit("P13 validation must not mutate the committed checkout")
          print("committed checkout is clean")
          PY

      - name: Compile authoritative Python source
        run: python -m compileall -q src

      - name: Install source-runtime test dependencies
        run: python -m pip install -r requirements-source.lock

      - name: Run full repository pytest
        run: python -m pytest -q
