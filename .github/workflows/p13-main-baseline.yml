name: P13 current-main baseline

on:
  push:
    branches:
      - agent/world-understanding-v0.1
    paths:
      - .github/workflows/p13-main-baseline.yml

permissions:
  contents: read

jobs:
  baseline:
    name: main-baseline-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Compile authoritative Python source
        run: python -m compileall -q src

      - name: Install source-runtime test dependencies
        run: python -m pip install -r requirements-source.lock

      - name: Run full repository pytest
        run: python -m pytest -q
