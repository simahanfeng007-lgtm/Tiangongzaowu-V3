name: P13 portable marker rehash

on:
  push:
    branches:
      - agent/world-understanding-v0.1
    paths:
      - .github/workflows/p13-marker-rehash.yml

permissions:
  contents: write

jobs:
  rehash:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout P13 branch
        uses: actions/checkout@v4
        with:
          ref: agent/world-understanding-v0.1
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate mirrors and portable markers
        run: |
          python scripts/sync-generated-sources.py --write
          python scripts/sync-generated-sources.py --check

      - name: Commit tracked marker updates and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p13-marker-rehash.yml
          git add -u
          git status --short
          git commit -m "P13 closeout: regenerate portable generated-source markers"
          git push origin HEAD:agent/world-understanding-v0.1
