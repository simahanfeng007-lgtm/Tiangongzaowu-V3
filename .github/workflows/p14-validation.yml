name: P14 repository perception validation

on:
  push:
    branches:
      - agent/repository-perception-life-learning-p14
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m3-focused:
    name: m3-focused-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout P14 branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install source-runtime dependencies
        run: python -m pip install -r requirements-source.lock

      - name: Compile M2-M3 production surface
        run: >-
          python -m compileall -q
          src/contracts/world_understanding/repository_structure.py
          src/contracts/world_understanding/repository_query.py
          src/world_understanding/source_compilers/git_code.py
          src/world_understanding/source_compilers/p3.py
          src/world_understanding/software_world/git_observation.py
          src/world_understanding/software_world/perception.py
          src/world_understanding/software_world/relation.py
          src/world_understanding/software_world/query.py
          src/world_understanding/software_world/updater.py
          src/world_understanding/production.py
          app/backend/tiangong-backend/v3/repository_structure.py
          app/backend/tiangong-backend/v3/repository_perception.py
          app/backend/tiangong-backend/v3/world_understanding_production.py
          tests/test_repository_structure_p14_m2.py
          tests/test_repository_structure_p14_m2_wiring.py
          tests/test_repository_query_p14_m3.py
          tests/test_repository_query_p14_m3_wiring.py

      - name: Run M2-M3 repository regression
        run: >-
          python -m pytest -q
          tests/test_repository_structure_p14_m2.py
          tests/test_repository_structure_p14_m2_wiring.py
          tests/test_repository_query_p14_m3.py
          tests/test_repository_query_p14_m3_wiring.py

      - name: Run P3-P13 boundary regression
        run: >-
          python -m pytest -q
          tests/test_world_understanding_p3_sources_life_isolation.py
          tests/test_world_understanding_p13_counterexamples.py
          tests/test_world_understanding_p13_full_chain.py
          tests/test_world_understanding_p13_failure_recovery.py
          tests/test_world_understanding_p13_stress_performance.py

  full-regression:
    name: full-regression-ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout P14 branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Report generated-source logical tree hashes
        shell: bash
        run: |
          python - <<'PY'
          import json
          import runpy
          from pathlib import Path
          module = runpy.run_path("scripts/sync-generated-sources.py")
          config = json.loads(Path("source-ownership.json").read_text(encoding="utf-8"))
          for mapping in config["mappings"]:
              if not mapping.get("targets"):
                  continue
              source = Path(str(mapping["source"]))
              if not source.exists():
                  continue
              rows = module["mapping_files"](source)
              print(mapping["id"], "file_count", len(rows), "tree_sha256", module["tree_hash"](rows))
          PY

      - name: Verify generated-source mirrors
        run: python scripts/sync-generated-sources.py --check-committed

      - name: Install source-runtime dependencies
        run: python -m pip install -r requirements-source.lock

      - name: Compile authoritative Python source
        run: python -m compileall -q src app/backend/tiangong-backend/v3

      - name: Run full repository pytest
        run: python -m pytest -q
