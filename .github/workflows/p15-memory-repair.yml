name: P15 memory QA repair

on:
  push:
    branches:
      - agent/p15-memory-ssot-life-world-closure-v0.1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout P15 head
        uses: actions/checkout@v4
        with:
          ref: agent/p15-memory-ssot-life-world-closure-v0.1
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply targeted repair
        run: python scripts/p15-memory-qa-repair.py

      - name: Sync generated mirrors
        run: python scripts/sync-generated-sources.py --write

      - name: Install source-runtime dependencies
        run: python -m pip install -r requirements-source.lock

      - name: Compile repaired production surface
        run: >-
          python -m compileall -q
          src/life_service/memory_coordinator.py
          src/life_service/memory_invalidation.py
          src/total_gateway/runtime.py
          tests/test_memory_qa_repair_p15.py

      - name: Run P15 repair regression
        run: >-
          python -m pytest -q
          tests/test_memory_qa_repair_p15.py
          tests/test_memory_correction_invalidation_p15.py
          tests/test_memory_crash_atomicity_p15.py
          tests/test_memory_explicit_l4_p15.py
          tests/test_memory_legacy_endpoint_adapter_p15.py
          tests/test_p15_chat_memory_wiring.py
          tests/test_p15_acceptance_gate.py

      - name: Verify generated mirrors
        run: python scripts/sync-generated-sources.py --check-committed

      - name: Commit repaired sources and mirrors
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source repair diff to commit."
            exit 0
          fi
          git config user.name "tiangong-p15-repair"
          git config user.email "tiangong-p15-repair@users.noreply.github.com"
          git add -A
          git commit -m "fix P15 memory QA blockers"
          git push origin HEAD:agent/p15-memory-ssot-life-world-closure-v0.1
