name: P16 final clean regression fix

on:
  push:
    branches:
      - agent/p16-native-proactive-v0.1

permissions:
  contents: write

jobs:
  fix-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p16-native-proactive-v0.1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install source dependencies
        run: python -m pip install -r requirements-source.lock

      - name: Fix frontend proactive status contract and reply clock
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, got {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          api = Path("app/frontend-v2/renderer/runtime/life-api.mjs")
          replace_once(
              api,
              '  proactiveChatPending: route("GET", "/api/v1/v3/life/proactive-chat/pending", "life.proactive_chat"),\n'
              '  proactiveChatAck: route("POST", "/api/v1/v3/life/proactive-chat/ack", "life.proactive_chat"),\n',
              '  proactiveChatPending: route("GET", "/api/v1/v3/life/proactive-chat/pending", "life.proactive_chat"),\n'
              '  proactiveChatAck: route("POST", "/api/v1/v3/life/proactive-chat/ack", "life.proactive_chat"),\n'
              '  proactiveStatus: route("GET", "/api/v1/v3/life/proactive/status", "life.proactive_chat.status"),\n',
              "frontend proactive status route",
          )
          replace_once(
              api,
              '    getPendingProactiveChats: (options = {}) => call("proactiveChatPending", options),\n'
              '    ackProactiveChat(messageId, extra = {}) {\n',
              '    getPendingProactiveChats: (options = {}) => call("proactiveChatPending", options),\n'
              '    getProactiveStatus: (options = {}) => call("proactiveStatus", options),\n'
              '    ackProactiveChat(messageId, extra = {}) {\n',
              "frontend proactive status method",
          )

          test = Path("tests/test_p16_native_proactive_runtime.py")
          replace_once(
              test,
              '                user_activity_at_ms=NOW + 30_000,\n'
              '                run_id="run-user-after-proactive",\n',
              '                user_activity_at_ms=int(row["created_at_ms"]) + 30_000,\n'
              '                run_id="run-user-after-proactive",\n',
              "reply lineage runtime clock",
          )
          print("P16 final three-regression patch applied")
          PY

      - name: Compile and run affected regression tests
        shell: bash
        run: |
          python -m compileall -q src/life_service src/total_gateway app/backend/tiangong-backend/v3
          python -m pytest -q \
            tests/test_frontend_gateway_routing.py \
            tests/test_p16_native_proactive_runtime.py \
            tests/test_p16_proactive_initiative.py \
            tests/test_memory_qa_repair_p15.py \
            tests/test_legacy_proactive_freeze.py

      - name: Verify generated source mirrors
        run: python scripts/sync-generated-sources.py --check-committed

      - name: Remove temporary P16 QA tooling and commit clean result
        shell: bash
        run: |
          git rm -f .github/workflows/p16-final-clean-fix.yml scripts/p16_merge_gate_patch.py
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/frontend-v2/renderer/runtime/life-api.mjs tests/test_p16_native_proactive_runtime.py
          git commit -m "P16: close frontend route and reply-lineage regressions"
          git push origin HEAD:agent/p16-native-proactive-v0.1
