name: P16 final merge-gate hardening

on:
  push:
    branches:
      - agent/p16-native-proactive-v0.1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout P16 branch
        uses: actions/checkout@v4
        with:
          ref: agent/p16-native-proactive-v0.1
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install source-runtime dependencies
        run: python -m pip install -r requirements-source.lock

      - name: Apply final P16 merge-gate patch
        run: python scripts/p16_merge_gate_patch.py

      - name: Sync generated source mirrors
        run: python scripts/sync-generated-sources.py --write

      - name: Compile P16 authoritative production surface
        run: >-
          python -m compileall -q
          src/life_service/proactive_initiative.py
          src/life_service/embedded_runtime.py
          src/life_service/memory_context.py
          src/total_gateway/runtime.py
          src/total_gateway/embedded_backend.py
          src/total_gateway/desktop_api.py
          app/backend/tiangong-backend/v3/zongdiaodu.py

      - name: Run P16/P15/freeze focused regression
        shell: bash
        run: |
          python -m pytest -q \
            tests/test_p16_proactive_initiative.py \
            tests/test_p16_native_proactive_runtime.py \
            tests/test_memory_qa_repair_p15.py \
            tests/test_legacy_proactive_freeze.py \
            tests/test_life_greeting_schedule.py \
            tests/test_life_proactive_learning_share.py

      - name: Verify generated source mirrors
        run: python scripts/sync-generated-sources.py --check-committed

      - name: Guard P15 memory authority and P16 uniqueness
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          life = Path('src/life_service/embedded_runtime.py').read_text(encoding='utf-8')
          block = life.split('def _build_proactive_context', 1)[1].split('\n    def ', 1)[0]
          assert 'select_layered_memories(' in block
          assert 'scope.get("memories")' not in block
          assert 'memory_context_layered' in block
          assert life.count('proactive_chats"].append') == 1
          assert 'proactive_llm_daily_attempt_budget' in life
          assert 'proactive_reply_link_window_seconds' in life
          schedule = life.split('def _schedule_native_proactive', 1)[1].split('\n    def ', 1)[0]
          assert schedule.index('_build_proactive_context') < schedule.index('_reserve_proactive_model_call_locked')
          greeting = life.split('def _schedule_greeting', 1)[1].split('\n    def ', 1)[0]
          learning = life.split('def _learning_report', 1)[1].split('\n    def ', 1)[0]
          assert 'proactive_chats' not in greeting
          assert 'proactive_chats"].append' not in learning
          print('P16 merge-gate structural guards passed')
          PY

      - name: Commit hardened P16 implementation
        shell: bash
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src app tests
          if git diff --cached --quiet; then
            echo "No production/test changes produced"
            exit 1
          fi
          git commit -m "P16: close memory authority and proactive budget gates"
          git push origin HEAD:agent/p16-native-proactive-v0.1
