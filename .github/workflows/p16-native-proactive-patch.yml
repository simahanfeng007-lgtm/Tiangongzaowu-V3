name: P16 native proactive patch

on:
  push:
    branches:
      - agent/p16-native-proactive-v0.1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout P16 branch
        uses: actions/checkout@v4
        with:
          ref: agent/p16-native-proactive-v0.1
          fetch-depth: 0

      - name: Locate authoritative World Understanding wiring
        shell: bash
        run: |
          grep -R -n -E "ProductionWorldUnderstandingRuntime|install_native_post_commit_observer|repository_evidence_snapshot" src app tests > p16-wu-wiring.txt || true
          cat p16-wu-wiring.txt

      - name: Upload WU wiring diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: p16-wu-wiring-diagnostics
          path: p16-wu-wiring.txt
          if-no-files-found: error
          retention-days: 2

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install source-runtime dependencies
        run: python -m pip install -r requirements-source.lock

      - name: Apply P16 source patch
        run: python scripts/p16_native_proactive_patch.py

      - name: Repair P16 patch output
        run: python scripts/p16_native_proactive_repair.py

      - name: Apply P16 merge hardening
        if: ${{ hashFiles('scripts/p16_native_proactive_hardening.py') != '' }}
        run: python scripts/p16_native_proactive_hardening.py

      - name: Sync generated source mirrors
        run: python scripts/sync-generated-sources.py --write

      - name: Compile P16 production surface
        run: >-
          python -m compileall -q
          src/life_service/proactive_initiative.py
          src/life_service/embedded_runtime.py
          src/total_gateway/runtime.py
          src/total_gateway/embedded_backend.py
          src/total_gateway/desktop_api.py
          app/backend/tiangong-backend/v3/zongdiaodu.py

      - name: Run P16 focused tests
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_p16_proactive_initiative.py \
            tests/test_p16_native_proactive_runtime.py \
            tests/test_legacy_proactive_freeze.py \
            tests/test_life_greeting_schedule.py \
            tests/test_life_proactive_learning_share.py \
            tests/test_memory_qa_repair_p15.py \
            2>&1 | tee p16-focused.txt

      - name: Upload focused-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p16-focused-diagnostics
          path: p16-focused.txt
          if-no-files-found: error
          retention-days: 2

      - name: Stop on focused-test failure
        if: steps.focused.outcome != 'success'
        shell: bash
        run: |
          cat p16-focused.txt
          exit 1

      - name: Verify generated source mirrors
        run: python scripts/sync-generated-sources.py --check-committed

      - name: Guard normal-dialogue reuse and producer uniqueness
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          life = Path('src/life_service/embedded_runtime.py').read_text(encoding='utf-8')
          backend = Path('src/total_gateway/embedded_backend.py').read_text(encoding='utf-8')
          dialogue = Path('app/backend/tiangong-backend/v3/zongdiaodu.py').read_text(encoding='utf-8')
          assert life.count('proactive_chats"].append') == 1
          assert 'def _schedule_native_proactive' in life
          assert 'def _proactive_compose' in backend
          assert 'self.qiaojie.chuli_duihua(text, user, context)' in backend
          compose = backend.split('def _proactive_compose', 1)[1].split('\n    def ', 1)[0]
          assert 'chuli_duihua(' not in compose
          assert '_duihua_shangxiawen(' in compose
          assert 'def shengcheng_zhudong_biaoda' in dialogue
          proactive = dialogue.split('def shengcheng_zhudong_biaoda', 1)[1].split('\n    def ', 1)[0]
          assert '_authoritative_life_soul_prompt' in proactive
          assert 'goujian_system_tishi' in proactive
          assert 'goujian_shenti_tishi' in proactive
          assert '_zhiming_llm' in proactive
          assert 'JIROU.' not in proactive and 'GUGE.' not in proactive
          print('P16 structural guards passed')
          PY

      - name: Commit P16 implementation
        shell: bash
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src app tests
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 1
          fi
          git commit -m "P16: wire native proactive cognition and dialogue"
          git push origin HEAD:agent/p16-native-proactive-v0.1
