name: P17 M2-04 candidate readonly

on:
  push:
    branches:
      - agent/p17-m2-04-construction
    paths:
      - .github/workflows/p17-m2-04-candidate-readonly.yml
      - scripts/p17-m2-04-candidate.py

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout construction branch
        uses: actions/checkout@v4
        with:
          ref: agent/p17-m2-04-construction
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build exact M2-04 candidate
        run: python scripts/p17-m2-04-candidate.py

      - name: Synchronize generated life-service mirrors
        run: python scripts/sync-generated-sources.py --write

      - name: Validate candidate
        run: |
          python scripts/check-source-authority.py
          python scripts/sync-generated-sources.py --check-committed
          python tests/test_source_authority_p17_m1.py -v
          python tests/test_source_authority_p17_m1_03.py -v
          python tests/test_zongdiaodu_p17_m2_01.py -v
          python tests/test_zongdiaodu_p17_m2_02.py -v
          python tests/test_zongdiaodu_p17_m2_03.py -v
          python tests/test_embedded_life_p17_m2_04.py -v
          python -m py_compile src/life_service/embedded_runtime.py src/life_service/embedded_runtime_lifecycle.py app/life-service/runtime314/life_service/embedded_runtime.py app/life-service/runtime314/life_service/embedded_runtime_lifecycle.py

      - name: Collect candidate
        run: |
          mkdir -p candidate/src/life_service candidate/app/life-service/runtime314/life_service candidate/.github/workflows candidate/tests
          cp src/life_service/embedded_runtime.py candidate/src/life_service/
          cp src/life_service/embedded_runtime_lifecycle.py candidate/src/life_service/
          cp app/life-service/runtime314/life_service/embedded_runtime.py candidate/app/life-service/runtime314/life_service/
          cp app/life-service/runtime314/life_service/embedded_runtime_lifecycle.py candidate/app/life-service/runtime314/life_service/
          cp app/life-service/runtime314/life_service/.tiangong-generated-source.json candidate/app/life-service/runtime314/life_service/
          cp .github/workflows/architecture-gate.yml candidate/.github/workflows/
          cp tests/test_embedded_life_p17_m2_04.py candidate/tests/

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: p17-m2-04-candidate-readonly
          path: candidate
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
