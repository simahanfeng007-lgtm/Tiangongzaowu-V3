name: P17 M3-03 candidate readonly

on:
  push:
    branches:
      - agent/p17-m3-03-construction
    paths:
      - .github/workflows/p17-m3-03-candidate-readonly.yml

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout construction branch
        uses: actions/checkout@v4
        with:
          ref: agent/p17-m3-03-construction
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Life runtime test dependencies
        run: python -m pip install cryptography pydantic
      - name: Align builder with current Architecture Gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/p17-m3-03-candidate.py")
          source = path.read_text(encoding="utf-8")
          start = source.index("    test_anchor = ")
          end = source.index('    print("P17-M3-03 candidate patched"', start)
          replacement = (
              '    test_anchor = "      - name: Run P17 M3-02 life store schema regression\\n        run: python tests/test_life_store_p17_m3_02.py -v\\n"\n'
              '    if gate.count(test_anchor) != 1:\n'
              '        raise RuntimeError("M3-02 gate anchor changed")\n'
              '    test_replacement = test_anchor + "\\n      - name: Run P17 M3-03 life memory repository regression\\n        run: python tests/test_life_store_p17_m3_03.py -v\\n"\n'
              '    gate = gate.replace(test_anchor, test_replacement)\n'
              '    compile_anchor = "src/life_service/store_schema.py src/total_gateway/runtime.py"\n'
              '    compile_replacement = "src/life_service/store_schema.py src/life_service/store_contract_support.py src/life_service/store_memory_repository.py src/total_gateway/runtime.py"\n'
              '    if gate.count(compile_anchor) != 1:\n'
              '        raise RuntimeError("compile gate anchor changed")\n'
              '    GATE.write_text(gate.replace(compile_anchor, compile_replacement), encoding="utf-8")\n'
          )
          source = source[:start] + replacement + source[end:]
          path.write_text(source, encoding="utf-8")
          PY
      - name: Build exact M3-03 candidate
        run: python scripts/p17-m3-03-candidate.py
      - name: Synchronize generated life-service mirrors
        run: python scripts/sync-generated-sources.py --write
      - name: Validate candidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check-source-authority.py
          python scripts/sync-generated-sources.py --check-committed
          python tests/test_source_authority_p17_m1.py -v
          python tests/test_source_authority_p17_m1_03.py -v
          python tests/test_zongdiaodu_p17_m2_01.py -v
          python tests/test_zongdiaodu_p17_m2_02.py -v
          python tests/test_zongdiaodu_p17_m2_03.py -v
          python tests/test_embedded_life_p17_m2_04.py -v
          python tests/test_embedded_life_p17_m2_05.py -v
          python tests/test_life_store_p17_m3_01.py -v
          python tests/test_life_store_p17_m3_02.py -v
          python tests/test_life_store_p17_m3_03.py -v
          python tests/test_life_shadow_store.py -v
          python tests/test_causal_memory_store.py -v
          python tests/test_memory_derivation_store_p15.py -v
          python -m py_compile src/life_service/store.py src/life_service/store_connection.py src/life_service/store_schema.py src/life_service/store_contract_support.py src/life_service/store_memory_repository.py app/life-service/runtime314/life_service/store.py app/life-service/runtime314/life_service/store_connection.py app/life-service/runtime314/life_service/store_schema.py app/life-service/runtime314/life_service/store_contract_support.py app/life-service/runtime314/life_service/store_memory_repository.py
          git diff --check
      - name: Show formal diff
        run: git diff --stat
      - name: Collect formal candidate files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate/.github/workflows candidate/src/life_service candidate/app/life-service/runtime314/life_service candidate/tests
          cp .github/workflows/architecture-gate.yml candidate/.github/workflows/
          cp src/life_service/store.py candidate/src/life_service/
          cp src/life_service/store_contract_support.py candidate/src/life_service/
          cp src/life_service/store_memory_repository.py candidate/src/life_service/
          cp app/life-service/runtime314/life_service/store.py candidate/app/life-service/runtime314/life_service/
          cp app/life-service/runtime314/life_service/store_contract_support.py candidate/app/life-service/runtime314/life_service/
          cp app/life-service/runtime314/life_service/store_memory_repository.py candidate/app/life-service/runtime314/life_service/
          cp app/life-service/runtime314/life_service/.tiangong-generated-source.json candidate/app/life-service/runtime314/life_service/
          cp tests/test_life_store_p17_m3_03.py candidate/tests/
      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: p17-m3-03-candidate-readonly
          path: candidate
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3
