name: P17 M3-04 gateway store audit

on:
  push:
    branches:
      - agent/p17-m3-04-construction
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout construction branch
        uses: actions/checkout@v4
        with:
          ref: agent/p17-m3-04-construction
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit Gateway Store
        run: python scripts/p17-m3-04-audit.py
      - name: Audit Gateway Store regression coverage
        run: python scripts/p17-m3-04-test-audit.py
