name: P17 M3-04 materialize verified blobs

on:
  push:
    branches:
      - agent/p17-m3-04-construction
    paths:
      - .github/workflows/p17-m3-04-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONHASHSEED: "0"
      PYTHONPATH: ".:src"
    steps:
      - name: Checkout construction branch
        uses: actions/checkout@v4
        with:
          ref: agent/p17-m3-04-construction
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install P17 M3-03 and Gateway Store test dependencies
        run: python -m pip install cryptography==48.0.1 pydantic==2.13.4
      - name: Build exact M3-04 candidate
        run: python scripts/p17-m3-04-apply-v2.py
      - name: Validate candidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check-source-authority.py
          python scripts/sync-generated-sources.py --check-committed
          python scripts/p17-m3-04-audit.py
          python scripts/p17-m3-04-test-audit.py
          python tests/test_source_authority_p17_m1.py -v
          python tests/test_source_authority_p17_m1_03.py -v
          python tests/test_zongdiaodu_p17_m2_01.py -v
          python tests/test_zongdiaodu_p17_m2_02.py -v
          python tests/test_zongdiaodu_p17_m2_03.py -v
          python tests/test_embedded_life_p17_m2_04.py -v
          python tests/test_embedded_life_p17_m2_05.py -v
          python tests/test_life_store_p17_m3_01.py -v
          python tests/test_life_store_p17_m3_02.py -v
          python tests/test_life_store_p17_m3_03.py -v
          python -m unittest discover -s tests -p "test_total_gateway_store_p17*.py" -v
          python tests/test_gateway_store.py -v
          python -m py_compile app/backend/tiangong-backend/v3/zongdiaodu.py app/backend/tiangong-backend/v3/runtime_bootstrap.py app/backend/tiangong-backend/v3/runtime_composition.py app/backend/tiangong-backend/v3/runtime_lifecycle.py app/backend/tiangong-backend/v3/runtime_turn_orchestration.py app/backend/tiangong-backend/v3/runtime_tool_result_boundary.py src/life_service/embedded_runtime.py src/life_service/embedded_runtime_lifecycle.py src/life_service/embedded_runtime_wiring.py src/life_service/store.py src/life_service/store_connection.py src/life_service/store_schema.py src/life_service/store_contract_support.py src/life_service/store_memory_repository.py src/total_gateway/runtime.py src/total_gateway/store.py src/total_gateway/store_unit_of_work.py
          git diff --check
      - name: Create unreferenced verified blobs
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          from pathlib import Path
          import base64
          import json
          import os
          import urllib.request

          paths = [
              ".github/workflows/architecture-gate.yml",
              "src/total_gateway/store.py",
              "src/total_gateway/store_unit_of_work.py",
              "tests/test_total_gateway_store_p17_m3_04.py",
          ]
          result = {}
          for relative in paths:
              raw = Path(relative).read_bytes()
              body = json.dumps({
                  "content": base64.b64encode(raw).decode("ascii"),
                  "encoding": "base64",
              }).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['REPOSITORY']}/git/blobs",
                  data=body,
                  method="POST",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  result[relative] = json.load(response)["sha"]
          print(json.dumps(result, sort_keys=True))