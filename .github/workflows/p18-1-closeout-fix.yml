name: P18.1 closeout compatibility migration

on:
  push:
    branches: [agent/p18-1-universal-endpoint-protocol-harness]
    paths:
      - scripts/p18_1_closeout_fix.py
      - .github/workflows/p18-1-closeout-fix.yml

permissions:
  contents: write

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  migrate:
    if: "${{ !startsWith(github.event.head_commit.message, 'E2 P18.1: closeout migration bot') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p18-1-universal-endpoint-protocol-harness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Apply compatibility migration
        run: python scripts/p18_1_closeout_fix.py
      - name: Compile bridge
        run: python -m py_compile app/backend/tiangong-backend/v3/duihua_qiaojie.py
      - name: Run reasoning compatibility regression
        run: python -m pytest -q tests/test_model_reasoning_contract.py::ReasoningCapabilityTests::test_settings_persist_per_provider_endpoint_and_model
      - name: Commit authoritative source
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "tiangong-p18-1-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/backend/tiangong-backend/v3/duihua_qiaojie.py
          git commit -m "E2 P18.1: closeout migration bot"
          git push origin HEAD:agent/p18-1-universal-endpoint-protocol-harness
