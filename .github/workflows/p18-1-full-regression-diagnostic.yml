name: P18.1 full regression diagnostic

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-full-regression:
    name: diagnose-full-regression-ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONHASHSEED: "0"
      TIANGONG_CI_ENV: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install full source-runtime dependencies
        run: python -m pip install -r requirements-source.lock

      - name: Run diagnostic full pytest
        id: pytest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -x -vv --tb=long --junitxml=pytest-p18-1-diagnostic.xml 2>&1 | tee pytest-p18-1-diagnostic.log

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p18-1-full-regression-diagnostic
          path: |
            pytest-p18-1-diagnostic.xml
            pytest-p18-1-diagnostic.log
          if-no-files-found: error
          retention-days: 3
