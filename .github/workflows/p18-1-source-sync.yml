name: P18.1 one-shot tooling cleanup

on:
  push:
    branches: [agent/p18-1-universal-endpoint-protocol-harness]
    paths:
      - .github/workflows/p18-1-source-sync.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p18-1-universal-endpoint-protocol-harness
          fetch-depth: 0
      - name: Remove branch-only migration and certification tooling
        shell: bash
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/p18-1-closeout-fix.yml \
            .github/workflows/p18-1-native-roundtrip-patch.yml \
            .github/workflows/p18-1-protocol-harness-validation.yml \
            .github/workflows/p18-1-source-sync.yml \
            .github/workflows/p18-1-stage-d-inspect.yml \
            .github/workflows/p18-1-stage-d-migrate.yml \
            scripts/p18_1_apply_native_roundtrip.py \
            scripts/p18_1_closeout_fix.py \
            scripts/p18_1_stage_d_fixups.py \
            scripts/p18_1_stage_d_frontend.py \
            scripts/p18_1_stage_d_frontend_v2.py \
            scripts/p18_1_stage_d_migrate.py \
            scripts/p18_1_stage_d_migrate_v2.py
      - name: Commit clean closeout branch
        shell: bash
        run: |
          git config user.name "tiangong-p18-1-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "E4 P18.1: remove one-shot migration tooling"
          git push origin HEAD:agent/p18-1-universal-endpoint-protocol-harness
