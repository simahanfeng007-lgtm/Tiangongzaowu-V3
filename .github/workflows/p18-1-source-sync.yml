name: P18.1 source authority and generated sync

on:
  push:
    branches: [agent/p18-1-universal-endpoint-protocol-harness]
    paths: [.github/workflows/p18-1-source-sync.yml]

permissions:
  contents: write

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  sync-and-gate:
    if: "${{ !startsWith(github.event.head_commit.message, 'E1 P18.1: generated-source sync bot') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p18-1-universal-endpoint-protocol-harness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Register new authoritative v3 implementation roots
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('source-ownership.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          roots = data['v3_backend']['implementation_roots']
          for item in [
              'app/backend/tiangong-backend/v3/model_endpoint.py',
              'app/backend/tiangong-backend/v3/model_protocol_contract.py',
          ]:
              if item not in roots:
                  roots.append(item)
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Sync generated source mirrors from authoritative roots
        run: python scripts/sync-generated-sources.py --write
      - name: Source authority gate
        run: python scripts/check-source-authority.py
      - name: Generated source tests
        run: >-
          python -m pytest -q
          tests/test_sync_generated_sources.py
          tests/test_source_authority_p17_m1.py
      - name: Commit generated outputs
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "tiangong-p18-1-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "E1 P18.1: generated-source sync bot"
          git push origin HEAD:agent/p18-1-universal-endpoint-protocol-harness
