name: P18 M1 canonical continuity

on:
  push:
    branches:
      - agent/p18-m1-long-execution-chain-governance

permissions:
  contents: write

jobs:
  canonical-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install source runtime dependencies
        run: python -m pip install -r requirements-source.lock

      - name: Apply canonical continuity patch
        run: |
          python .github/p18_m1_continuity_apply.py
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_p18_m1_canonical_continuity.py")
          text = path.read_text(encoding="utf-8")
          old = '            created_at_ms=2_000,\n            pending_effect_ids=(self.pending_effect,),'
          new = '            created_at_ms=__import__("time").time_ns() // 1_000_000,\n            pending_effect_ids=(self.pending_effect,),'
          if text.count(old) != 1:
              raise SystemExit("interruption timestamp test anchor mismatch")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Synchronize generated source mirrors
        run: python scripts/sync-generated-sources.py --write

      - name: Remove temporary engineering carriers
        run: git rm -f .github/p18_m1_continuity_apply.py .github/workflows/p18-m1-canonical-continuity.yml

      - name: Compile changed authority seams
        run: |
          python -m py_compile \
            app/backend/tiangong-backend/v3/zongdiaodu.py \
            src/total_gateway/embedded_backend.py \
            src/total_gateway/runtime.py \
            src/total_gateway/continuity.py \
            tests/test_p18_m1_canonical_continuity.py \
            tests/test_p18_m1_execution_epoch.py

      - name: Verify source authority mirrors
        run: |
          python scripts/sync-generated-sources.py --check-committed
          python scripts/check-source-authority.py

      - name: Run P18 M1 focused continuity and budget regressions
        env:
          PYTHONPATH: app/backend/tiangong-backend:src
        run: |
          python -m pytest -q \
            tests/test_p18_m1_canonical_continuity.py \
            tests/test_p18_m1_execution_epoch.py \
            tests/test_simple_chain_loop_budget.py \
            tests/test_gateway_life_continuity.py \
            tests/test_backend_run_identity.py

      - name: Verify no second continuity store or runtime was introduced
        run: |
          grep -n 'persist_working_checkpoint' src/total_gateway/runtime.py
          grep -n 'set_continuity_checkpoint_provider' src/total_gateway/embedded_backend.py
          grep -n 'canonical_checkpoint_unavailable' app/backend/tiangong-backend/v3/zongdiaodu.py
          if grep -R -n 'GatewayStateStore.open' app/backend/tiangong-backend/v3 | grep -E 'continuity|epoch' ; then
            echo 'backend introduced a second GatewayStateStore for continuity' >&2
            exit 1
          fi

      - name: Commit only after all M1 continuity gates pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "P18-M1: bind execution epochs to canonical continuity"
          git push origin HEAD:agent/p18-m1-long-execution-chain-governance
