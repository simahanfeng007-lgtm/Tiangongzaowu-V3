name: P18 M1 epoch turn budget

on:
  push:
    branches:
      - agent/p18-m1-long-execution-chain-governance

permissions:
  contents: write

jobs:
  validate-epoch-turn-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install source runtime dependencies
        run: python -m pip install -r requirements-source.lock

      - name: Apply M1 turn-budget patch
        run: |
          sed -i 's/expect(text, import_anchor)$/expect(text, import_anchor, 2)/' .github/p18_m1_turn_budget_apply.py
          python .github/p18_m1_turn_budget_apply.py

      - name: Remove temporary engineering carriers
        run: git rm -f .github/p18_m1_turn_budget_apply.py .github/workflows/p18-m1-turn-budget.yml

      - name: Compile changed seams
        run: |
          python -m py_compile \
            app/backend/tiangong-backend/v3/zongdiaodu.py \
            app/backend/tiangong-backend/v3/runtime_turn_orchestration.py \
            app/backend/tiangong-backend/v3/simple_chain_events.py \
            tests/test_p18_m1_execution_epoch.py \
            tests/test_simple_chain_loop_budget.py

      - name: Run M1 and legacy budget regression
        env:
          PYTHONPATH: app/backend/tiangong-backend:src
        run: |
          python -m unittest \
            tests.test_p18_m1_execution_epoch \
            tests.test_simple_chain_loop_budget

      - name: Verify no old global local-budget cutoffs remain
        run: |
          grep -n 'source="epoch_turn_budget"' app/backend/tiangong-backend/v3/zongdiaodu.py
          grep -n 'iteration_count=turn_loop.epoch_iteration_count' app/backend/tiangong-backend/v3/zongdiaodu.py
          grep -n 'wall_clock_decision = evaluate_turn_budget' app/backend/tiangong-backend/v3/zongdiaodu.py
          grep -n 'global_tool_rounds_max' app/backend/tiangong-backend/v3/zongdiaodu.py
          if grep -n 'iteration_count=iteration_count' app/backend/tiangong-backend/v3/zongdiaodu.py | grep -q 'iteration_count=iteration_count'; then
            echo 'legacy global iteration cutoff reference remains' >&2
            exit 1
          fi

      - name: Commit validated production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "P18-M1: make loop-turn budget epoch-local"
          git push origin HEAD:agent/p18-m1-long-execution-chain-governance
