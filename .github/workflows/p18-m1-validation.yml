name: P18 M1 validation

on:
  push:
    branches:
      - agent/p18-m1-long-execution-chain-governance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p18-m1-focused:
    name: p18-m1-focused-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONHASHSEED: "0"
      TIANGONG_CI_ENV: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install source runtime dependencies
        run: python -m pip install -r requirements-source.lock

      - name: Verify source ownership and mirrors
        run: |
          python scripts/check-source-authority.py
          python scripts/sync-generated-sources.py --check-committed

      - name: Compile M1 production seams
        run: >-
          python -m py_compile
          app/backend/tiangong-backend/v3/runtime_turn_orchestration.py
          app/backend/tiangong-backend/v3/simple_chain_events.py
          app/backend/tiangong-backend/v3/zongdiaodu.py
          src/total_gateway/continuity.py
          src/total_gateway/embedded_backend.py
          src/total_gateway/runtime.py
          tests/test_p18_m1_execution_epoch.py
          tests/test_p18_m1_canonical_continuity.py
          tests/test_p18_m1_delivery_boundaries.py

      - name: Run focused M1 and inherited orchestration regressions
        env:
          PYTHONPATH: app/backend/tiangong-backend:src
        run: >-
          python -m pytest -q
          tests/test_p18_m1_delivery_boundaries.py
          tests/test_p18_m1_canonical_continuity.py
          tests/test_p18_m1_execution_epoch.py
          tests/test_simple_chain_loop_budget.py
          tests/test_simple_chain_events.py
          tests/test_gateway_life_continuity.py
          tests/test_backend_run_identity.py
          tests/test_zongdiaodu_p17_m2_01.py
          tests/test_zongdiaodu_p17_m2_02.py
          tests/test_zongdiaodu_p17_m2_03.py

      - name: Verify M1 architecture invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          zong = Path('app/backend/tiangong-backend/v3/zongdiaodu.py').read_text(encoding='utf-8')
          embedded = Path('src/total_gateway/embedded_backend.py').read_text(encoding='utf-8')
          runtime = Path('src/total_gateway/runtime.py').read_text(encoding='utf-8')
          assert 'turn_loop.can_schedule(' not in zong
          assert 'source="parallel_tool_batch"' in zong
          assert 'source="single_tool"' in zong
          assert 'source="epoch_turn_budget"' in zong
          assert 'canonical_checkpoint_unavailable' in zong
          assert 'set_continuity_checkpoint_provider' in embedded
          assert 'persist_working_checkpoint' in runtime
          assert 'GatewayStateStore.open' not in zong
          assert 'GatewayStateStore.open' not in embedded
          print('[P18-M1] architecture invariants PASS')
          PY

  full-regression:
    name: full-regression-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONHASHSEED: "0"
      TIANGONG_CI_ENV: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install full source-runtime dependencies
        run: python -m pip install -r requirements-source.lock

      - name: Run complete repository pytest
        run: python -m pytest -q
