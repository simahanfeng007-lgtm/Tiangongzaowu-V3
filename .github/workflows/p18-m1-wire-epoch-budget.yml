name: P18 M1 wire epoch budget

on:
  push:
    branches:
      - agent/p18-m1-long-execution-chain-governance

permissions:
  contents: write

jobs:
  wire-production-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply production patch
        shell: bash
        run: python .github/p18_m1_apply.py

      - name: Remove temporary engineering carriers
        shell: bash
        run: git rm .github/p18_m1_apply.py .github/workflows/p18-m1-wire-epoch-budget.yml

      - name: Validate syntax
        shell: bash
        run: |
          python -m py_compile \
            app/backend/tiangong-backend/v3/zongdiaodu.py \
            app/backend/tiangong-backend/v3/runtime_turn_orchestration.py \
            app/backend/tiangong-backend/v3/simple_chain_events.py \
            tests/test_p18_m1_execution_epoch.py \
            tests/test_simple_chain_loop_budget.py

      - name: Run deterministic M1 and legacy budget tests
        shell: bash
        env:
          PYTHONPATH: app/backend/tiangong-backend:src
        run: |
          python -m unittest \
            tests.test_p18_m1_execution_epoch \
            tests.test_simple_chain_loop_budget

      - name: Verify production cutoff removal
        shell: bash
        run: |
          if grep -n 'turn_loop\.can_schedule(' app/backend/tiangong-backend/v3/zongdiaodu.py; then
            echo 'legacy production can_schedule cutoff remains' >&2
            exit 1
          fi
          grep -n '_SIMPLE_CHAIN_MAX_GLOBAL_TOOL_ROUNDS' app/backend/tiangong-backend/v3/zongdiaodu.py
          grep -n 'source="parallel_tool_batch"' app/backend/tiangong-backend/v3/zongdiaodu.py
          grep -n 'source="single_tool"' app/backend/tiangong-backend/v3/zongdiaodu.py

      - name: Commit only after validation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "P18-M1: wire epoch continuation into production simple chain"
          git push origin HEAD:agent/p18-m1-long-execution-chain-governance
