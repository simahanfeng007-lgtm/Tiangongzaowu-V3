name: P18 M1 wire epoch budget

on:
  push:
    branches:
      - agent/p18-m1-long-execution-chain-governance

permissions:
  contents: write

jobs:
  wire-production-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch production budget branches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/backend/tiangong-backend/v3/zongdiaodu.py')
          text = path.read_text(encoding='utf-8')

          constant = '_SIMPLE_CHAIN_MAX_TOOL_ROUNDS = int(os.environ.get("TIANGONG_SIMPLE_CHAIN_MAX_TOOL_ROUNDS", "75"))'
          if text.count(constant) != 1:
              raise SystemExit(f'constant anchor mismatch: {text.count(constant)}')

          helper_anchor = '\n\ndef _simple_chain_record_observation(run_state: dict[str, Any] | None, payload: dict[str, Any]) -> None:'
          if text.count(helper_anchor) != 1:
              raise SystemExit(f'helper anchor mismatch: {text.count(helper_anchor)}')

          old_parallel = '''                if not turn_loop.can_schedule(len(tools), _SIMPLE_CHAIN_MAX_TOOL_ROUNDS):
                    final_guard_exhausted = True
                    final_chain_status = "force_stopped"
                    shenti, huifu = _natural_closeout(
                        "force_stopped",
                        ["[tool_round_budget_exhausted] tool round budget exhausted"],
                    )
                    if run_control:
                        run_control.step(
                            "simple_chain_tool_round_budget",
                            "Tool round budget",
                            "failed",
                            f"Batch of {len(tools)} would exceed the tool round budget.",
                            meta={
                                "tool_rounds": gongju_cishu,
                                "requested": len(tools),
                                "max_tool_rounds": _SIMPLE_CHAIN_MAX_TOOL_ROUNDS,
                            },
                        )
                    break'''
          if text.count(old_parallel) != 1:
              raise SystemExit(f'parallel cutoff anchor mismatch: {text.count(old_parallel)}')

          old_single = '''            if not turn_loop.can_schedule(1, _SIMPLE_CHAIN_MAX_TOOL_ROUNDS):
                final_guard_exhausted = True
                final_chain_status = "force_stopped"
                shenti, huifu = _natural_closeout(
                    "force_stopped",
                    ["[tool_round_budget_exhausted] tool round budget exhausted"],
                )
                if run_control:
                    run_control.step(
                        "simple_chain_tool_round_budget",
                        "Tool round budget",
                        "failed",
                        "Tool round budget exhausted.",
                        meta={
                            "tool_rounds": gongju_cishu,
                            "max_tool_rounds": _SIMPLE_CHAIN_MAX_TOOL_ROUNDS,
                        },
                    )
                break'''
          if text.count(old_single) != 1:
              raise SystemExit(f'single cutoff anchor mismatch: {text.count(old_single)}')

          global_constant = '''_SIMPLE_CHAIN_MAX_TOOL_ROUNDS = int(os.environ.get("TIANGONG_SIMPLE_CHAIN_MAX_TOOL_ROUNDS", "75"))
          # P18-M1: 75 is an execution-epoch limit. Only the global budget is terminal.
          _SIMPLE_CHAIN_MAX_GLOBAL_TOOL_ROUNDS = int(
              os.environ.get("TIANGONG_SIMPLE_CHAIN_MAX_GLOBAL_TOOL_ROUNDS", "1000")
          )'''
          text = text.replace(constant, global_constant, 1)

          helper = r'''

          def _simple_chain_authority_identity(run_state: dict[str, Any] | None) -> dict[str, Any]:
              """Project the existing run authority into a checkpoint; never mint authority here."""
              context = current_run_context()
              state = run_state if isinstance(run_state, dict) else {}
              return {
                  "request_id": str(context.request_id or state.get("request_id") or ""),
                  "run_id": str(context.run_id or state.get("run_id") or ""),
                  "generation": int(context.generation or 0),
                  "life_id": str(context.life_id or ""),
                  "session_id": str(context.session_id or state.get("session_id") or ""),
              }


          def _simple_chain_checkpoint_continue(
              run_state: dict[str, Any] | None,
              turn_loop: TurnLoopState,
              *,
              requested: int,
              loop_started_at: float,
              source: str,
          ) -> bool:
              """Persist one non-terminal Epoch checkpoint, then roll the local window."""
              if not isinstance(run_state, dict):
                  return False
              identity = _simple_chain_authority_identity(run_state)
              epoch_index = int(turn_loop.epoch_index)
              turn_loop.project_live(run_state, loop_started_at)
              run_state["authority_identity"] = identity
              run_state["status"] = "checkpoint_continue"
              run_state["stage"] = "epoch_checkpoint"
              run_state["continuation"] = {
                  "schema": "tiangong.v3.simple_chain.epoch_continuation.v1",
                  "status": "checkpoint_requested",
                  "epoch_index": epoch_index,
                  "global_tool_rounds": int(turn_loop.action_rounds),
                  "epoch_tool_rounds": int(turn_loop.epoch_action_rounds),
                  "requested_tool_rounds": max(0, int(requested)),
                  "latest_safe_step": f"global_tool_round_{int(turn_loop.action_rounds)}",
                  "next_step": f"epoch_{epoch_index + 1}_tool_round_1",
              }
              event_meta = {
                  **identity,
                  "epoch_index": epoch_index,
                  "epoch_tool_rounds": int(turn_loop.epoch_action_rounds),
                  "global_tool_rounds": int(turn_loop.action_rounds),
                  "requested_tool_rounds": max(0, int(requested)),
                  "continuation_status": "checkpoint_continue",
              }
              _simple_chain_emit_event(
                  run_state,
                  "epoch.checkpoint_requested",
                  "local execution epoch budget reached",
                  source,
                  extra=event_meta,
              )
              _simple_chain_emit_event(
                  run_state,
                  "run.continuation_requested",
                  "same authoritative run requested local continuation",
                  source,
                  extra=event_meta,
              )
              _simple_chain_save_run_state(run_state)
              if run_state.get("persistence_degraded"):
                  return False

              run_state["continuation"]["status"] = "checkpoint_committed"
              _simple_chain_save_run_state(run_state)
              if run_state.get("persistence_degraded"):
                  return False
              _simple_chain_emit_event(
                  run_state,
                  "epoch.checkpoint_committed",
                  "local execution epoch checkpoint persisted",
                  source,
                  extra=event_meta,
              )
              _simple_chain_emit_event(
                  run_state,
                  "epoch.completed",
                  "local execution epoch completed without terminating the run",
                  source,
                  extra=event_meta,
              )

              next_epoch = turn_loop.begin_next_epoch()
              turn_loop.project_live(run_state, loop_started_at)
              run_state["status"] = "running"
              run_state["stage"] = "execution_epoch"
              run_state["continuation"].update({
                  "status": "continued",
                  "next_epoch_index": int(next_epoch),
              })
              _simple_chain_save_run_state(run_state)
              if run_state.get("persistence_degraded"):
                  return False
              next_meta = {
                  **identity,
                  "epoch_index": int(next_epoch),
                  "next_epoch_index": int(next_epoch),
                  "epoch_tool_rounds": int(turn_loop.epoch_action_rounds),
                  "global_tool_rounds": int(turn_loop.action_rounds),
                  "requested_tool_rounds": max(0, int(requested)),
                  "continuation_status": "continued",
              }
              _simple_chain_emit_event(
                  run_state,
                  "epoch.started",
                  "next local execution epoch started",
                  source,
                  extra=next_meta,
              )
              _simple_chain_emit_event(
                  run_state,
                  "run.continued",
                  "same authoritative run continued after checkpoint",
                  source,
                  extra=next_meta,
              )
              return True


          def _simple_chain_prepare_tool_budget(
              turn_loop: TurnLoopState,
              requested: int,
              *,
              run_state: dict[str, Any] | None,
              loop_started_at: float,
              source: str,
          ) -> tuple[bool, tuple[str, ...]]:
              """Apply P18-M1 dual-budget semantics to a real production tool dispatch."""
              requested_count = max(0, int(requested))
              decision = turn_loop.decide_schedule(
                  requested_count,
                  max_epoch_rounds=_SIMPLE_CHAIN_MAX_TOOL_ROUNDS,
                  max_global_rounds=_SIMPLE_CHAIN_MAX_GLOBAL_TOOL_ROUNDS,
              )
              if decision.can_schedule:
                  return True, ()
              if decision.terminal:
                  return False, tuple(decision.reasons)
              if requested_count > _SIMPLE_CHAIN_MAX_TOOL_ROUNDS:
                  return False, (
                      "[epoch_tool_batch_too_large] requested tool batch exceeds one execution epoch",
                  )
              if not decision.should_checkpoint_continue:
                  return False, tuple(decision.reasons)
              if not _simple_chain_checkpoint_continue(
                  run_state,
                  turn_loop,
                  requested=requested_count,
                  loop_started_at=loop_started_at,
                  source=source,
              ):
                  return False, (
                      "[epoch_checkpoint_failed] execution epoch checkpoint could not be persisted",
                  )
              resumed = turn_loop.decide_schedule(
                  requested_count,
                  max_epoch_rounds=_SIMPLE_CHAIN_MAX_TOOL_ROUNDS,
                  max_global_rounds=_SIMPLE_CHAIN_MAX_GLOBAL_TOOL_ROUNDS,
              )
              return resumed.can_schedule, (() if resumed.can_schedule else tuple(resumed.reasons))
          '''
          text = text.replace(helper_anchor, helper + helper_anchor, 1)

          new_parallel = '''                budget_ready, budget_reasons = _simple_chain_prepare_tool_budget(
                    turn_loop,
                    len(tools),
                    run_state=run_state,
                    loop_started_at=loop_started_at,
                    source="parallel_tool_batch",
                )
                if not budget_ready:
                    final_guard_exhausted = True
                    final_chain_status = "force_stopped"
                    shenti, huifu = _natural_closeout("force_stopped", list(budget_reasons))
                    if run_control:
                        run_control.step(
                            "simple_chain_tool_round_budget",
                            "Tool round budget",
                            "failed",
                            "Global tool budget exhausted or Epoch checkpoint persistence failed.",
                            meta={
                                "global_tool_rounds": turn_loop.action_rounds,
                                "epoch_tool_rounds": turn_loop.epoch_action_rounds,
                                "epoch_index": turn_loop.epoch_index,
                                "requested": len(tools),
                                "max_epoch_tool_rounds": _SIMPLE_CHAIN_MAX_TOOL_ROUNDS,
                                "max_global_tool_rounds": _SIMPLE_CHAIN_MAX_GLOBAL_TOOL_ROUNDS,
                                "reasons": list(budget_reasons),
                            },
                        )
                    break'''
          text = text.replace(old_parallel, new_parallel, 1)

          new_single = '''            budget_ready, budget_reasons = _simple_chain_prepare_tool_budget(
                turn_loop,
                1,
                run_state=run_state,
                loop_started_at=loop_started_at,
                source="single_tool",
            )
            if not budget_ready:
                final_guard_exhausted = True
                final_chain_status = "force_stopped"
                shenti, huifu = _natural_closeout("force_stopped", list(budget_reasons))
                if run_control:
                    run_control.step(
                        "simple_chain_tool_round_budget",
                        "Tool round budget",
                        "failed",
                        "Global tool budget exhausted or Epoch checkpoint persistence failed.",
                        meta={
                            "global_tool_rounds": turn_loop.action_rounds,
                            "epoch_tool_rounds": turn_loop.epoch_action_rounds,
                            "epoch_index": turn_loop.epoch_index,
                            "max_epoch_tool_rounds": _SIMPLE_CHAIN_MAX_TOOL_ROUNDS,
                            "max_global_tool_rounds": _SIMPLE_CHAIN_MAX_GLOBAL_TOOL_ROUNDS,
                            "reasons": list(budget_reasons),
                        },
                    )
                break'''
          text = text.replace(old_single, new_single, 1)

          if 'turn_loop.can_schedule(' in text:
              raise SystemExit('legacy production can_schedule cutoff still present')
          if text.count('_simple_chain_prepare_tool_budget(') != 3:
              raise SystemExit('expected helper definition + two production uses')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Add focused production wiring tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_p18_m1_execution_epoch.py')
          text = path.read_text(encoding='utf-8')
          marker = '\n\nif __name__ == "__main__":\n    unittest.main()\n'
          if text.count(marker) != 1:
              raise SystemExit('test marker mismatch')
          if 'test_production_simple_chain_uses_dual_budget_bridge' in text:
              raise SystemExit('focused tests already present unexpectedly')
          addition = r'''

              def test_production_simple_chain_uses_dual_budget_bridge(self) -> None:
                  from pathlib import Path

                  source = (
                      Path(__file__).resolve().parents[1]
                      / "app" / "backend" / "tiangong-backend" / "v3" / "zongdiaodu.py"
                  ).read_text(encoding="utf-8")
                  self.assertNotIn("turn_loop.can_schedule(", source)
                  self.assertIn("_SIMPLE_CHAIN_MAX_GLOBAL_TOOL_ROUNDS", source)
                  self.assertIn("source=\"parallel_tool_batch\"", source)
                  self.assertIn("source=\"single_tool\"", source)
                  self.assertIn("epoch.checkpoint_committed", source)
                  self.assertIn("run.continued", source)

              def test_global_999_is_schedulable_but_1000_is_terminal(self) -> None:
                  from v3.runtime_turn_orchestration import TurnLoopState

                  state = TurnLoopState(action_rounds=999, epoch_index=13, epoch_action_rounds=24)
                  decision = state.decide_schedule(
                      1,
                      max_epoch_rounds=75,
                      max_global_rounds=1000,
                  )
                  self.assertTrue(decision.can_schedule)
                  state.reserve_one()
                  terminal = state.decide_schedule(
                      1,
                      max_epoch_rounds=75,
                      max_global_rounds=1000,
                  )
                  self.assertTrue(terminal.terminal)
                  self.assertTrue(terminal.global_exhausted)
                  self.assertFalse(terminal.can_schedule)
          '''
          path.write_text(text.replace(marker, addition + marker, 1), encoding='utf-8')
          PY

      - name: Remove one-shot workflow from final tree
        shell: bash
        run: git rm .github/workflows/p18-m1-wire-epoch-budget.yml

      - name: Syntax and focused tests
        shell: bash
        env:
          PYTHONPATH: app/backend/tiangong-backend:src
        run: |
          python -m py_compile \
            app/backend/tiangong-backend/v3/zongdiaodu.py \
            app/backend/tiangong-backend/v3/runtime_turn_orchestration.py \
            app/backend/tiangong-backend/v3/simple_chain_events.py \
            tests/test_p18_m1_execution_epoch.py
          python -m unittest tests.test_p18_m1_execution_epoch

      - name: Commit verified production wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/backend/tiangong-backend/v3/zongdiaodu.py tests/test_p18_m1_execution_epoch.py .github/workflows/p18-m1-wire-epoch-budget.yml
          git commit -m "P18-M1: wire epoch continuation into production simple chain"
          git push origin HEAD:agent/p18-m1-long-execution-chain-governance
