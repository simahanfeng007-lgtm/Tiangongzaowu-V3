name: P18 M2 crash matrix

on:
  push:
    branches: [agent/p18-m2-regenerative-execution-kernel]

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONHASHSEED: '0'
      TIANGONG_CI_ENV: '0'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install source dependencies
        run: python -m pip install -r requirements-source.lock
      - name: Apply crash-window healing
        run: python .github/p18_m2_crash_matrix_patch.py
      - name: Remove one-shot carriers
        run: git rm -f .github/p18_m2_crash_matrix_patch.py .github/workflows/p18-m2-crash-matrix.yml
      - name: Compile
        run: >-
          python -m py_compile
          src/total_gateway/regenerative_provider.py
          tests/test_p18_m2_crash_matrix.py
      - name: Source authority
        run: |
          python scripts/check-source-authority.py
          python scripts/sync-generated-sources.py --check-committed
      - name: Run transactional crash matrix
        run: >-
          python -m pytest -q
          tests/test_p18_m2_crash_matrix.py
          tests/test_p18_m2_runtime_effect_boundary.py
          tests/test_p18_m2_regenerative_provider.py
          tests/test_p18_m2_regenerative_store.py
          tests/test_effect_ledger.py
          tests/test_effect_fact_chain_v14.py
          tests/test_gateway_life_continuity.py
      - name: Verify crash-window invariants
        shell: bash
        run: |
          grep -q 'process_restart_before_dispatch' src/total_gateway/regenerative_provider.py
          grep -q 'reconstructed_from_effect_started_fence' src/total_gateway/regenerative_provider.py
          grep -q 'healed_from_canonical_effect_ledger' src/total_gateway/regenerative_provider.py
          grep -q 'recovered_terminal_event' src/total_gateway/regenerative_provider.py
      - name: Commit after validation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/total_gateway/regenerative_provider.py tests/test_p18_m2_crash_matrix.py
          git commit -m 'P18-M2: heal transactional crash windows from effect authority'
          git push origin HEAD:agent/p18-m2-regenerative-execution-kernel
