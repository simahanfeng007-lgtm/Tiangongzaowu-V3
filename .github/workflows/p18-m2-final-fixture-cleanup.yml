name: P18 M2 final fixture cleanup

on:
  push:
    branches: [agent/p18-m2-regenerative-execution-kernel]

permissions:
  contents: write

jobs:
  patch-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: python -m pip install -r requirements-source.lock
      - name: Fix Windows sqlite fixture lifetime
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_p18_m2_regenerative_store.py')
          text = path.read_text(encoding='utf-8')
          old_import = 'import unittest\nfrom pathlib import Path\n'
          if text.count(old_import) != 1:
              raise SystemExit(f'import anchor count={text.count(old_import)}')
          text = text.replace(old_import, 'import unittest\nfrom contextlib import closing\nfrom pathlib import Path\n', 1)
          old = '        with sqlite3.connect(self.path) as connection:\n'
          if text.count(old) != 2:
              raise SystemExit(f'raw sqlite fixture count={text.count(old)}')
          text = text.replace(old, '        with closing(sqlite3.connect(self.path)) as connection:\n')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Remove diagnostic and one-shot workflow
        run: git rm -f .github/p18_m2_migration_failure.txt .github/workflows/p18-m2-final-fixture-cleanup.yml
      - name: Validate M2 store fixtures and source authority
        run: |
          python -m pytest -q tests/test_p18_m2_regenerative_store.py
          python scripts/check-source-authority.py
          python scripts/sync-generated-sources.py --check-committed
      - name: Commit fixture cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'P18-M2: close cross-platform regression fixture resources'
          git push origin HEAD:agent/p18-m2-regenerative-execution-kernel
