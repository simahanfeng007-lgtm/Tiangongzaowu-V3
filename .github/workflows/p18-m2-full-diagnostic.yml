name: P18 M2 full regression diagnostic

on:
  push:
    branches: [agent/p18-m2-regenerative-execution-kernel]

permissions:
  contents: write

jobs:
  capture-ubuntu-full-failure:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONHASHSEED: '0'
      TIANGONG_CI_ENV: '0'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: python -m pip install -r requirements-source.lock
      - name: Capture complete pytest failure summary
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short > /tmp/p18-m2-full.log 2>&1
          code=$?
          set -e
          {
            echo "P18-M2 Ubuntu full diagnostic"
            echo "candidate=${GITHUB_SHA}"
            echo "exit_code=${code}"
            echo
            tail -n 400 /tmp/p18-m2-full.log
          } > .github/p18_m2_full_failure.txt
          echo "PYTEST_EXIT_CODE=${code}" >> "$GITHUB_ENV"
      - name: Remove diagnostic workflow and commit report
        shell: bash
        run: |
          git rm -f .github/workflows/p18-m2-full-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/p18_m2_full_failure.txt
          git commit -m 'P18-M2: capture full regression failure summary'
          git push origin HEAD:agent/p18-m2-regenerative-execution-kernel
