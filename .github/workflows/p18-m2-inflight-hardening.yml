name: P18 M2 in-flight hardening

on:
  push:
    branches: [agent/p18-m2-regenerative-execution-kernel]

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONHASHSEED: '0'
      TIANGONG_CI_ENV: '0'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install source dependencies
        run: python -m pip install -r requirements-source.lock
      - name: Apply in-flight hardening
        run: |
          python .github/p18_m2_inflight_patch.py
          python - <<'PY'
          from pathlib import Path
          path = Path('app/backend/tiangong-backend/v3/zongdiaodu.py')
          text = path.read_text(encoding='utf-8')
          old = '''    try:\n        raw = owner._jineng_zhixing(tool_name, tool_args, user_message, call_id=call_id)\n    except Exception as exc:\n        raw = {"ok": False, "error": str(exc), "error_code": type(exc).__name__}\n    status = str(raw.get("status") or raw.get("zhuangtai") or "").strip().lower() if isinstance(raw, dict) else ""\n    ambiguous = bool(isinstance(raw, dict) and raw.get("ambiguous_effect")) or status in {\n        "ambiguous", "unknown", "deadline", "timeout", "timed_out"\n    }\n    outcome = "ambiguous" if ambiguous else "succeeded" if tool_result_ok(raw) else "failed_final"\n'''
          new = '''    handler_exception = False\n    try:\n        raw = owner._jineng_zhixing(tool_name, tool_args, user_message, call_id=call_id)\n    except Exception as exc:\n        handler_exception = True\n        raw = {"ok": False, "error": str(exc), "error_code": type(exc).__name__}\n    status = str(raw.get("status") or raw.get("zhuangtai") or "").strip().lower() if isinstance(raw, dict) else ""\n    result_ok = bool(tool_result_ok(tool_name, raw))\n    ambiguous = handler_exception or bool(isinstance(raw, dict) and raw.get("ambiguous_effect")) or status in {\n        "ambiguous", "unknown", "deadline", "timeout", "timed_out"\n    }\n    outcome = "ambiguous" if ambiguous else "succeeded" if result_ok else "failed_final"\n'''
          if text.count(old) != 1:
              raise SystemExit(f'effect outcome anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          old_ok = '            "ok": bool(tool_result_ok(raw)),\n'
          wrapper_start = text.index('def _simple_chain_regenerative_execute_tool(')
          wrapper_end = text.index('def _simple_chain_regenerative_checkpoint(', wrapper_start)
          local = text[wrapper_start:wrapper_end]
          if local.count(old_ok) != 2:
              raise SystemExit(f'wrapper result projection count={local.count(old_ok)}')
          local = local.replace(old_ok, '            "ok": result_ok,\n')
          text = text[:wrapper_start] + local + text[wrapper_end:]
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Sync generated mirrors
        run: python scripts/sync-generated-sources.py --write
      - name: Remove one-shot carriers
        run: git rm -f .github/p18_m2_inflight_patch.py .github/workflows/p18-m2-inflight-hardening.yml
      - name: Compile
        run: >-
          python -m py_compile
          src/total_gateway/regenerative_provider.py
          app/backend/tiangong-backend/v3/zongdiaodu.py
          tests/test_p18_m2_runtime_effect_boundary.py
      - name: Source authority
        run: |
          python scripts/check-source-authority.py
          python scripts/sync-generated-sources.py --check-committed
      - name: Run effect-boundary regressions
        run: >-
          python -m pytest -q
          tests/test_p18_m2_runtime_effect_boundary.py
          tests/test_p18_m2_regenerative_provider.py
          tests/test_p18_m2_runtime_integration.py
          tests/test_effect_ledger.py
          tests/test_effect_fact_chain_v14.py
          tests/test_simple_chain_loop_budget.py
          tests/test_p18_m1_canonical_continuity.py
      - name: Verify unresolved-dispatch hard gate
        shell: bash
        run: |
          grep -q 'return "in_flight"' src/total_gateway/regenerative_provider.py
          grep -q '\[EFFECT_IN_FLIGHT\]' app/backend/tiangong-backend/v3/zongdiaodu.py
          grep -q 'duplicate retry blocked' app/backend/tiangong-backend/v3/zongdiaodu.py
          grep -q 'unresolved_started' src/total_gateway/regenerative_provider.py
          grep -q 'tool_result_ok(tool_name, raw)' app/backend/tiangong-backend/v3/zongdiaodu.py
          grep -q 'handler_exception = True' app/backend/tiangong-backend/v3/zongdiaodu.py
      - name: Commit after validation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'P18-M2: block duplicate dispatch while logical effect is in flight'
          git push origin HEAD:agent/p18-m2-regenerative-execution-kernel
