name: P18 M2 transactional effect authority

on:
  push:
    branches: [agent/p18-m2-regenerative-execution-kernel]

permissions:
  contents: write

jobs:
  validate-provider:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install source dependencies
        run: python -m pip install -r requirements-source.lock
      - name: Apply provider/store hardening
        run: |
          python .github/p18_m2_provider_patch.py
          python .github/p18_m2_recovery_patch.py
      - name: Remove one-shot carriers
        run: git rm -f .github/p18_m2_provider_patch.py .github/p18_m2_recovery_patch.py .github/workflows/p18-m2-provider-validate.yml
      - name: Compile
        run: >-
          python -m py_compile
          src/total_gateway/regenerative_execution.py
          src/total_gateway/regenerative_provider.py
          src/total_gateway/store.py
          tests/test_p18_m2_regenerative_provider.py
      - name: Source authority
        run: |
          python scripts/check-source-authority.py
          python scripts/sync-generated-sources.py --check-committed
      - name: Transactional effect and inherited regressions
        run: >-
          python -m pytest -q
          tests/test_p18_m2_regenerative_store.py
          tests/test_p18_m2_regenerative_provider.py
          tests/test_effect_ledger.py
          tests/test_effect_fact_chain_v14.py
          tests/test_gateway_life_continuity.py
      - name: Architecture invariants
        shell: bash
        run: |
          test "$(grep -R 'GatewayStateStore.open' -n src/total_gateway/regenerative_provider.py | wc -l)" -eq 0
          grep -q 'def get_request_generation_binding' src/total_gateway/store.py
          grep -q 'mark_effect_started' src/total_gateway/regenerative_provider.py
          grep -q 'reconcile_required' src/total_gateway/regenerative_provider.py
          grep -q 'step.ambiguous' src/total_gateway/regenerative_provider.py
          grep -q 'completion.rejected' src/total_gateway/regenerative_provider.py
      - name: Commit after validation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/total_gateway/store.py src/total_gateway/regenerative_provider.py
          git commit -m 'P18-M2: add transactional effect authority provider'
          git push origin HEAD:agent/p18-m2-regenerative-execution-kernel
