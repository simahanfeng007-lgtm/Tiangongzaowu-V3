name: P18 M2 production runtime integration

on:
  push:
    branches: [agent/p18-m2-regenerative-execution-kernel]

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONHASHSEED: '0'
      TIANGONG_CI_ENV: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source runtime dependencies
        run: python -m pip install -r requirements-source.lock
      - name: Align one-shot patch with canonical M1 checkpoint payload
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/p18_m2_runtime_integration_patch.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('# Canonical Continuity payload carries unresolved physical effects as well.')
          end = text.index('# No Epoch rollover until structured M2 checkpoint is committed.', start)
          replacement = '''# Canonical Continuity payload carries unresolved physical effects as well.\nzong = replace_once(\n    zong,\n    '            "epoch_tool_rounds": int(turn_loop.epoch_action_rounds),\\n',\n    '            "epoch_tool_rounds": int(turn_loop.epoch_action_rounds),\\n'\n    '            "pending_effect_ids": list(dict.fromkeys([\\n'\n    '                *(_simple_chain_regenerative_state(run_state).get("pending_effect_ids") or []),\\n'\n    '                *(_simple_chain_regenerative_state(run_state).get("ambiguous_effect_ids") or []),\\n'\n    '            ])),\\n',\n    "zong continuity pending effect payload",\n)\n\n'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8', newline='\n')
          PY
      - name: Apply P18-M2 production integration
        run: python .github/p18_m2_runtime_integration_patch.py
      - name: Upgrade inherited architecture assertions for M2 hard gates
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          m2 = Path('tests/test_p18_m2_runtime_integration.py')
          replace_once(
              m2,
              '        roots = ownership["authorities"][0]["implementation_roots"]\n        self.assertTrue(any(str(item).endswith("/runtime_regenerative_boundary.py") for item in roots))\n',
              '        v3 = next(row for row in ownership["mappings"] if row.get("id") == "v3-backend-main")\n        roots = set(v3["boundary_policy"]["implementation_roots"])\n        self.assertIn("runtime_regenerative_boundary.py", roots)\n',
              'M2 source ownership assertion',
          )

          m1 = Path('tests/test_p18_m1_canonical_continuity.py')
          replace_once(
              m1,
              '            _simple_chain_checkpoint_continue,\n            set_simple_chain_continuity_checkpoint_provider,\n        )\n',
              '            _simple_chain_checkpoint_continue,\n            set_simple_chain_continuity_checkpoint_provider,\n            set_simple_chain_regenerative_execution_provider,\n        )\n',
              'M1 imports M2 hard gate',
          )
          replace_once(
              m1,
              '                set_simple_chain_continuity_checkpoint_provider(provider)\n                with bind_run_context(context):\n',
              '''                regenerative_seen: list[dict[str, object]] = []\n\n                def regenerative_provider(payload: dict[str, object]) -> dict[str, object]:\n                    regenerative_seen.append(dict(payload))\n                    operation = str(payload.get("operation") or "")\n                    response: dict[str, object] = {\n                        "schema": "tiangong.gateway.regenerative-provider.v1",\n                        "operation": operation,\n                    }\n                    if operation == "update_frontier":\n                        frontier = payload.get("frontier") if isinstance(payload.get("frontier"), dict) else {}\n                        response.update({\n                            "committed": True,\n                            "frontier_version": int(frontier.get("frontier_version") or 1),\n                            "frontier_hash": str(frontier.get("frontier_hash") or ("8" * 64)),\n                        })\n                    elif operation == "commit_checkpoint":\n                        frontier = payload.get("frontier") if isinstance(payload.get("frontier"), dict) else {}\n                        response.update({\n                            "committed": True,\n                            "checkpoint_id": "rgc_" + "7" * 64,\n                            "checkpoint_hash": "6" * 64,\n                            "frontier_hash": str(frontier.get("frontier_hash") or ("8" * 64)),\n                        })\n                    else:\n                        raise AssertionError(f"unexpected M2 operation: {operation}")\n                    return response\n\n                set_simple_chain_continuity_checkpoint_provider(provider)\n                set_simple_chain_regenerative_execution_provider(regenerative_provider)\n                with bind_run_context(context):\n''',
              'M1 injects M2 checkpoint authority',
          )
          replace_once(
              m1,
              '                self.assertEqual(continuation["canonical_capsule_id"], "lcp_" + "9" * 64)\n                self.assertEqual(continuation["status"], "continued")\n            finally:\n                set_simple_chain_continuity_checkpoint_provider(None)\n',
              '                self.assertEqual(continuation["canonical_capsule_id"], "lcp_" + "9" * 64)\n                self.assertEqual(continuation["status"], "continued")\n                self.assertEqual([item["operation"] for item in regenerative_seen], ["update_frontier", "commit_checkpoint"])\n            finally:\n                set_simple_chain_regenerative_execution_provider(None)\n                set_simple_chain_continuity_checkpoint_provider(None)\n',
              'M1 verifies and clears M2 hard gate',
          )

          p17 = Path('tests/test_zongdiaodu_p17_m2_02.py')
          replace_once(
              p17,
              '            "coordinate_parallel_steps",\n            "self._jineng_zhixing",\n        }\n',
              '            "coordinate_parallel_steps",\n            "_simple_chain_regenerative_execute_tool",\n        }\n',
              'P17 executor boundary assertion',
          )
          replace_once(
              p17,
              '        # P18-M1 upgrades the old single global can_schedule cutoff to the\n        # dual-budget production bridge. The executor remains in Zongdiaodu;\n        # only budget coordination semantics changed.\n        self.assertNotIn("turn_loop.can_schedule", calls)\n',
              '        # P18-M1 upgrades the old single global can_schedule cutoff; P18-M2\n        # adds the Gateway-backed transactional dispatch boundary. Zongdiaodu\n        # still owns orchestration, but it may no longer call the physical\n        # executor directly from the main loop.\n        self.assertNotIn("turn_loop.can_schedule", calls)\n        self.assertNotIn("self._jineng_zhixing", calls)\n',
              'P17 M2 architecture comment and no-direct-dispatch guard',
          )
          PY
      - name: Synchronize generated source mirrors
        run: python scripts/sync-generated-sources.py --write
      - name: Remove one-shot integration carriers
        run: git rm -f .github/p18_m2_runtime_integration_patch.py .github/workflows/p18-m2-runtime-integration.yml
      - name: Compile production seams
        run: >-
          python -m py_compile
          src/total_gateway/regenerative_execution.py
          src/total_gateway/regenerative_provider.py
          src/total_gateway/store.py
          src/total_gateway/embedded_backend.py
          src/total_gateway/runtime.py
          app/backend/tiangong-backend/v3/runtime_regenerative_boundary.py
          app/backend/tiangong-backend/v3/zongdiaodu.py
          tests/test_p18_m2_regenerative_store.py
          tests/test_p18_m2_regenerative_provider.py
          tests/test_p18_m2_runtime_integration.py
          tests/test_p18_m1_canonical_continuity.py
          tests/test_zongdiaodu_p17_m2_02.py
      - name: Verify source authority and mirrors
        run: |
          python scripts/check-source-authority.py
          python scripts/sync-generated-sources.py --check-committed
      - name: Run M2 and inherited focused regressions
        run: >-
          python -m pytest -q
          tests/test_p18_m2_regenerative_store.py
          tests/test_p18_m2_regenerative_provider.py
          tests/test_p18_m2_runtime_integration.py
          tests/test_p18_m1_execution_epoch.py
          tests/test_p18_m1_canonical_continuity.py
          tests/test_p18_m1_delivery_boundaries.py
          tests/test_effect_ledger.py
          tests/test_effect_fact_chain_v14.py
          tests/test_gateway_life_continuity.py
          tests/test_completion_gate.py
          tests/test_simple_chain_loop_budget.py
          tests/test_zongdiaodu_p17_m2_02.py
      - name: Verify M2 production invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          zong = Path('app/backend/tiangong-backend/v3/zongdiaodu.py').read_text(encoding='utf-8')
          assert 'lambda: self._jineng_zhixing(tool_name, tool_args, xiaoxi, call_id=tool_call_id)' not in zong
          assert 'raw = self._jineng_zhixing(tn, ta, xiaoxi, call_id=call_id)' not in zong
          assert zong.count('_simple_chain_regenerative_execute_tool(') >= 3
          cp = zong.index('if not _simple_chain_regenerative_checkpoint(run_state, turn_loop, source=source):')
          rollover = zong.index('turn_loop.begin_next_epoch()', cp)
          assert cp < rollover
          assert zong.count('_simple_chain_regenerative_verify_completion(') >= 3
          assert '_simple_chain_regenerative_restore_turn_loop(run_state, turn_loop)' in zong
          assert '_simple_chain_bound_history(quality_history, limit=24)' in zong
          provider = Path('src/total_gateway/regenerative_provider.py').read_text(encoding='utf-8')
          assert 'GatewayStateStore.open' not in provider
          helper = Path('app/backend/tiangong-backend/v3/runtime_regenerative_boundary.py').read_text(encoding='utf-8')
          assert 'GatewayStateStore.open' not in helper
          runtime = Path('src/total_gateway/runtime.py').read_text(encoding='utf-8')
          assert 'RegenerativeExecutionAuthority(runtime.store)' in runtime
          print('P18-M2 production invariants: PASS')
          PY
      - name: Commit only after validation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'P18-M2: wire regenerative kernel into production runtime'
          git push origin HEAD:agent/p18-m2-regenerative-execution-kernel
