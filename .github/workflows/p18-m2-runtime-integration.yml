name: P18 M2 production runtime integration

on:
  push:
    branches: [agent/p18-m2-regenerative-execution-kernel]

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONHASHSEED: '0'
      TIANGONG_CI_ENV: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source runtime dependencies
        run: python -m pip install -r requirements-source.lock
      - name: Apply P18-M2 production integration
        run: python .github/p18_m2_runtime_integration_patch.py
      - name: Synchronize generated source mirrors
        run: python scripts/sync-generated-sources.py --write
      - name: Remove one-shot integration carriers
        run: git rm -f .github/p18_m2_runtime_integration_patch.py .github/workflows/p18-m2-runtime-integration.yml
      - name: Compile production seams
        run: >-
          python -m py_compile
          src/total_gateway/regenerative_execution.py
          src/total_gateway/regenerative_provider.py
          src/total_gateway/store.py
          src/total_gateway/embedded_backend.py
          src/total_gateway/runtime.py
          app/backend/tiangong-backend/v3/runtime_regenerative_boundary.py
          app/backend/tiangong-backend/v3/zongdiaodu.py
          tests/test_p18_m2_regenerative_store.py
          tests/test_p18_m2_regenerative_provider.py
          tests/test_p18_m2_runtime_integration.py
      - name: Verify source authority and mirrors
        run: |
          python scripts/check-source-authority.py
          python scripts/sync-generated-sources.py --check-committed
      - name: Run M2 and inherited focused regressions
        run: >-
          python -m pytest -q
          tests/test_p18_m2_regenerative_store.py
          tests/test_p18_m2_regenerative_provider.py
          tests/test_p18_m2_runtime_integration.py
          tests/test_p18_m1_execution_epoch.py
          tests/test_p18_m1_canonical_continuity.py
          tests/test_p18_m1_delivery_boundaries.py
          tests/test_effect_ledger.py
          tests/test_effect_fact_chain_v14.py
          tests/test_gateway_life_continuity.py
          tests/test_completion_gate.py
          tests/test_simple_chain_loop_budget.py
          tests/test_zongdiaodu_p17_m2_02.py
      - name: Verify M2 production invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          zong = Path('app/backend/tiangong-backend/v3/zongdiaodu.py').read_text(encoding='utf-8')
          assert 'lambda: self._jineng_zhixing(tool_name, tool_args, xiaoxi, call_id=tool_call_id)' not in zong
          assert 'raw = self._jineng_zhixing(tn, ta, xiaoxi, call_id=call_id)' not in zong
          assert zong.count('_simple_chain_regenerative_execute_tool(') >= 3
          cp = zong.index('if not _simple_chain_regenerative_checkpoint(run_state, turn_loop, source=source):')
          rollover = zong.index('turn_loop.begin_next_epoch()', cp)
          assert cp < rollover
          assert zong.count('_simple_chain_regenerative_verify_completion(') >= 3
          assert '_simple_chain_regenerative_restore_turn_loop(run_state, turn_loop)' in zong
          assert '_simple_chain_bound_history(quality_history, limit=24)' in zong
          provider = Path('src/total_gateway/regenerative_provider.py').read_text(encoding='utf-8')
          assert 'GatewayStateStore.open' not in provider
          helper = Path('app/backend/tiangong-backend/v3/runtime_regenerative_boundary.py').read_text(encoding='utf-8')
          assert 'GatewayStateStore.open' not in helper
          runtime = Path('src/total_gateway/runtime.py').read_text(encoding='utf-8')
          assert 'RegenerativeExecutionAuthority(runtime.store)' in runtime
          print('P18-M2 production invariants: PASS')
          PY
      - name: Commit only after validation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'P18-M2: wire regenerative kernel into production runtime'
          git push origin HEAD:agent/p18-m2-regenerative-execution-kernel
