name: P18 M2 validation

on:
  push:
    branches:
      - agent/p18-m2-regenerative-execution-kernel
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PYTHONHASHSEED: '0'

jobs:
  p18-m2-focused-ubuntu-latest:
    runs-on: ubuntu-latest
    env:
      TIANGONG_CI_ENV: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install source runtime dependencies
        run: python -m pip install -r requirements-source.lock
      - name: Verify source ownership and mirrors
        run: |
          python scripts/check-source-authority.py
          python scripts/sync-generated-sources.py --check-committed
      - name: Compile M2 production seams
        run: >-
          python -m py_compile
          src/total_gateway/regenerative_execution.py
          src/total_gateway/regenerative_provider.py
          src/total_gateway/store.py
          src/total_gateway/embedded_backend.py
          src/total_gateway/runtime.py
          app/backend/tiangong-backend/v3/runtime_regenerative_boundary.py
          app/backend/tiangong-backend/v3/runtime_turn_orchestration.py
          app/backend/tiangong-backend/v3/zongdiaodu.py
          tests/test_p18_m2_regenerative_store.py
          tests/test_p18_m2_regenerative_provider.py
          tests/test_p18_m2_runtime_integration.py
          tests/test_p18_m2_runtime_effect_boundary.py
          tests/test_p18_m2_crash_matrix.py
      - name: Run focused M2 and inherited execution regressions
        run: >-
          python -m pytest -q
          tests/test_p18_m2_regenerative_store.py
          tests/test_p18_m2_regenerative_provider.py
          tests/test_p18_m2_runtime_integration.py
          tests/test_p18_m2_runtime_effect_boundary.py
          tests/test_p18_m2_crash_matrix.py
          tests/test_p18_m1_execution_epoch.py
          tests/test_p18_m1_canonical_continuity.py
          tests/test_p18_m1_delivery_boundaries.py
          tests/test_effect_ledger.py
          tests/test_effect_fact_chain_v14.py
          tests/test_gateway_life_continuity.py
          tests/test_completion_gate.py
          tests/test_simple_chain_loop_budget.py
          tests/test_zongdiaodu_p17_m2_02.py
      - name: Verify M2 architecture invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          store = Path('src/total_gateway/store.py').read_text(encoding='utf-8')
          provider = Path('src/total_gateway/regenerative_provider.py').read_text(encoding='utf-8')
          runtime = Path('src/total_gateway/runtime.py').read_text(encoding='utf-8')
          embedded = Path('src/total_gateway/embedded_backend.py').read_text(encoding='utf-8')
          zong = Path('app/backend/tiangong-backend/v3/zongdiaodu.py').read_text(encoding='utf-8')
          boundary = Path('app/backend/tiangong-backend/v3/runtime_regenerative_boundary.py').read_text(encoding='utf-8')
          assert 'STORE_SCHEMA_VERSION = 21' in store
          assert 'gateway-regenerative-execution-v21' in store
          assert 'GatewayStateStore.open' not in provider
          assert 'GatewayStateStore.open' not in boundary
          assert 'RegenerativeExecutionAuthority(runtime.store)' in runtime
          assert 'set_regenerative_execution_provider' in embedded
          assert 'lambda: self._jineng_zhixing(tool_name, tool_args, xiaoxi, call_id=tool_call_id)' not in zong
          assert 'raw = self._jineng_zhixing(tn, ta, xiaoxi, call_id=call_id)' not in zong
          assert zong.count('_simple_chain_regenerative_execute_tool(') >= 3
          cp = zong.index('if not _simple_chain_regenerative_checkpoint(run_state, turn_loop, source=source):')
          assert cp < zong.index('turn_loop.begin_next_epoch()', cp)
          assert 'return "in_flight"' in provider
          assert 'process_restart_before_dispatch' in provider
          assert 'healed_from_canonical_effect_ledger' in provider
          assert 'event_type="chain.completed"' in provider
          print('P18-M2 architecture invariants: PASS')
          PY

  p18-m2-focused-windows-latest:
    runs-on: windows-latest
    env:
      TIANGONG_CI_ENV: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install source runtime dependencies
        run: python -m pip install -r requirements-source.lock
      - name: Verify source ownership and mirrors
        run: |
          python scripts/check-source-authority.py
          python scripts/sync-generated-sources.py --check-committed
      - name: Compile M2 production seams
        run: >-
          python -m py_compile
          src/total_gateway/regenerative_execution.py
          src/total_gateway/regenerative_provider.py
          src/total_gateway/store.py
          src/total_gateway/embedded_backend.py
          src/total_gateway/runtime.py
          app/backend/tiangong-backend/v3/runtime_regenerative_boundary.py
          app/backend/tiangong-backend/v3/runtime_turn_orchestration.py
          app/backend/tiangong-backend/v3/zongdiaodu.py
          tests/test_p18_m2_regenerative_store.py
          tests/test_p18_m2_regenerative_provider.py
          tests/test_p18_m2_runtime_integration.py
          tests/test_p18_m2_runtime_effect_boundary.py
          tests/test_p18_m2_crash_matrix.py
      - name: Run focused M2 and inherited execution regressions
        run: >-
          python -m pytest -q
          tests/test_p18_m2_regenerative_store.py
          tests/test_p18_m2_regenerative_provider.py
          tests/test_p18_m2_runtime_integration.py
          tests/test_p18_m2_runtime_effect_boundary.py
          tests/test_p18_m2_crash_matrix.py
          tests/test_p18_m1_execution_epoch.py
          tests/test_p18_m1_canonical_continuity.py
          tests/test_p18_m1_delivery_boundaries.py
          tests/test_effect_ledger.py
          tests/test_effect_fact_chain_v14.py
          tests/test_gateway_life_continuity.py
          tests/test_completion_gate.py
          tests/test_simple_chain_loop_budget.py
          tests/test_zongdiaodu_p17_m2_02.py
      - name: Verify M2 architecture invariants
        shell: pwsh
        run: |
          $script = @'
          from pathlib import Path
          store = Path('src/total_gateway/store.py').read_text(encoding='utf-8')
          provider = Path('src/total_gateway/regenerative_provider.py').read_text(encoding='utf-8')
          runtime = Path('src/total_gateway/runtime.py').read_text(encoding='utf-8')
          embedded = Path('src/total_gateway/embedded_backend.py').read_text(encoding='utf-8')
          zong = Path('app/backend/tiangong-backend/v3/zongdiaodu.py').read_text(encoding='utf-8')
          boundary = Path('app/backend/tiangong-backend/v3/runtime_regenerative_boundary.py').read_text(encoding='utf-8')
          assert 'STORE_SCHEMA_VERSION = 21' in store
          assert 'gateway-regenerative-execution-v21' in store
          assert 'GatewayStateStore.open' not in provider
          assert 'GatewayStateStore.open' not in boundary
          assert 'RegenerativeExecutionAuthority(runtime.store)' in runtime
          assert 'set_regenerative_execution_provider' in embedded
          assert 'lambda: self._jineng_zhixing(tool_name, tool_args, xiaoxi, call_id=tool_call_id)' not in zong
          assert 'raw = self._jineng_zhixing(tn, ta, xiaoxi, call_id=call_id)' not in zong
          assert zong.count('_simple_chain_regenerative_execute_tool(') >= 3
          cp = zong.index('if not _simple_chain_regenerative_checkpoint(run_state, turn_loop, source=source):')
          assert cp < zong.index('turn_loop.begin_next_epoch()', cp)
          assert 'return "in_flight"' in provider
          assert 'process_restart_before_dispatch' in provider
          assert 'healed_from_canonical_effect_ledger' in provider
          assert 'event_type="chain.completed"' in provider
          print('P18-M2 architecture invariants: PASS')
          '@
          $script | python -

  full-regression-ubuntu-latest:
    runs-on: ubuntu-latest
    env:
      TIANGONG_CI_ENV: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install full source-runtime dependencies
        run: python -m pip install -r requirements-source.lock
      - name: Run complete repository pytest
        run: python -m pytest -q

  full-regression-windows-latest:
    runs-on: windows-latest
    env:
      TIANGONG_CI_ENV: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install full source-runtime dependencies
        run: python -m pip install -r requirements-source.lock
      - name: Run complete repository pytest
        run: python -m pytest -q
