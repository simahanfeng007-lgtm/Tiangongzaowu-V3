name: P18 M2 Windows focused diagnostic

on:
  push:
    branches: [agent/p18-m2-regenerative-execution-kernel]

permissions:
  contents: write

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PYTHONHASHSEED: '0'
  TIANGONG_CI_ENV: '1'

jobs:
  capture-windows-focused-failure:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: python -m pip install -r requirements-source.lock
      - name: Capture focused failure summary
        shell: pwsh
        run: |
          $tests = @(
            'tests/test_p18_m2_regenerative_store.py',
            'tests/test_p18_m2_regenerative_provider.py',
            'tests/test_p18_m2_runtime_integration.py',
            'tests/test_p18_m2_runtime_effect_boundary.py',
            'tests/test_p18_m2_crash_matrix.py',
            'tests/test_p18_m1_execution_epoch.py',
            'tests/test_p18_m1_canonical_continuity.py',
            'tests/test_p18_m1_delivery_boundaries.py',
            'tests/test_effect_ledger.py',
            'tests/test_effect_fact_chain_v14.py',
            'tests/test_gateway_life_continuity.py',
            'tests/test_completion_gate.py',
            'tests/test_simple_chain_loop_budget.py',
            'tests/test_zongdiaodu_p17_m2_02.py'
          )
          python -m pytest -q --tb=short @tests *> p18-m2-windows-focused.log
          $code = $LASTEXITCODE
          $lines = Get-Content p18-m2-windows-focused.log
          @(
            'P18-M2 Windows focused diagnostic',
            "candidate=$env:GITHUB_SHA",
            "exit_code=$code",
            ''
          ) + ($lines | Select-Object -Last 500) | Set-Content -Encoding utf8 .github/p18_m2_windows_focused_failure.txt
          exit 0
      - name: Remove diagnostic workflow and commit report
        shell: pwsh
        run: |
          git rm -f .github/workflows/p18-m2-windows-focused-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/p18_m2_windows_focused_failure.txt
          git commit -m 'P18-M2: capture Windows focused failure summary'
          git push origin HEAD:agent/p18-m2-regenerative-execution-kernel
