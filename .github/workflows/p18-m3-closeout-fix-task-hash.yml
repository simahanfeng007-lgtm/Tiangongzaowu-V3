name: P18 M3 closeout task-hash seam fix

on:
  push:
    branches:
      - agent/p18-m3-adaptive-control-governance
    paths:
      - .github/workflows/p18-m3-closeout-fix-task-hash.yml

permissions:
  contents: write

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PYTHONHASHSEED: '0'

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install source runtime dependencies
        run: python -m pip install -r requirements-source.lock
      - name: Apply exact M3 observation task-hash fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/backend/tiangong-backend/v3/zongdiaodu.py')
          text = path.read_text(encoding='utf-8')
          old = '''    current_root_hash, current_task_hash = _simple_chain_task_hashes(run_state)\n    root_match = str(state.get("root_goal_hash") or "") in {"", str(current_root_hash or "")}\n    task_match = str(state.get("task_contract_hash") or "") in {"", str(current_task_hash or "")}\n'''
          new = '''    current_root_hash = str(frontier.get("root_goal_hash") or "")\n    current_task_contract = run_state.get("task_contract") if isinstance(run_state.get("task_contract"), dict) else {}\n    current_task_hash = _simple_chain_regenerative_sha256({\n        "domain": "tiangong.gateway.task-contract.v1",\n        "task_contract": dict(current_task_contract),\n    })\n    root_match = str(state.get("root_goal_hash") or "") in {"", current_root_hash}\n    task_match = str(state.get("task_contract_hash") or "") in {"", current_task_hash}\n'''
          count = text.count(old)
          print(f'exact seam matches: {count}')
          if count != 1:
              raise SystemExit(f'expected exactly one M3 task-hash seam, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python scripts/sync-generated-sources.py --write
      - name: Verify source authority and focused regressions
        run: |
          python scripts/check-source-authority.py
          python scripts/sync-generated-sources.py --check-committed
          python -m py_compile app/backend/tiangong-backend/v3/zongdiaodu.py app/backend/tiangong-backend/v3/runtime_adaptive_observation.py
          python -m pytest -q \
            tests/test_p18_m1_canonical_continuity.py::BackendCanonicalProviderTests::test_gateway_authorized_epoch_requires_canonical_provider_and_binds_result \
            tests/test_p18_m3_runtime_observation.py \
            tests/test_p18_m3_production_control_wiring.py \
            tests/test_p18_m3_version_drift_resume.py \
            tests/test_p18_m3_adaptive_control.py
      - name: Commit verified production fix and remove applicator
        shell: bash
        run: |
          git config user.name 'tiangong-p18-m3-bot'
          git config user.email 'tiangong-p18-m3-bot@users.noreply.github.com'
          git add app/backend/tiangong-backend/v3/zongdiaodu.py src source-ownership.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'P18-M3: fix observation task-contract hash seam'
          fi
          git rm .github/workflows/p18-m3-closeout-fix-task-hash.yml
          git commit -m 'P18-M3: remove closeout task-hash applicator'
          git push origin HEAD:agent/p18-m3-adaptive-control-governance
