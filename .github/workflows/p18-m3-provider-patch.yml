name: P18 M3 provider patch applicator

on:
  push:
    branches:
      - agent/p18-m3-adaptive-control-governance
    paths:
      - .github/workflows/p18-m3-provider-patch.yml

permissions:
  contents: write

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  apply-m3-production-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p18-m3-adaptive-control-governance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact M3 production patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          provider_path = Path('src/total_gateway/regenerative_provider.py')
          lines = provider_path.read_text(encoding='utf-8').splitlines()

          exec_import = next(i for i, line in enumerate(lines) if line == 'from .regenerative_execution import (')
          if '    CHECKPOINT_SCHEMA_VERSION,' not in lines[exec_import:exec_import + 12]:
              lines.insert(exec_import + 1, '    CHECKPOINT_SCHEMA_VERSION,')

          store_import = next(
              i for i, line in enumerate(lines)
              if line == 'from .store import GatewayStateStore, StoreConflictError, StoreCorruptionError'
          )
          if 'from .regenerative_governance import (' not in lines[max(0, store_import - 8):store_import + 1]:
              lines[store_import:store_import] = [
                  'from .regenerative_governance import (',
                  '    evaluate_checkpoint_version_compatibility,',
                  '    version_vector_from_mapping,',
                  ')',
              ]

          recover_if_candidates = [
              i for i, line in enumerate(lines)
              if line.strip() == 'if not recovered.get("recoverable"):'
          ]
          if len(recover_if_candidates) != 1:
              raise SystemExit(f'provider recover if candidates={recover_if_candidates}')
          recover_if = recover_if_candidates[0]
          frontier_idx = next(
              i for i in range(recover_if, min(len(lines), recover_if + 10))
              if lines[i].strip() == 'frontier: ExecutionFrontier = recovered["frontier"]'
          )
          event_idx = next(
              i for i in range(frontier_idx + 1, min(len(lines), frontier_idx + 10))
              if lines[i].strip() == 'event, _ = self._store.append_execution_event('
          )
          indent = lines[recover_if][:len(lines[recover_if]) - len(lines[recover_if].lstrip())]
          body = indent + '    '
          replacement = [
              indent + 'if not recovered.get("recoverable"):',
              body + 'return {"recoverable": False, "resume_allowed": False, "reason": recovered.get("reason")}',
              indent + 'frontier: ExecutionFrontier = recovered["frontier"]',
              indent + 'checkpoint = recovered["checkpoint"]',
              indent + 'checkpoint_vector = version_vector_from_mapping(checkpoint.model_dump(mode="json"))',
              indent + 'current_vector = version_vector_from_mapping({',
              body + '"checkpoint_schema_version": str(payload.get("checkpoint_schema_version") or CHECKPOINT_SCHEMA_VERSION),',
              body + '"runtime_version": str(payload.get("runtime_version") or "tiangong-v3"),',
              body + '"provider_version": str(payload.get("provider_version") or "unknown"),',
              body + '"model_version": str(payload.get("model_version") or "unknown"),',
              body + '"tool_contract_version": str(payload.get("tool_contract_version") or "omni_body.v1"),',
              body + '"skill_contract_version": str(payload.get("skill_contract_version") or "skill.v1"),',
              body + '"task_contract_version": str(payload.get("task_contract_version") or "task.v1"),',
              indent + '})',
              indent + 'raw_pairs = payload.get("migratable_schema_pairs") or ()',
              indent + 'migratable_pairs = tuple(',
              body + '(str(item[0]), str(item[1]))',
              body + 'for item in raw_pairs',
              body + 'if isinstance(item, (list, tuple)) and len(item) == 2',
              indent + ')',
              indent + 'version_decision = evaluate_checkpoint_version_compatibility(',
              body + 'checkpoint_vector,',
              body + 'current_vector,',
              body + 'compatible_mismatches=tuple(',
              body + '    str(item)',
              body + '    for item in (payload.get("compatible_version_mismatches") or ())',
              body + '    if str(item).strip()',
              body + '),',
              body + 'migratable_schema_pairs=migratable_pairs,',
              body + 'migration_completed=payload.get("version_migration_completed") is True,',
              body + 'revalidated=payload.get("version_revalidated") is True,',
              indent + ')',
              indent + 'if not version_decision.resume_allowed:',
              body + 'return {',
              body + '    "recoverable": True,',
              body + '    "resume_allowed": False,',
              body + '    "reconcile_required": bool(version_decision.reconcile_required),',
              body + '    "migration_required": bool(version_decision.migration_required),',
              body + '    "revalidation_required": bool(version_decision.revalidation_required),',
              body + '    "reason": ("RECONCILE_REQUIRED" if version_decision.reconcile_required else "VERSION_REVALIDATION_REQUIRED"),',
              body + '    "version_mismatches": list(version_decision.mismatches),',
              body + '    "version_reasons": list(version_decision.reasons),',
              body + '    "checkpoint": checkpoint.model_dump(mode="json"),',
              body + '    "frontier": frontier.model_dump(mode="json"),',
              body + '    "pending_effect_ids": list(recovered["pending_effect_ids"]),',
              body + '    "ambiguous_effect_ids": list(recovered["ambiguous_effect_ids"]),',
              body + '    "used_previous_checkpoint": bool(recovered["used_previous_checkpoint"]),',
              body + '}',
          ]
          lines[recover_if:event_idx] = replacement

          event_idx = next(
              i for i in range(recover_if + len(replacement), len(lines))
              if lines[i].strip() == 'event, _ = self._store.append_execution_event('
          )
          return_idx = next(i for i in range(event_idx + 1, len(lines)) if lines[i].strip() == 'return {')
          recoverable_idx = next(
              i for i in range(return_idx + 1, min(len(lines), return_idx + 12))
              if lines[i].strip() == '"recoverable": True,'
          )
          meta_indent = lines[recoverable_idx][:len(lines[recoverable_idx]) - len(lines[recoverable_idx].lstrip())]
          lines[recoverable_idx + 1:recoverable_idx + 1] = [
              meta_indent + '"resume_allowed": True,',
              meta_indent + '"reconcile_required": False,',
              meta_indent + '"migration_required": bool(version_decision.migration_required),',
              meta_indent + '"revalidation_required": False,',
              meta_indent + '"version_mismatches": list(version_decision.mismatches),',
          ]
          for i in range(return_idx, min(len(lines), return_idx + 20)):
              if '"checkpoint": recovered["checkpoint"].model_dump(mode="json")' in lines[i]:
                  lines[i] = lines[i].replace('recovered["checkpoint"]', 'checkpoint')
                  break
          else:
              raise SystemExit('provider final checkpoint return not found')
          provider_path.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')

          zong_path = Path('app/backend/tiangong-backend/v3/zongdiaodu.py')
          zong_lines = zong_path.read_text(encoding='utf-8').splitlines()
          failure_candidates = [
              i for i, line in enumerate(zong_lines)
              if '[epoch_checkpoint_failed] checkpoint persistence failed' in line
          ]
          if len(failure_candidates) != 1:
              raise SystemExit(f'zong checkpoint failure candidates={failure_candidates}')
          failure_idx = failure_candidates[0]
          resumed_idx = next(
              i for i in range(failure_idx + 1, min(len(zong_lines), failure_idx + 8))
              if zong_lines[i].strip() == 'resumed = turn_loop.decide_schedule('
          )
          admission_indent = zong_lines[resumed_idx][:len(zong_lines[resumed_idx]) - len(zong_lines[resumed_idx].lstrip())]
          if not any('turn_loop.activate_adaptive_control()' in line for line in zong_lines[failure_idx:resumed_idx + 1]):
              zong_lines[resumed_idx:resumed_idx] = [
                  admission_indent + '# P18-M3 admission occurs only after durable checkpoint persistence succeeds.',
                  admission_indent + 'turn_loop.activate_adaptive_control()',
              ]
          zong_path.write_text('\n'.join(zong_lines) + '\n', encoding='utf-8', newline='\n')

          Path('.github/workflows/p18-m3-provider-patch.yml').unlink()
          print('P18-M3 exact production patches applied')
          PY
      - name: Sync generated source mirrors
        run: python scripts/sync-generated-sources.py --write
      - name: Verify targeted M3 and inherited M1 M2 behavior
        run: |
          python -m pip install -r requirements-source.lock
          python scripts/check-source-authority.py
          python scripts/sync-generated-sources.py --check-committed
          python -m py_compile src/total_gateway/regenerative_provider.py src/total_gateway/regenerative_governance.py src/world_understanding/known/freshness.py src/world_understanding/known/set.py app/backend/tiangong-backend/v3/runtime_turn_orchestration.py app/backend/tiangong-backend/v3/zongdiaodu.py
          python -m pytest -q tests/test_p18_m3_version_drift_resume.py tests/test_p18_m3_production_control_wiring.py tests/test_p18_m3_learning_poisoning.py tests/test_p18_m3_known_fact_freshness.py tests/test_p18_m2_regenerative_provider.py tests/test_p18_m1_execution_epoch.py tests/test_p18_m1_canonical_continuity.py tests/test_world_understanding_p4_known_closure.py
      - name: Commit production patch and remove applicator
        shell: bash
        run: |
          git config user.name "tiangong-p18-m3-bot"
          git config user.email "tiangong-p18-m3-bot@users.noreply.github.com"
          git add -A
          git commit -m "P18-M3: wire adaptive admission and version-safe resume"
          git push origin HEAD:agent/p18-m3-adaptive-control-governance
