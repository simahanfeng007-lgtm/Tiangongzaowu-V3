name: P18 M3 provider patch applicator

on:
  push:
    branches:
      - agent/p18-m3-adaptive-control-governance
    paths:
      - .github/workflows/p18-m3-provider-patch.yml

permissions:
  contents: write

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  apply-m3-production-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p18-m3-adaptive-control-governance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact M3 production patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          provider_path = Path('src/total_gateway/regenerative_provider.py')
          provider = provider_path.read_text(encoding='utf-8')

          import_anchor = "from .regenerative_execution import (\n    ExecutionFrontier,"
          import_replacement = "from .regenerative_execution import (\n    CHECKPOINT_SCHEMA_VERSION,\n    ExecutionFrontier,"
          if provider.count(import_anchor) != 1:
              raise SystemExit('provider regenerative import seam changed')
          provider = provider.replace(import_anchor, import_replacement, 1)

          store_anchor = "    derive_step_id,\n)\nfrom .store import GatewayStateStore, StoreConflictError, StoreCorruptionError"
          store_replacement = "    derive_step_id,\n)\nfrom .regenerative_governance import (\n    evaluate_checkpoint_version_compatibility,\n    version_vector_from_mapping,\n)\nfrom .store import GatewayStateStore, StoreConflictError, StoreCorruptionError"
          if provider.count(store_anchor) != 1:
              raise SystemExit('provider governance import seam changed')
          provider = provider.replace(store_anchor, store_replacement, 1)

          recover_anchor = '''        if not recovered.get("recoverable"):
              return {"recoverable": False, "reason": recovered.get("reason")}
          frontier: ExecutionFrontier = recovered["frontier"]
          event, _ = self._store.append_execution_event(
          '''
          recover_replacement = '''        if not recovered.get("recoverable"):
              return {"recoverable": False, "resume_allowed": False, "reason": recovered.get("reason")}
          frontier: ExecutionFrontier = recovered["frontier"]
          checkpoint = recovered["checkpoint"]
          checkpoint_vector = version_vector_from_mapping(checkpoint.model_dump(mode="json"))
          current_vector = version_vector_from_mapping({
              "checkpoint_schema_version": str(payload.get("checkpoint_schema_version") or CHECKPOINT_SCHEMA_VERSION),
              "runtime_version": str(payload.get("runtime_version") or "tiangong-v3"),
              "provider_version": str(payload.get("provider_version") or "unknown"),
              "model_version": str(payload.get("model_version") or "unknown"),
              "tool_contract_version": str(payload.get("tool_contract_version") or "omni_body.v1"),
              "skill_contract_version": str(payload.get("skill_contract_version") or "skill.v1"),
              "task_contract_version": str(payload.get("task_contract_version") or "task.v1"),
          })
          raw_pairs = payload.get("migratable_schema_pairs") or ()
          migratable_pairs = tuple(
              (str(item[0]), str(item[1]))
              for item in raw_pairs
              if isinstance(item, (list, tuple)) and len(item) == 2
          )
          version_decision = evaluate_checkpoint_version_compatibility(
              checkpoint_vector,
              current_vector,
              compatible_mismatches=tuple(
                  str(item)
                  for item in (payload.get("compatible_version_mismatches") or ())
                  if str(item).strip()
              ),
              migratable_schema_pairs=migratable_pairs,
              migration_completed=payload.get("version_migration_completed") is True,
              revalidated=payload.get("version_revalidated") is True,
          )
          if not version_decision.resume_allowed:
              return {
                  "recoverable": True,
                  "resume_allowed": False,
                  "reconcile_required": bool(version_decision.reconcile_required),
                  "migration_required": bool(version_decision.migration_required),
                  "revalidation_required": bool(version_decision.revalidation_required),
                  "reason": (
                      "RECONCILE_REQUIRED"
                      if version_decision.reconcile_required
                      else "VERSION_REVALIDATION_REQUIRED"
                  ),
                  "version_mismatches": list(version_decision.mismatches),
                  "version_reasons": list(version_decision.reasons),
                  "checkpoint": checkpoint.model_dump(mode="json"),
                  "frontier": frontier.model_dump(mode="json"),
                  "pending_effect_ids": list(recovered["pending_effect_ids"]),
                  "ambiguous_effect_ids": list(recovered["ambiguous_effect_ids"]),
                  "used_previous_checkpoint": bool(recovered["used_previous_checkpoint"]),
              }
          event, _ = self._store.append_execution_event(
          '''
          if provider.count(recover_anchor) != 1:
              raise SystemExit('provider recover seam changed')
          provider = provider.replace(recover_anchor, recover_replacement, 1)

          return_anchor = '''        return {
              "recoverable": True,
              "checkpoint": recovered["checkpoint"].model_dump(mode="json"),
              "frontier": frontier.model_dump(mode="json"),
          '''
          return_replacement = '''        return {
              "recoverable": True,
              "resume_allowed": True,
              "reconcile_required": False,
              "migration_required": bool(version_decision.migration_required),
              "revalidation_required": False,
              "version_mismatches": list(version_decision.mismatches),
              "checkpoint": checkpoint.model_dump(mode="json"),
              "frontier": frontier.model_dump(mode="json"),
          '''
          if provider.count(return_anchor) != 1:
              raise SystemExit('provider recovery return seam changed')
          provider = provider.replace(return_anchor, return_replacement, 1)
          provider_path.write_text(provider, encoding='utf-8', newline='\n')

          zong_path = Path('app/backend/tiangong-backend/v3/zongdiaodu.py')
          zong = zong_path.read_text(encoding='utf-8')
          admission_anchor = '''        return False, ("[epoch_checkpoint_failed] checkpoint persistence failed",)
          resumed = turn_loop.decide_schedule(
          '''
          admission_replacement = '''        return False, ("[epoch_checkpoint_failed] checkpoint persistence failed",)
          # P18-M3 admission is explicit and only occurs after the authoritative
          # durable checkpoint seam succeeds. Generic M1 epoch rollover keeps
          # its historical fixed-budget semantics.
          turn_loop.activate_adaptive_control()
          resumed = turn_loop.decide_schedule(
          '''
          if zong.count(admission_anchor) != 1:
              raise SystemExit(f'zong adaptive admission seam count={zong.count(admission_anchor)}')
          zong = zong.replace(admission_anchor, admission_replacement, 1)
          zong_path.write_text(zong, encoding='utf-8', newline='\n')

          Path('.github/workflows/p18-m3-provider-patch.yml').unlink()
          PY
      - name: Sync generated source mirrors
        run: python scripts/sync-generated-sources.py
      - name: Verify targeted M3 and inherited M1 M2 behavior
        run: |
          python -m pip install -r requirements-source.lock
          python scripts/check-source-authority.py
          python scripts/sync-generated-sources.py --check-committed
          python -m py_compile src/total_gateway/regenerative_provider.py src/total_gateway/regenerative_governance.py app/backend/tiangong-backend/v3/runtime_turn_orchestration.py app/backend/tiangong-backend/v3/zongdiaodu.py
          python -m pytest -q tests/test_p18_m3_version_drift_resume.py tests/test_p18_m3_production_control_wiring.py tests/test_p18_m3_learning_poisoning.py tests/test_p18_m2_regenerative_provider.py tests/test_p18_m1_execution_epoch.py tests/test_p18_m1_canonical_continuity.py
      - name: Commit production patch and remove applicator
        shell: bash
        run: |
          git config user.name "tiangong-p18-m3-bot"
          git config user.email "tiangong-p18-m3-bot@users.noreply.github.com"
          git add -A
          git commit -m "P18-M3: wire adaptive admission and version-safe resume"
          git push origin HEAD:agent/p18-m3-adaptive-control-governance
