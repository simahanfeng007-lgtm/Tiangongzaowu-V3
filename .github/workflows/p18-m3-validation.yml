name: P18 M3 validation

on:
  push:
    branches:
      - agent/p18-m3-adaptive-control-governance
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PYTHONHASHSEED: '0'

jobs:
  p18-m3-focused-ubuntu-latest:
    runs-on: ubuntu-latest
    env:
      TIANGONG_CI_ENV: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install source runtime dependencies
        run: python -m pip install -r requirements-source.lock
      - name: Verify source ownership and mirrors
        run: |
          python scripts/check-source-authority.py
          python scripts/sync-generated-sources.py --check-committed
      - name: Compile M3 and inherited production seams
        run: >-
          python -m py_compile
          app/backend/tiangong-backend/v3/runtime_adaptive_control.py
          app/backend/tiangong-backend/v3/runtime_regenerative_boundary.py
          app/backend/tiangong-backend/v3/runtime_turn_orchestration.py
          src/total_gateway/regenerative_execution.py
          src/total_gateway/regenerative_provider.py
          src/total_gateway/store.py
          app/backend/tiangong-backend/v3/zongdiaodu.py
          tests/test_p18_m3_adaptive_control.py
          tests/test_p18_m3_turn_loop_adaptive.py
      - name: Run M3 control and inherited M2 execution regressions
        run: >-
          python -m pytest -q
          tests/test_p18_m3_adaptive_control.py
          tests/test_p18_m3_turn_loop_adaptive.py
          tests/test_p18_m2_regenerative_store.py
          tests/test_p18_m2_regenerative_provider.py
          tests/test_p18_m2_runtime_integration.py
          tests/test_p18_m2_runtime_effect_boundary.py
          tests/test_p18_m2_crash_matrix.py
          tests/test_p18_m1_execution_epoch.py
          tests/test_p18_m1_canonical_continuity.py
          tests/test_p18_m1_delivery_boundaries.py
          tests/test_effect_ledger.py
          tests/test_effect_fact_chain_v14.py
          tests/test_gateway_life_continuity.py
          tests/test_completion_gate.py
          tests/test_simple_chain_loop_budget.py
      - name: Verify M3 architecture invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          adaptive = Path('app/backend/tiangong-backend/v3/runtime_adaptive_control.py').read_text(encoding='utf-8')
          turn = Path('app/backend/tiangong-backend/v3/runtime_turn_orchestration.py').read_text(encoding='utf-8')
          provider = Path('src/total_gateway/regenerative_provider.py').read_text(encoding='utf-8')
          zong = Path('app/backend/tiangong-backend/v3/zongdiaodu.py').read_text(encoding='utf-8')
          for token in ('GatewayStateStore', 'sqlite3', 'subprocess', '_jineng_zhixing', 'execution_ticket_id'):
              assert token not in adaptive
          assert 'RegenerativeExecutionAuthority(runtime.store)' in Path('src/total_gateway/runtime.py').read_text(encoding='utf-8')
          assert 'GatewayStateStore.open' not in provider
          assert zong.count('_simple_chain_regenerative_execute_tool(') >= 3
          assert 'class AdaptiveHorizonState' in adaptive
          assert 'class FrontierProgressMonitor' in adaptive
          assert 'def evaluate_resource_governor' in adaptive
          assert 'adaptive_horizon: AdaptiveHorizonState' in turn
          assert 'def decide_adaptive_schedule' in turn
          print('P18-M3 control architecture invariants: PASS')
          PY

  p18-m3-focused-windows-latest:
    runs-on: windows-latest
    env:
      TIANGONG_CI_ENV: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install source runtime dependencies
        run: python -m pip install -r requirements-source.lock
      - name: Verify source ownership and mirrors
        run: |
          python scripts/check-source-authority.py
          python scripts/sync-generated-sources.py --check-committed
      - name: Compile M3 and inherited production seams
        run: >-
          python -m py_compile
          app/backend/tiangong-backend/v3/runtime_adaptive_control.py
          app/backend/tiangong-backend/v3/runtime_regenerative_boundary.py
          app/backend/tiangong-backend/v3/runtime_turn_orchestration.py
          src/total_gateway/regenerative_execution.py
          src/total_gateway/regenerative_provider.py
          src/total_gateway/store.py
          app/backend/tiangong-backend/v3/zongdiaodu.py
          tests/test_p18_m3_adaptive_control.py
          tests/test_p18_m3_turn_loop_adaptive.py
      - name: Run M3 control and inherited M2 execution regressions
        run: >-
          python -m pytest -q
          tests/test_p18_m3_adaptive_control.py
          tests/test_p18_m3_turn_loop_adaptive.py
          tests/test_p18_m2_regenerative_store.py
          tests/test_p18_m2_regenerative_provider.py
          tests/test_p18_m2_runtime_integration.py
          tests/test_p18_m2_runtime_effect_boundary.py
          tests/test_p18_m2_crash_matrix.py
          tests/test_p18_m1_execution_epoch.py
          tests/test_p18_m1_canonical_continuity.py
          tests/test_p18_m1_delivery_boundaries.py
          tests/test_effect_ledger.py
          tests/test_effect_fact_chain_v14.py
          tests/test_gateway_life_continuity.py
          tests/test_completion_gate.py
          tests/test_simple_chain_loop_budget.py
      - name: Verify M3 architecture invariants
        shell: pwsh
        run: |
          $script = @'
          from pathlib import Path
          adaptive = Path('app/backend/tiangong-backend/v3/runtime_adaptive_control.py').read_text(encoding='utf-8')
          turn = Path('app/backend/tiangong-backend/v3/runtime_turn_orchestration.py').read_text(encoding='utf-8')
          provider = Path('src/total_gateway/regenerative_provider.py').read_text(encoding='utf-8')
          zong = Path('app/backend/tiangong-backend/v3/zongdiaodu.py').read_text(encoding='utf-8')
          for token in ('GatewayStateStore', 'sqlite3', 'subprocess', '_jineng_zhixing', 'execution_ticket_id'):
              assert token not in adaptive
          assert 'RegenerativeExecutionAuthority(runtime.store)' in Path('src/total_gateway/runtime.py').read_text(encoding='utf-8')
          assert 'GatewayStateStore.open' not in provider
          assert zong.count('_simple_chain_regenerative_execute_tool(') >= 3
          assert 'class AdaptiveHorizonState' in adaptive
          assert 'class FrontierProgressMonitor' in adaptive
          assert 'def evaluate_resource_governor' in adaptive
          assert 'adaptive_horizon: AdaptiveHorizonState' in turn
          assert 'def decide_adaptive_schedule' in turn
          print('P18-M3 control architecture invariants: PASS')
          '@
          $script | python -
