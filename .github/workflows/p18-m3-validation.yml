name: P18 M3 validation

on:
  push:
    branches:
      - agent/p18-m3-adaptive-control-governance
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PYTHONHASHSEED: '0'

jobs:
  p18-m3-focused-ubuntu-latest:
    runs-on: ubuntu-latest
    env:
      TIANGONG_CI_ENV: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install source runtime dependencies
        run: python -m pip install -r requirements-source.lock
      - name: Verify source ownership and mirrors
        run: |
          python scripts/check-source-authority.py
          python scripts/sync-generated-sources.py --check-committed
      - name: Compile M3 and inherited production seams
        run: >-
          python -m py_compile
          app/backend/tiangong-backend/v3/runtime_adaptive_control.py
          app/backend/tiangong-backend/v3/runtime_adaptive_governance.py
          app/backend/tiangong-backend/v3/runtime_regenerative_boundary.py
          app/backend/tiangong-backend/v3/runtime_turn_orchestration.py
          app/backend/tiangong-backend/v3/runtime_tool_result_boundary.py
          src/life_service/memory_promotion.py
          src/total_gateway/regenerative_execution.py
          src/total_gateway/regenerative_governance.py
          src/total_gateway/regenerative_provider.py
          src/total_gateway/store.py
          src/world_understanding/known/freshness.py
          src/world_understanding/known/set.py
          app/backend/tiangong-backend/v3/zongdiaodu.py
          tests/test_p18_m3_adaptive_control.py
          tests/test_p18_m3_turn_loop_adaptive.py
          tests/test_p18_m3_adaptive_governance.py
          tests/test_p18_m3_production_control_wiring.py
          tests/test_p18_m3_tool_result_poisoning.py
          tests/test_p18_m3_learning_poisoning.py
          tests/test_p18_m3_known_fact_freshness.py
          tests/test_p18_m3_version_drift_resume.py
      - name: Run M3 hard gates and inherited execution regressions
        run: >-
          python -m pytest -q
          tests/test_p18_m3_adaptive_control.py
          tests/test_p18_m3_turn_loop_adaptive.py
          tests/test_p18_m3_adaptive_governance.py
          tests/test_p18_m3_production_control_wiring.py
          tests/test_p18_m3_tool_result_poisoning.py
          tests/test_p18_m3_learning_poisoning.py
          tests/test_p18_m3_known_fact_freshness.py
          tests/test_p18_m3_version_drift_resume.py
          tests/test_memory_promotion_math_p15.py
          tests/test_world_understanding_p4_known_closure.py
          tests/test_p18_m2_regenerative_store.py
          tests/test_p18_m2_regenerative_provider.py
          tests/test_p18_m2_runtime_integration.py
          tests/test_p18_m2_runtime_effect_boundary.py
          tests/test_p18_m2_crash_matrix.py
          tests/test_p18_m1_execution_epoch.py
          tests/test_p18_m1_canonical_continuity.py
          tests/test_p18_m1_delivery_boundaries.py
          tests/test_effect_ledger.py
          tests/test_effect_fact_chain_v14.py
          tests/test_gateway_life_continuity.py
          tests/test_completion_gate.py
          tests/test_simple_chain_loop_budget.py
          tests/test_zongdiaodu_p17_m2_02.py
      - name: Verify M3 architecture and 15-gate coverage invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          adaptive = Path('app/backend/tiangong-backend/v3/runtime_adaptive_control.py').read_text(encoding='utf-8')
          governance = Path('app/backend/tiangong-backend/v3/runtime_adaptive_governance.py').read_text(encoding='utf-8')
          turn = Path('app/backend/tiangong-backend/v3/runtime_turn_orchestration.py').read_text(encoding='utf-8')
          tool_boundary = Path('app/backend/tiangong-backend/v3/runtime_tool_result_boundary.py').read_text(encoding='utf-8')
          provider = Path('src/total_gateway/regenerative_provider.py').read_text(encoding='utf-8')
          version_governance = Path('src/total_gateway/regenerative_governance.py').read_text(encoding='utf-8')
          known = Path('src/world_understanding/known/set.py').read_text(encoding='utf-8')
          freshness = Path('src/world_understanding/known/freshness.py').read_text(encoding='utf-8')
          zong = Path('app/backend/tiangong-backend/v3/zongdiaodu.py').read_text(encoding='utf-8')
          runtime = Path('src/total_gateway/runtime.py').read_text(encoding='utf-8')

          for source in (adaptive, governance, version_governance, freshness):
              for token in ('GatewayStateStore.open', 'sqlite3.connect', 'subprocess.run', '_jineng_zhixing'):
                  assert token not in source
          assert 'RegenerativeExecutionAuthority(runtime.store)' in runtime
          assert 'GatewayStateStore.open' not in provider
          assert zong.count('_simple_chain_regenerative_execute_tool(') >= 3

          # M3.1-M3.7 adaptive control remains pure and uses the existing TurnLoopState.
          assert 'class AdaptiveHorizonState' in adaptive
          assert 'class FrontierProgressMonitor' in adaptive
          assert 'class ExecutionPotential' in adaptive
          assert 'def evaluate_resource_governor' in adaptive
          assert 'adaptive_horizon: AdaptiveHorizonState' in turn
          assert 'def activate_adaptive_control' in turn
          assert 'def decide_schedule' in turn
          assert 'def observe_semantic_drift' in turn
          assert 'def observe_resource_governor' in turn
          assert 'turn_loop.activate_adaptive_control()' in zong

          # M3.8 stale/volatile Known dependency cannot silently reuse.
          assert 'class StaleKnownDependency' in known
          assert 'def get_hash_for_dependency' in known
          assert 'def evaluate_known_freshness' in freshness
          assert 'VOLATILE_SOURCE_KINDS' in freshness

          # M3.9 ToolResult is data, never control authority.
          assert 'contract["trust_class"] = UNTRUSTED_DATA' in tool_boundary
          assert 'contract["instruction_source"] = TOOL_RESULT_DATA' in tool_boundary
          assert 'contract["may_change_authority"] = False' in tool_boundary

          # M3.10/M3.11 learning and semantic-drift guards are policy inputs to existing authorities.
          assert 'def evaluate_learning_promotion' in governance
          assert 'def evaluate_semantic_drift' in governance
          assert 'explicit_user_memory_ssot' in governance

          # M3.12: compatibility is checked before the existing run.resumed authority event.
          guard = provider.index('version_decision = evaluate_checkpoint_version_compatibility(')
          resumed = provider.index('event_key=f"run.resumed:')
          assert guard < resumed
          assert 'RECONCILE_REQUIRED' in provider
          assert 'resume_allowed' in provider

          # No temporary patch path may remain in the sealed source tree.
          assert not Path('.github/workflows/p18-m3-provider-patch.yml').exists()
          print('P18-M3 architecture + hard-gate coverage invariants: PASS')
          PY

