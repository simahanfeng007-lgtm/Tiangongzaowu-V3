name: P18 M4.3-M4.6 final closeout

on:
  push:
    branches:
      - agent/p18-m4-adversarial-certification
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PYTHONHASHSEED: '0'

jobs:
  m4-3-6-focused-ubuntu:
    runs-on: ubuntu-latest
    env:
      TIANGONG_CI_ENV: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source dependencies
        run: python -m pip install -r requirements-source.lock
      - name: Verify source authority and generated mirrors
        run: |
          python scripts/check-source-authority.py
          python scripts/sync-generated-sources.py --check-committed
      - name: Compile M4.3-M4.6 seams
        run: >-
          python -m py_compile
          src/total_gateway/regenerative_provider.py
          src/total_gateway/store.py
          tests/p18_m4_deterministic_harness.py
          tests/test_p18_m4_deterministic_1000_step.py
          tests/test_p18_m4_persistence_corruption.py
          tests/test_p18_m4_corruption_matrix.py
          tests/test_p18_m4_authority_repairs.py
          tests/p18_m4_real_process_worker.py
          tests/test_p18_m4_real_process.py
          tests/p18_m4_provider_l4_harness.py
          tests/test_p18_m4_provider_l4.py
          tests/test_p18_m4_cross_provider_resume.py
          tests/test_p18_m4_cross_provider_final.py
      - name: Run M4.3-M4.6 focused plus inherited authority regressions
        run: >-
          python -m pytest -q
          tests/test_p18_m4_deterministic_1000_step.py
          tests/test_p18_m4_persistence_corruption.py
          tests/test_p18_m4_corruption_matrix.py
          tests/test_p18_m4_authority_repairs.py
          tests/test_p18_m4_real_process.py
          tests/test_p18_m4_provider_l4.py
          tests/test_p18_m4_cross_provider_resume.py
          tests/test_p18_m4_cross_provider_final.py
          tests/test_p18_m3_adaptive_control.py
          tests/test_p18_m3_turn_loop_adaptive.py
          tests/test_p18_m3_adaptive_governance.py
          tests/test_p18_m3_production_control_wiring.py
          tests/test_p18_m3_runtime_observation.py
          tests/test_p18_m3_tool_result_poisoning.py
          tests/test_p18_m3_learning_poisoning.py
          tests/test_p18_m3_known_fact_freshness.py
          tests/test_p18_m3_version_drift_resume.py
          tests/test_p18_m2_regenerative_provider.py
          tests/test_p18_m2_crash_matrix.py
          tests/test_p18_m1_execution_epoch.py
          tests/test_effect_fact_chain_v14.py
          tests/test_completion_gate.py
      - name: Verify final M4.3-M4.6 architecture invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('.')
          provider = Path('src/total_gateway/regenerative_provider.py').read_text(encoding='utf-8')
          store = Path('src/total_gateway/store.py').read_text(encoding='utf-8')
          runtime = Path('src/total_gateway/runtime.py').read_text(encoding='utf-8')
          matrix = Path('tests/test_p18_m4_corruption_matrix.py').read_text(encoding='utf-8')
          worker = Path('tests/p18_m4_real_process_worker.py').read_text(encoding='utf-8')
          l4 = Path('tests/p18_m4_provider_l4_harness.py').read_text(encoding='utf-8')
          cross = Path('tests/test_p18_m4_cross_provider_final.py').read_text(encoding='utf-8')
          adapter = Path('app/backend/tiangong-backend/tiangong_kernel/l4_action_grounding/model_provider_adapter.py').read_text(encoding='utf-8')

          assert 'RegenerativeExecutionAuthority(runtime.store)' in runtime
          assert 'GatewayStateStore.open' not in provider
          assert 'acquire_dispatch_permit(' in provider
          assert 'mark_effect_started(effect_id' not in provider
          assert 'latest_effect_verdict' in provider
          assert 'latest_effect_verdict' in store
          assert 'M4_CORRUPTION_MATRIX' in matrix and 'list(range(1, 21))' in matrix
          assert 'GatewayStateStore.open' in worker
          assert 'RegenerativeExecutionAuthority' in worker
          assert 'class LongChainRuntime' not in worker
          assert '_jineng_zhixing' not in worker
          assert 'MODEL_ROUNDS = 200' in l4
          assert 'MIN_TOOL_STEPS = 1000' in l4
          assert 'LONG_HORIZON_PRODUCTION_READY' not in adapter
          assert 'TARGET_PROVIDERS = ("mimo", "glm_5_2", "minimax_m3", "gpt_5_6")' in cross
          assert 'version_revalidated=revalidated' in cross

          forbidden_temp = (
              '.github/workflows/p18-m4-fix-concurrency-probe.yml',
              '.github/workflows/p18-m4-repair-concurrency-realprocess.yml',
              '.github/workflows/p18-m4-repair-dispatch-reconcile.yml',
              '.github/workflows/p18-m4-fix-windows-disconnect-probe.yml',
          )
          assert all(not Path(path).exists() for path in forbidden_temp)
          print('P18-M4.3-M4.6 FINAL architecture invariants: PASS')
          PY

