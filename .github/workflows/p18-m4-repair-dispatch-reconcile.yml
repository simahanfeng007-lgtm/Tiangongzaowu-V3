name: P18 M4 repair dispatch reconcile

on:
  push:
    branches:
      - agent/p18-m4-adversarial-certification
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PYTHONHASHSEED: '0'

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch production dispatch and reconciliation projections
        run: |
          python - <<'PY'
          from pathlib import Path

          provider = Path('src/total_gateway/regenerative_provider.py')
          text = provider.read_text(encoding='utf-8')
          old_start = '''        started = self._store.mark_effect_started(effect_id, started_at_ms=now_ms)\n        event, _ = self._store.append_execution_event(\n            event_key=f"step.dispatched:{step_id}:{attempt_id}",\n            request_id=identity.request_id,\n            run_id=identity.run_id,\n            generation=identity.generation,\n            epoch_index=_integer(payload.get("epoch_index", 0), label="epoch_index"),\n            event_type="step.dispatched",\n            created_at_ms=now_ms,\n            payload={"effect_state": started.state, "dispatch_boundary": "durably_started_before_handler"},\n            logical_effect_id=logical_effect_id,\n            attempt_id=attempt_id,\n            step_id=step_id,\n            effect_id=effect_id,\n        )\n        return {\n            "dispatch_permitted": True,\n            "disposition": "dispatched",\n            "effect_state": started.state,\n            "ledger_seq": event.ledger_seq,\n        }\n'''
          new_start = '''        fence = self._store.action_fence_status()\n        dispatch_nonce = canonical_sha256({\n            "domain": "tiangong.gateway.regenerative-dispatch-permit.v1",\n            "request_id": identity.request_id,\n            "run_id": identity.run_id,\n            "generation": identity.generation,\n            "effect_id": effect_id,\n            "attempt_id": attempt_id,\n            "step_id": step_id,\n        })\n        try:\n            permit = self._store.acquire_dispatch_permit(\n                effect_id=effect_id,\n                attempt=1,\n                expected_fence_epoch=int(fence["action_fence_epoch"]),\n                nonce_sha256=dispatch_nonce,\n                now_ms=now_ms,\n            )\n        except StoreConflictError:\n            current = self._store.get_effect(effect_id)\n            if current is None:\n                raise\n            if current.state in _TERMINAL_COMMITTED_EFFECT_STATES:\n                return {\n                    "dispatch_permitted": False,\n                    "disposition": "already_committed",\n                    "effect_state": current.state,\n                }\n            if current.state in _RECONCILE_REQUIRED_EFFECT_STATES:\n                disposition = (\n                    "in_flight" if current.state == "SIDE_EFFECT_STARTED" else "reconcile_required"\n                )\n                return {\n                    "dispatch_permitted": False,\n                    "disposition": disposition,\n                    "effect_state": current.state,\n                }\n            raise\n        started = self._store.get_effect(effect_id)\n        if started is None or started.state != "SIDE_EFFECT_STARTED":\n            raise StoreCorruptionError("dispatch permit did not advance canonical Effect head")\n        event, _ = self._store.append_execution_event(\n            event_key=f"step.dispatched:{step_id}:{attempt_id}",\n            request_id=identity.request_id,\n            run_id=identity.run_id,\n            generation=identity.generation,\n            epoch_index=_integer(payload.get("epoch_index", 0), label="epoch_index"),\n            event_type="step.dispatched",\n            created_at_ms=now_ms,\n            payload={\n                "effect_state": started.state,\n                "dispatch_boundary": "action_fence_permit_before_handler",\n                "fence_epoch": int(permit["fence_epoch"]),\n            },\n            logical_effect_id=logical_effect_id,\n            attempt_id=attempt_id,\n            step_id=step_id,\n            effect_id=effect_id,\n        )\n        return {\n            "dispatch_permitted": True,\n            "disposition": "dispatched",\n            "effect_state": started.state,\n            "ledger_seq": event.ledger_seq,\n        }\n'''
          if text.count(old_start) != 1:
              raise SystemExit(f'start-effect seam count: {text.count(old_start)}')
          text = text.replace(old_start, new_start)

          old_ambiguous = '''        actual_ambiguous = tuple(sorted(\n            record.claim.effect_id for record in effects if record.state == "AMBIGUOUS"\n        ))\n'''
          new_ambiguous = '''        actual_ambiguous = tuple(sorted(\n            record.claim.effect_id for record in effects\n            if record.state == "AMBIGUOUS"\n            and self._store.latest_effect_verdict(record.claim.effect_id, 1) != "APPLIED"\n        ))\n'''
          if text.count(old_ambiguous) != 2:
              raise SystemExit(f'provider ambiguous projection seam count: {text.count(old_ambiguous)}')
          text = text.replace(old_ambiguous, new_ambiguous)

          old_completion = '''        if any(record.state == "AMBIGUOUS" for record in effects):\n            reasons.append("effect_reconciliation_required")\n'''
          new_completion = '''        if any(\n            record.state == "AMBIGUOUS"\n            and self._store.latest_effect_verdict(record.claim.effect_id, 1) != "APPLIED"\n            for record in effects\n        ):\n            reasons.append("effect_reconciliation_required")\n'''
          if text.count(old_completion) != 1:
              raise SystemExit(f'completion ambiguity seam count: {text.count(old_completion)}')
          provider.write_text(text.replace(old_completion, new_completion), encoding='utf-8')

          store = Path('src/total_gateway/store.py')
          text = store.read_text(encoding='utf-8')
          old_recover = '''        ambiguous = tuple(sorted(\n            record.claim.effect_id for record in effects if record.state == "AMBIGUOUS"\n        ))\n'''
          new_recover = '''        ambiguous = tuple(sorted(\n            record.claim.effect_id for record in effects\n            if record.state == "AMBIGUOUS"\n            and self.latest_effect_verdict(record.claim.effect_id, 1) != "APPLIED"\n        ))\n'''
          if text.count(old_recover) != 1:
              raise SystemExit(f'recovery ambiguity seam count: {text.count(old_recover)}')
          store.write_text(text.replace(old_recover, new_recover), encoding='utf-8')
          PY
      - name: Sync generated mirrors and install dependencies
        run: |
          python scripts/sync-generated-sources.py --write
          python scripts/check-source-authority.py
          python scripts/sync-generated-sources.py --check-committed
          python -m pip install -r requirements-source.lock
      - name: Run targeted P0 regression suite
        run: >-
          python -m pytest -q
          tests/test_p18_m4_corruption_matrix.py::test_m4_corruption_10_two_agents_targeting_same_file_cannot_both_dispatch
          tests/test_p18_m4_corruption_matrix.py::test_m4_corruption_04_timeout_after_applied_effect_reconciles_applied_and_never_replays
          tests/test_p18_m4_authority_repairs.py
          tests/test_effect_fact_chain_v14.py
          tests/test_p18_m2_crash_matrix.py
          tests/test_p18_m4_provider_l4.py::test_m4_each_registered_provider_individually_passes_l4[deepseek_v4]
      - name: Remove applicator, commit, and push repair
        run: |
          rm .github/workflows/p18-m4-repair-dispatch-reconcile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src app tests .github/workflows/p18-m4-repair-dispatch-reconcile.yml
          git commit -m "P18-M4: fence concurrent dispatch and project reconciled effects"
          git push origin HEAD:agent/p18-m4-adversarial-certification
