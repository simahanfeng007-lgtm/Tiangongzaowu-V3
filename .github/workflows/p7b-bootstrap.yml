name: P7B deterministic bootstrap

on:
  push:
    branches:
      - agent/capability-composition-p7b-first-class-activation-v1
    paths:
      - scripts/p7b_apply.py
      - .github/workflows/p7b-bootstrap.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHONHASHSEED: "0"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/capability-composition-p7b-first-class-activation-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source dependencies
        run: python -m pip install -r requirements-source.lock
      - name: Normalize capability-contract import seam
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/contracts/capability_composition.py")
          text = path.read_text(encoding="utf-8")
          old = "from .models import ActionId, ContractModel, OpaqueId, RequestId, RunId, Sha256"
          new = """from .models import (
              ActionId,
              ContractModel,
              OpaqueId,
              RequestId,
              RunId,
              Sha256,
          )"""
          if text.count(old) != 1:
              raise RuntimeError(f"expected one capability contract import seam, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Apply deterministic P7B patch
        run: python scripts/p7b_apply.py
      - name: Synchronize generated-source mirrors
        run: python scripts/sync-generated-sources.py --write
      - name: Recertify P19 freeze manifest
        run: UPDATE_FREEZE=1 python -m pytest -q tests/golden/p19_r2/test_freeze_and_guards.py::VerificationPlaneFreezeGuardTests::test_freeze_manifest_unchanged
      - name: Recertify P19 drift fingerprint
        run: UPDATE_FINGERPRINT=1 python -m pytest -q tests/golden/p19_r2/test_calibration_and_stability.py::DriftFingerprintTests::test_fingerprint_matches_or_declared
      - name: Compile authoritative and generated Python
        run: python -m compileall -q src app/backend/tiangong-backend/v3 app/life-service/runtime314
      - name: Run focused P7B and P19 recertification tests
        run: >-
          python -m pytest -q
          tests/test_composition_activation_shadow_p7a.py
          tests/test_composition_activation_authority_p7b.py
          tests/golden/p19_r2/test_freeze_and_guards.py
          tests/golden/p19_r2/test_calibration_and_stability.py::DriftFingerprintTests::test_fingerprint_matches_or_declared
      - name: Validate patch whitespace
        run: git diff --check
      - name: Commit P7B implementation
        run: |
          git config user.name "simahanfeng007-lgtm"
          git config user.email "simahanfeng007@gmail.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat(p7b): persist first-class composition activation authority"
          git push origin HEAD:agent/capability-composition-p7b-first-class-activation-v1
