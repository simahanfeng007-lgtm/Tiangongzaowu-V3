name: P7B.2 apply Gateway Store patch

on:
  push:
    branches:
      - agent/capability-composition-p7b2-gateway-store-registration-v1
    paths:
      - scripts/p7b2_apply_gateway_store_patch.py
      - .github/workflows/p7b2-apply-gateway-store-patch.yml

permissions:
  contents: write

concurrency:
  group: p7b2-apply-gateway-store-patch
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P7B.2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/capability-composition-p7b2-gateway-store-registration-v1
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply deterministic source patch
        run: python scripts/p7b2_apply_gateway_store_patch.py

      - name: Synchronize generated source mirrors
        run: python scripts/sync-generated-sources.py --write

      - name: Install source-runtime dependencies
        run: python -m pip install -r requirements-source.lock

      - name: Compile authoritative and generated Python
        run: python -m compileall -q src app/backend/tiangong-backend/v3

      - name: Run focused P7B.1 P7B.2 and P19 freeze tests
        run: >-
          python -m pytest -q
          tests/test_composition_activation_registration_p7b.py
          tests/test_composition_activation_store_p7b2.py
          tests/golden/p19_r2/test_freeze_and_guards.py

      - name: Remove one-shot patch machinery
        run: |
          rm -f scripts/p7b2_apply_gateway_store_patch.py
          rm -f .github/workflows/p7b2-apply-gateway-store-patch.yml

      - name: Commit verified P7B.2 implementation
        run: |
          git config user.name "tiangong-p7b2-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(p7b2): persist limited activation in existing Gateway Store"
          git push origin HEAD:agent/capability-composition-p7b2-gateway-store-registration-v1
