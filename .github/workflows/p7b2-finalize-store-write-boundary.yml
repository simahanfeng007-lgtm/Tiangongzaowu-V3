name: P7B.2 finalize Store write boundary

on:
  push:
    branches:
      - agent/capability-composition-p7b2-gateway-store-registration-v1
    paths:
      - .github/workflows/p7b2-finalize-store-write-boundary.yml

permissions:
  contents: write

concurrency:
  group: p7b2-finalize-store-write-boundary
  cancel-in-progress: false

jobs:
  patch-test-clean-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P7B.2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/capability-composition-p7b2-gateway-store-registration-v1
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply and finalize direct-write boundary hardening
        run: python scripts/p7b2_finalize_store_boundary.py

      - name: Synchronize generated source mirrors
        run: python scripts/sync-generated-sources.py --write

      - name: Verify generated source mirrors are exact
        run: python scripts/sync-generated-sources.py --check

      - name: Install source-runtime dependencies
        run: python -m pip install -r requirements-source.lock

      - name: Compile changed authority and generated surfaces
        run: >-
          python -m compileall -q
          src/total_gateway
          app/runtime/python312/Lib/site-packages/total_gateway
          tests/test_composition_activation_store_p7b2.py

      - name: Run focused P7B.1 P7B.2 Store and P19 gates
        run: >-
          python -m pytest -q
          tests/test_composition_activation_registration_p7b.py
          tests/test_composition_activation_store_p7b2.py
          tests/test_p19_m1_store.py
          tests/test_p19_m3_write_evidence_v2.py
          tests/golden/p19_r2/test_calibration_and_stability.py
          tests/golden/p19_r2/test_freeze_and_guards.py

      - name: Remove all one-shot repair machinery
        run: |
          rm -f scripts/p7b2_harden_store_write_boundary.py
          rm -f scripts/p7b2_finalize_store_boundary.py
          rm -f .github/workflows/p7b2-harden-store-write-boundary.yml
          rm -f .github/workflows/p7b2-finalize-store-write-boundary.yml

      - name: Commit verified Store boundary closure
        run: |
          git config user.name "tiangong-p7b2-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(p7b2): close direct activation Store write bypass"
          git push origin HEAD:agent/capability-composition-p7b2-gateway-store-registration-v1
