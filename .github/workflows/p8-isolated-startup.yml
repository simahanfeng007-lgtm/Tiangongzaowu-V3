name: P8 isolated source startup

# Supplemental acceptance only: no publication, permissions change or merge.
# Existing required gates remain untouched. Do not mark unsupported isolation
# as a skip/PASS. Parent/build scripts are pinned to the reviewed R1 source.
on:
  push:
    branches:
      - codex/capability-composition-p8-source-evolution-v1
    paths:
      - .github/workflows/p8-isolated-startup.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-startup:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      TIANGONG_CI_ENV: '0'
      TIANGONG_SANDBOX_COMPAT: '0'
      P8_TRUSTED_PARENT: e99b4a2b1764b55dc74dbd04ce83c9473275d3dc
      P8_SOURCE_BASE: b37204ee4d94e4857aaf477b810a21f19345d584
      P8_SOURCE_CANDIDATE: e99b4a2b1764b55dc74dbd04ce83c9473275d3dc
    steps:
      - name: Checkout exact reviewed parent and native source objects
        uses: actions/checkout@v4
        with:
          ref: ${{ env.P8_TRUSTED_PARENT }}
          fetch-depth: 0
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare evidence identity
        shell: python
        run: |
          import hashlib, json, os, pathlib, platform, subprocess, sys
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'p8-native-evidence'
          evidence.mkdir(exist_ok=False)
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=root, text=True).strip()
          assert head == os.environ['P8_TRUSTED_PARENT']
          identity = {
              'workflow_sha': os.environ['GITHUB_SHA'], 'trusted_parent': head,
              'candidate': os.environ['P8_SOURCE_CANDIDATE'], 'base': os.environ['P8_SOURCE_BASE'],
              'candidate_tree': subprocess.check_output(['git', 'rev-parse', os.environ['P8_SOURCE_CANDIDATE'] + '^{tree}'], cwd=root, text=True).strip(),
              'python': sys.version, 'platform': platform.platform(),
              'dependency_lock_sha256': hashlib.sha256((root / 'requirements-source.lock').read_bytes()).hexdigest(),
              'may_publish': False, 'may_authorize': False, 'may_execute': False,
          }
          (evidence / 'identity.json').write_text(json.dumps(identity, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(identity))
      - name: Install pinned source dependencies
        run: python -m pip install -r requirements-source.lock
      - name: Windows startup fault-injection regression without CI skips
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'p8-native-evidence'
          command = [sys.executable, '-m', 'pytest', '-q', 'tests/test_source_startup_paths_p8.py', 'tests/test_life_store_path_injection_p8.py', '--junitxml=' + str(evidence / 'startup-regression.xml')]
          with (evidence / 'startup-regression.log').open('w', encoding='utf-8') as log:
              result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, timeout=240, check=False)
          print((evidence / 'startup-regression.log').read_text(encoding='utf-8'))
          raise SystemExit(result.returncode)
      - name: Real AppContainer source build and Gateway startup
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess, sys, traceback
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'p8-native-evidence'
          evidence.mkdir(exist_ok=True)
          outcome = {'status': 'ACCEPTANCE_FAILED', 'may_publish': False, 'may_authorize': False, 'may_execute': False}
          def run_script(script, arguments, log_name):
              with (evidence / log_name).open('w', encoding='utf-8') as log:
                  result = subprocess.run([sys.executable, '-I', '-B', '-X', 'utf8', script, *arguments], stdout=log, stderr=subprocess.STDOUT, timeout=600, check=False)
              print((evidence / log_name).read_text(encoding='utf-8'))
              return result.returncode
          try:
              bundle = evidence / 'source-revision.zip'
              build_path = evidence / 'build.json'
              outcome['build_exit_code'] = run_script('scripts/build-tool-source.py', ['--repository', os.environ['GITHUB_WORKSPACE'], '--base', os.environ['P8_SOURCE_BASE'], '--candidate', os.environ['P8_SOURCE_CANDIDATE'], '--action', 'file.read', '--report', str(build_path), '--bundle', str(bundle)], 'build.log')
              build = json.loads(build_path.read_text(encoding='utf-8'))
              outcome['build_status'] = build.get('status')
              if outcome['build_exit_code'] != 0 or build.get('status') != 'ISOLATED_BUILD_OBSERVED':
                  print(json.dumps(build, ensure_ascii=True))
                  raise RuntimeError('native source build did not pass; no startup fallback')
              outcome['bundle_sha256'] = hashlib.sha256(bundle.read_bytes()).hexdigest()
              startup_path = evidence / 'startup.json'
              outcome['startup_exit_code'] = run_script('scripts/probe-tool-source-launch.py', ['--bundle', str(bundle), '--sha256', outcome['bundle_sha256'], '--report', str(startup_path)], 'startup.log')
              startup = json.loads(startup_path.read_text(encoding='utf-8'))
              outcome['startup_status'] = startup.get('status')
              for document, key in ((build, 'build_process'), (startup, 'probe_process')):
                  process = document.get(key, {})
                  if process.get('ok') is not True or process.get('containment') != 'windows-appcontainer' or process.get('network') != 'denied':
                      raise RuntimeError('missing native containment evidence')
                  if any(document.get(flag) is not False for flag in ('may_publish', 'may_authorize', 'may_execute')):
                      raise RuntimeError('unexpected authority/publication claim')
              if outcome['startup_exit_code'] != 0 or startup.get('status') != 'ISOLATED_STARTUP_OBSERVED':
                  print(json.dumps(startup, ensure_ascii=True))
                  raise RuntimeError('actual isolated Gateway READY/shutdown/source lock not verified')
              outcome['status'] = 'ISOLATED_BUILD_AND_STARTUP_OBSERVED'
          except Exception as exc:
              outcome.update(error_type=type(exc).__name__, error=str(exc), traceback=traceback.format_exc())
          finally:
              (evidence / 'acceptance.json').write_text(json.dumps(outcome, indent=2, ensure_ascii=True) + '\n', encoding='utf-8')
              checksums = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in evidence.iterdir() if p.is_file()}
              (evidence / 'SHA256.json').write_text(json.dumps(checksums, indent=2) + '\n', encoding='utf-8')
              print(json.dumps(outcome, ensure_ascii=True))
          raise SystemExit(0 if outcome['status'] == 'ISOLATED_BUILD_AND_STARTUP_OBSERVED' else 1)
      - name: Preserve original evidence including failed observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p8-native-startup-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p8-native-evidence/
          if-no-files-found: error
          retention-days: 14
