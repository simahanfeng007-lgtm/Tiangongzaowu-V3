name: P8 key environment diagnosis

# Disposable diagnosis only. No product ACL changes, publication or host keys.
on:
  push:
    branches: [codex/capability-composition-p8-source-evolution-v1]
    paths: [.github/workflows/p8-key-environment.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      TIANGONG_CI_ENV: '0'
      TIANGONG_SANDBOX_COMPAT: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 85558aaae5fa5add11f21d42df64607b3c7bbc06
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-source.lock
      - name: Host and AppContainer lifecycle observations
        shell: python
        run: |
          import hashlib, json, os, pathlib, shutil, subprocess, sys, tempfile
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'p8-key-environment'
          evidence.mkdir()
          (evidence/'started.json').write_text(json.dumps({'source':'85558aa','workflow':os.environ['GITHUB_SHA']}))
          sys.path[:0] = [str(root / 'src'), str(root / 'app/backend/tiangong-backend')]
          from omni_body_skill.tools.sandbox_runtime import SandboxRunner, SandboxLimits
          worker = r'''
          import ctypes as C, json, os, pathlib, re, sys, traceback
          from ctypes import wintypes as W
          home=pathlib.Path(__file__).absolute().parent
          sys.path[:0]=[str(home/'src'),str(home/'backend')]
          from total_gateway.release_manifest import _windows_appcontainer_sddl
          from total_gateway.tickets import _current_user_sid, _restrict_file_to_sid
          from runtime_security import WindowsDpapiProtector
          K=C.WinDLL('kernel32',use_last_error=True); A=C.WinDLL('advapi32',use_last_error=True)
          K.LocalFree.argtypes=[W.LPVOID];K.LocalFree.restype=W.LPVOID
          K.CreateFileW.argtypes=[W.LPCWSTR,W.DWORD,W.DWORD,W.LPVOID,W.DWORD,W.DWORD,W.HANDLE];K.CreateFileW.restype=W.HANDLE
          K.CloseHandle.argtypes=[W.HANDLE];K.CloseHandle.restype=W.BOOL
          A.ConvertStringSecurityDescriptorToSecurityDescriptorW.argtypes=[W.LPCWSTR,W.DWORD,C.POINTER(W.LPVOID),W.LPVOID];A.ConvertStringSecurityDescriptorToSecurityDescriptorW.restype=W.BOOL
          A.GetNamedSecurityInfoW.argtypes=[W.LPWSTR,W.DWORD,W.DWORD,W.LPVOID,W.LPVOID,W.LPVOID,W.LPVOID,C.POINTER(W.LPVOID)];A.GetNamedSecurityInfoW.restype=W.DWORD
          A.ConvertSecurityDescriptorToStringSecurityDescriptorW.argtypes=[W.LPVOID,W.DWORD,W.DWORD,C.POINTER(W.LPWSTR),W.LPVOID];A.ConvertSecurityDescriptorToStringSecurityDescriptorW.restype=W.BOOL
          class SA(C.Structure):
              _fields_=[('length',W.DWORD),('descriptor',W.LPVOID),('inherit',W.BOOL)]
          def describe(path):
              sd=W.LPVOID();text=W.LPWSTR()
              error=A.GetNamedSecurityInfoW(str(path),1,4,None,None,None,None,C.byref(sd))
              if error:return {'winerror':error}
              try:
                  if not A.ConvertSecurityDescriptorToStringSecurityDescriptorW(sd,1,4,C.byref(text),None):return {'winerror':C.get_last_error()}
                  return text.value
              finally:
                  if text:K.LocalFree(text)
                  if sd:K.LocalFree(sd)
          def create(path,descriptor,data):
              import msvcrt
              sd=W.LPVOID()
              if not A.ConvertStringSecurityDescriptorToSecurityDescriptorW(descriptor,1,C.byref(sd),None):raise C.WinError(C.get_last_error())
              handle=None
              try:
                  attrs=SA(C.sizeof(SA),sd,False)
                  handle=K.CreateFileW(str(path),0x40000000,0,C.byref(attrs),1,0x00200080,None)
                  if handle==W.HANDLE(-1).value:handle=None;raise C.WinError(C.get_last_error())
                  fd=msvcrt.open_osfhandle(handle,os.O_WRONLY|os.O_BINARY);handle=None
                  with os.fdopen(fd,'wb') as stream:stream.write(data);stream.flush();os.fsync(stream.fileno())
              finally:
                  if handle:K.CloseHandle(handle)
                  K.LocalFree(sd)
          report={'schema':'tiangong.p8-key-environment.v1','may_publish':False,'may_authorize':False}
          try:
              owner=_current_user_sid();stage=_windows_appcontainer_sddl()
              package=None if stage is None else re.findall(r'S-1-15-2-(?:[0-9]+-){6}[0-9]+',stage)[0]
              report.update(owner=owner,appcontainer_sid=package)
              protector=WindowsDpapiProtector();entropy=b'p8-disposable-diagnostic-only';plain=os.urandom(32)
              encrypted=protector.protect(plain,entropy)
              report['dpapi_roundtrip']=bytes(protector.unprotect(encrypted,entropy))==plain
              work=home/'diagnostic-files';work.mkdir()
              old=work/'old-encrypted.bin';old.write_bytes(encrypted)
              report['old_before']=describe(old)
              try:_restrict_file_to_sid(old,owner);report['old_restrict']='PASS'
              except Exception as exc:report['old_restrict']={'type':type(exc).__name__,'error':str(exc)}
              report['old_after']=describe(old)
              for label,op in [('old_read',lambda:old.read_bytes()),('old_rename',lambda:os.replace(old,work/'old-renamed.bin'))]:
                  try:op();report[label]='PASS'
                  except Exception as exc:report[label]={'type':type(exc).__name__,'error':str(exc)}
              exact='D:P(A;;FA;;;'+owner+')'+('' if package is None else '(A;;FA;;;'+package+')')
              target=work/'new-encrypted.bin';create(target,exact,encrypted)
              report['new_dacl']=describe(target)
              os.chmod(target,0o600);report['new_chmod']='PASS'
              assert bytes(protector.unprotect(target.read_bytes(),entropy))==plain
              report['new_readback']='PASS'
              replacement=work/'rotation.bin';create(replacement,exact,encrypted)
              os.replace(replacement,target);report['new_replace']='PASS'
              assert bytes(protector.unprotect(target.read_bytes(),entropy))==plain
              target.unlink();report['new_cleanup']='PASS'
              if package is not None:
                  other=package.rsplit('-',1)[0]+'-'+str(int(package.rsplit('-',1)[1])+1)
                  foreign=work/'different-package.bin'
                  try:
                      create(foreign,'D:P(A;;FA;;;'+owner+')(A;;FA;;;'+other+')',encrypted)
                      foreign.read_bytes()
                  except PermissionError:report['wrong_package_access']='DENIED'
                  else:raise RuntimeError('wrong package access was accepted')
              report['status']='KEY_ENVIRONMENT_OBSERVED'
          except Exception as exc:
              report.update(status='DIAGNOSIS_FAILED',error_type=type(exc).__name__,error=str(exc),traceback=traceback.format_exc())
          (home/'key-observation.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print(json.dumps(report))
          raise SystemExit(0 if report['status']=='KEY_ENVIRONMENT_OBSERVED' else 1)
          '''
          compile(worker, 'diagnostic-worker.py', 'exec')
          with tempfile.TemporaryDirectory(prefix='p8-key-design-') as tmp:
              base=pathlib.Path(tmp).resolve(strict=True)
              for label in ('host','contained'):
                  work=base/label;work.mkdir()
                  ignore=shutil.ignore_patterns('__pycache__','*.pyc')
                  shutil.copytree(root/'src',work/'src',ignore=ignore)
                  shutil.copytree(root/'app/backend/tiangong-backend',work/'backend',ignore=ignore)
                  (work/'worker.py').write_text(worker,encoding='utf-8')
                  if label=='host':
                      cp=subprocess.run([sys.executable,'-I','-B',str(work/'worker.py')],capture_output=True,text=True,timeout=120,check=False)
                      result={'ok':cp.returncode==0,'returncode':cp.returncode,'stdout':cp.stdout,'stderr':cp.stderr}
                  else:
                      result=SandboxRunner(work,base/'sandbox',base/'trash',SandboxLimits(timeout_seconds=120,max_changed_bytes=67108864)).run([sys.executable,'-I','-B',str(work/'worker.py')],require_os_containment=True)
                  (evidence/(label+'-process.json')).write_text(json.dumps(result,indent=2),encoding='utf-8')
                  if (work/'key-observation.json').exists():(evidence/(label+'.json')).write_bytes((work/'key-observation.json').read_bytes())
                  print(label.upper()+'='+json.dumps(result))
              identity={'product':'85558aaae5fa5add11f21d42df64607b3c7bbc06','workflow':os.environ['GITHUB_SHA'],'worker_sha256':hashlib.sha256(worker.encode()).hexdigest()}
              (evidence/'identity.json').write_text(json.dumps(identity),encoding='utf-8')
              for label in ('host','contained'):
                  process=json.loads((evidence/(label+'-process.json')).read_text())
                  assert process['ok'] is True, label+' lifecycle failed; inspect original report'
              assert process['containment']=='windows-appcontainer' and process['network']=='denied'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p8-key-environment-${{ github.sha }}
          path: ${{ runner.temp }}/p8-key-environment/
          if-no-files-found: error
          retention-days: 14
