name: P9 exact-source transfer

# Developer transport only. This is NOT a test, release or acceptance gate.
# No product code, hooks or candidate scripts are executed by this job.
on:
  push:
    branches:
      - codex/capability-composition-p9-method-source-evolution-v1
    paths:
      - .github/workflows/p9-source-transfer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-git-objects:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Export and verify committed Git objects only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          out="$RUNNER_TEMP/p9-source-transfer"
          mkdir "$out"
          git bundle create "$out/repository.bundle" HEAD
          git bundle verify "$out/repository.bundle"
          git rev-parse HEAD > "$out/HEAD.txt"
          git rev-parse 'HEAD^{tree}' > "$out/TREE.txt"
          cd "$out"
          sha256sum repository.bundle > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p9-source-${{ github.sha }}
          path: ${{ runner.temp }}/p9-source-transfer/
          if-no-files-found: error
          retention-days: 7
