name: Repair proactive freeze regression

on:
  push:
    branches:
      - agent/freeze-legacy-proactive-v0.1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout freeze branch
        uses: actions/checkout@v4
        with:
          ref: agent/freeze-legacy-proactive-v0.1
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore non-proactive upgrade constants
        run: python scripts/repair-proactive-freeze.py

      - name: Sync generated mirrors
        run: python scripts/sync-generated-sources.py --write

      - name: Install source-runtime dependencies
        run: python -m pip install -r requirements-source.lock

      - name: Compile repaired surface
        run: >-
          python -m compileall -q
          src/life_service/embedded_runtime.py
          app/life-service/runtime314/life_service/embedded_runtime.py
          tests/test_life_greeting_schedule.py
          tests/test_life_proactive_learning_share.py
          tests/test_legacy_proactive_freeze.py
          tests/test_life_self_iteration.py

      - name: Run proactive freeze and self-iteration regression
        run: >-
          python -m pytest -q
          tests/test_life_greeting_schedule.py
          tests/test_life_proactive_learning_share.py
          tests/test_legacy_proactive_freeze.py
          tests/test_life_self_iteration.py
          tests/test_p15_cutover_phases.py
          tests/test_p15_acceptance_gate.py

      - name: Verify generated mirrors
        run: python scripts/sync-generated-sources.py --check-committed

      - name: Commit repaired freeze and mirrors
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No repair diff to commit."
            exit 0
          fi
          git config user.name "tiangong-proactive-freeze-repair"
          git config user.email "tiangong-proactive-freeze-repair@users.noreply.github.com"
          git add -A
          git commit -m "fix proactive freeze regression"
          git push origin HEAD:agent/freeze-legacy-proactive-v0.1
