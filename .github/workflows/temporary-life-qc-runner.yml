name: Temporary isolated Life QC runner

on:
  pull_request:
    branches:
      - automation/life-qc-runner-20260821

permissions:
  contents: write

concurrency:
  group: temporary-life-qc-runner-20260821
  cancel-in-progress: false

jobs:
  repair-head-branch:
    if: github.head_ref == 'fix/life-reflection-budget-qc-20260821'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/life-reflection-budget-qc-20260821
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute audited repair launcher from head branch
        shell: bash
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          launcher = Path('.github/workflows/one-shot-life-qc-repair-pr.yml')
          data = yaml.safe_load(launcher.read_text(encoding='utf-8'))
          steps = data['jobs']['repair']['steps']
          allowed = {
              'Execute audited one-shot Life QC repair recipe',
              'Repair P18.1 provider-identity credential contract',
              'Remove launcher and trigger marker',
          }
          for step in steps:
              name = str(step.get('name') or '')
              script = step.get('run')
              if name not in allowed or not isinstance(script, str):
                  continue
              print(f'::group::{name}', flush=True)
              subprocess.run(
                  script,
                  cwd='.',
                  shell=True,
                  executable='/bin/bash',
                  check=True,
              )
              print('::endgroup::', flush=True)
          PY
