name: Temporary isolated Life QC runner

on:
  pull_request:
    branches:
      - automation/life-qc-runner-20260821

permissions:
  contents: write

jobs:
  repair-head-branch:
    if: github.head_ref == 'fix/life-qc-credential-contract-clean-20260821'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/life-qc-credential-contract-clean-20260821
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install focused test dependencies
        run: python -m pip install --quiet pytest pydantic cryptography
      - name: Apply review-found correction
        shell: bash
        run: |
          python scripts/temporary_reflection_recovery_metric_fix.py
          python scripts/sync-generated-sources.py --write
      - name: Run focused and architecture regressions
        shell: bash
        run: |
          python -m pytest -q \
            tests/test_life_qc_regressions_20260821.py \
            tests/test_life_scheduler_budgets.py \
            tests/test_life_reflection_chain_wiring.py \
            tests/test_model_credential_identity_contract.py \
            tests/test_model_credential_contract.py \
            tests/test_p17_m4_architecture_guards.py \
            tests/test_p17_1_runtime_integrity.py
      - name: Commit correction and remove temporary driver
        shell: bash
        run: |
          rm -f scripts/temporary_reflection_recovery_metric_fix.py
          git config user.name "tiangong-qc-repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: make reflection recovery accounting authoritative"
          git push origin HEAD:fix/life-qc-credential-contract-clean-20260821
