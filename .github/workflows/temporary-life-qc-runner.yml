name: Temporary isolated Life QC runner

on:
  pull_request:
    branches:
      - automation/life-qc-runner-20260821

permissions:
  contents: write

concurrency:
  group: temporary-life-qc-runner-20260821
  cancel-in-progress: false

jobs:
  repair-head-branch:
    if: github.head_ref == 'fix/life-reflection-budget-qc-20260821'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/life-reflection-budget-qc-20260821
          fetch-depth: 0

      - name: Guard one-shot execution
        id: guard
        shell: bash
        run: |
          if [ -f scripts/temporary_credential_contract_repair.py ] && [ -f .github/workflows/one-shot-life-qc-repair.yml ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: '3.11'

      - name: Execute audited Life QC repair recipe
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          workflow = Path('.github/workflows/one-shot-life-qc-repair.yml')
          data = yaml.safe_load(workflow.read_text(encoding='utf-8'))
          steps = data['jobs']['repair-and-test']['steps']
          allowed = {
              'Apply in-place authoritative-source repair',
              'Install test dependencies',
              'Run focused Life QC regressions',
              'Run architecture-sensitive regressions',
          }
          for step in steps:
              name = str(step.get('name') or '')
              script = step.get('run')
              if name not in allowed or not isinstance(script, str):
                  continue
              print(f'::group::{name}', flush=True)
              subprocess.run(
                  script,
                  cwd='.',
                  shell=True,
                  executable='/bin/bash',
                  check=True,
              )
              print('::endgroup::', flush=True)
          PY

      - name: Repair and verify provider credential identity contract
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          python scripts/temporary_credential_contract_repair.py
          python -m pytest -q \
            tests/test_model_credential_identity_contract.py \
            tests/test_model_credential_contract.py

      - name: Commit verified repair to isolated fix branch
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          rm -f .github/one-shot-life-qc-repair.trigger
          rm -f .github/workflows/one-shot-life-qc-repair.yml
          rm -f .github/workflows/one-shot-life-qc-repair-pr.yml
          rm -f scripts/temporary_credential_contract_repair.py
          git config user.name "tiangong-qc-repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No repair changes produced" >&2
            exit 1
          fi
          git commit -m "fix: close Life QC and provider credential contract gaps"
          git push origin HEAD:fix/life-reflection-budget-qc-20260821
