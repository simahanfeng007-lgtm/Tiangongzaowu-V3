name: Temporary isolated Life QC runner

on:
  pull_request:
    branches:
      - automation/life-qc-runner-20260821

permissions:
  contents: write

concurrency:
  group: temporary-life-qc-runner-20260821
  cancel-in-progress: false

jobs:
  repair-head-branch:
    if: github.head_ref == 'fix/life-reflection-budget-qc-20260821'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/life-reflection-budget-qc-20260821
          fetch-depth: 0

      - name: Guard one-shot execution
        id: guard
        shell: bash
        run: |
          if [ -f scripts/temporary_life_qc_repair.py ] && [ -f scripts/temporary_credential_contract_repair.py ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: '3.14'

      - name: Install focused test dependencies
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          python -m pip install --quiet pytest pydantic cryptography

      - name: Apply direct authoritative-source repairs
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          python scripts/temporary_life_qc_repair.py
          python scripts/temporary_credential_contract_repair.py
          python scripts/sync-generated-sources.py --write

      - name: Run focused regressions
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          python -m pytest -q \
            tests/test_life_qc_regressions_20260821.py \
            tests/test_life_scheduler_budgets.py \
            tests/test_life_reflection_chain_wiring.py \
            tests/test_model_credential_identity_contract.py \
            tests/test_model_credential_contract.py

      - name: Run architecture-sensitive regressions
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          python -m pytest -q \
            tests/test_p17_m4_architecture_guards.py \
            tests/test_p17_1_runtime_integrity.py

      - name: Commit verified repair to isolated fix branch
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          rm -f .github/one-shot-life-qc-repair.trigger
          rm -f .github/workflows/one-shot-life-qc-repair.yml
          rm -f .github/workflows/one-shot-life-qc-repair-pr.yml
          rm -f scripts/temporary_life_qc_repair.py
          rm -f scripts/temporary_credential_contract_repair.py
          git config user.name "tiangong-qc-repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No repair changes produced" >&2
            exit 1
          fi
          git commit -m "fix: close Life QC and provider credential contract gaps"
          git push origin HEAD:fix/life-reflection-budget-qc-20260821
