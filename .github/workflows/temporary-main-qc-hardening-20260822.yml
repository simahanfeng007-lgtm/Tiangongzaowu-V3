name: temporary-main-qc-hardening-20260822

on:
  push:
    branches:
      - fix/main-qc-hardening-20260822
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/main-qc-hardening-20260822
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest httpx cryptography pydantic
      - name: Normalize one-shot patcher signature parser
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_main_qc_hardening_20260822.py')
          text = path.read_text(encoding='utf-8')
          old = "header_match = re.match(r'(    def find_action_impact_for_source_event\\(.*?\\):\\n)', match.group(0), flags=re.S)"
          new = "header_match = re.match(r'(    def find_action_impact_for_source_event\\(.*?\\) -> ActionImpact \\| None:\\n)', match.group(0), flags=re.S)"
          if old not in text:
              raise SystemExit('action-impact signature parser anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
      - name: Apply hardening patch
        run: python .github/scripts/apply_main_qc_hardening_20260822.py
      - name: Close v18 health ledger and pinned transport test contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          store = Path('src/life_service/store.py')
          text = store.read_text(encoding='utf-8')
          old = '''            (16, _P16_TEMPERAMENT_RECEIPT_MIGRATION_ID, _P16_TEMPERAMENT_RECEIPT_SHA256),
                      (17, _P17_MEMORY_WORLD_CANDIDATE_MIGRATION_ID, _P17_MEMORY_WORLD_CANDIDATE_SHA256),
                  )
                  if len(migration) != len(expected_migrations)'''
          if old not in text:
              old = '''            (16, _P16_TEMPERAMENT_RECEIPT_MIGRATION_ID, _P16_TEMPERAMENT_RECEIPT_SHA256),
                      (17, _P17_MEMORY_WORLD_CANDIDATE_MIGRATION_ID, _P17_MEMORY_WORLD_CANDIDATE_SHA256),
                  )
                  if len(migration) != len(expected_migrations)'''.replace('                      ', '            ').replace('                  ', '        ')
          new = '''            (16, _P16_TEMPERAMENT_RECEIPT_MIGRATION_ID, _P16_TEMPERAMENT_RECEIPT_SHA256),
            (17, _P17_MEMORY_WORLD_CANDIDATE_MIGRATION_ID, _P17_MEMORY_WORLD_CANDIDATE_SHA256),
            (18, _P18_ACTION_IMPACT_SOURCE_INDEX_MIGRATION_ID, _P18_ACTION_IMPACT_SOURCE_INDEX_SHA256),
        )
        if len(migration) != len(expected_migrations)'''
          if old not in text:
              raise SystemExit('LifeShadowStore.health v18 ledger anchor missing')
          text = text.replace(old, new, 1)
          store.write_text(text, encoding='utf-8', newline='\n')
          shutil.copyfile(store, Path('app/life-service/runtime314/life_service/store.py'))

          test = Path('tests/test_simple_chain_loop_budget.py')
          source = test.read_text(encoding='utf-8')
          old_test = '''            mock.patch(
                "v3.jineng.model_transport_executor.validate_model_endpoint"
            ),
            mock.patch(
                "v3.jineng.model_transport_executor.time.perf_counter",
'''
          new_test = '''            mock.patch(
                "v3.jineng.model_transport_executor.validate_model_endpoint"
            ),
            mock.patch(
                "v3.jineng.model_transport_executor.pin_model_request",
                return_value=mock.Mock(
                    url="https://93.184.216.34/v1/chat/completions",
                    host_header="api.deepseek.com",
                    sni_hostname="api.deepseek.com",
                    resolved_ip="93.184.216.34",
                ),
            ),
            mock.patch(
                "v3.jineng.model_transport_executor.time.perf_counter",
'''
          if old_test not in source:
              raise SystemExit('deadline transport mock anchor missing')
          test.write_text(source.replace(old_test, new_test, 1), encoding='utf-8', newline='\n')
          PY
      - name: Compile changed Python
        run: |
          python -m py_compile \
            src/runtime_security/model_endpoint.py \
            src/life_service/embedded_runtime.py \
            src/life_service/store.py \
            src/life_service/store_schema.py \
            app/backend/tiangong-backend/v3/jineng/model_transport_executor.py \
            app/backend/tiangong-backend/v3/jineng/http_kehuduan.py
      - name: Focused regression
        run: |
          python -m pytest -q \
            tests/test_main_qc_hardening_20260822.py \
            tests/test_model_credential_contract.py \
            tests/test_model_credential_identity_contract.py \
            tests/test_simple_chain_loop_budget.py \
            tests/test_life_qc_regressions_20260821.py \
            tests/test_life_capability_health_flow.py \
            tests/test_life_shadow_store.py \
            tests/test_reflection_capability_p8.py
      - name: Remove one-shot machinery
        run: |
          rm -f .github/scripts/apply_main_qc_hardening_20260822.py
          rm -f .github/workflows/temporary-main-qc-hardening-20260822.yml
      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/runtime_security/model_endpoint.py \
            app/backend/tiangong-backend/v3/endpoint_security.py \
            app/backend/tiangong-backend/v3/jineng/model_transport_executor.py \
            app/backend/tiangong-backend/v3/jineng/http_kehuduan.py \
            app/main.js \
            src/life_service/embedded_runtime.py \
            app/life-service/runtime314/life_service/embedded_runtime.py \
            src/life_service/store.py \
            app/life-service/runtime314/life_service/store.py \
            src/life_service/store_schema.py \
            app/life-service/runtime314/life_service/store_schema.py \
            tests/test_main_qc_hardening_20260822.py \
            tests/test_simple_chain_loop_budget.py \
            .github/scripts/apply_main_qc_hardening_20260822.py \
            .github/workflows/temporary-main-qc-hardening-20260822.yml
          git commit -m "fix: harden endpoint, deadline, Life recovery and indexes"
          git push origin HEAD:fix/main-qc-hardening-20260822
