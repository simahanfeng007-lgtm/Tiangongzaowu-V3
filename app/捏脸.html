<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>捏脸 · 起源</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070b14;color:#9ab0d0;font-family:'Microsoft YaHei','PingFang SC',sans-serif;display:flex;height:100vh;overflow:hidden}
#c{flex:1}
#p{width:300px;background:rgba(5,8,15,0.95);border-left:1px solid #1a2a3a;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
#p h2{color:#4a8aba;font-size:1.1em;margin-bottom:2px;letter-spacing:2px}
.k{display:flex;flex-direction:column;gap:3px}
.k label{font-size:0.78em;color:#6a8a9a}
.k input[type=range]{width:100%;accent-color:#4a8aba}
.cv{display:flex;align-items:center;gap:8px}
.cv input[type=color]{width:36px;height:26px;border:1px solid #2a4a6a;background:transparent;cursor:pointer}
.cv span{font-size:0.72em;color:#5a7a8a;min-width:34px}
#msg{font-size:0.7em;color:#5a7a5a;text-align:center;margin-top:auto;padding:6px}
.btn{padding:10px;font-size:0.9em;background:#1a2a3a;color:#7ab0d0;border:1px solid #2a4a6a;border-radius:6px;cursor:pointer;text-align:center}
.btn:hover{background:#2a4a6a}
.btn.a{background:#1a3a5a;border-color:#3a6a9a}
</style>
</head>
<body>
<div id="c"></div>
<div id="p">
  <h2>捏脸</h2>
  <div class="k"><label>肤色</label><div class="cv"><input type="color" id="sc" value="#f5d0b8"><span id="scv"></span></div></div>
  <div class="k"><label>发色</label><div class="cv"><input type="color" id="hc" value="#2a1a0a"><span id="hcv"></span></div></div>
  <div class="k"><label>衣服色</label><div class="cv"><input type="color" id="oc" value="#1a2a3a"><span id="ocv"></span></div></div>
  <div class="k"><label>眼睛大小 <span id="esv">1</span></label><input type="range" id="es" min="0.3" max="2" value="1" step="0.05"></div>
  <div class="k"><label>脸型 <span id="fsv">1</span></label><input type="range" id="fs" min="0.6" max="1.4" value="1" step="0.02"></div>
  <div class="k"><label>体型 <span id="bsv">1</span></label><input type="range" id="bs" min="0.5" max="1.5" value="1" step="0.02"></div>
  <div class="k"><label>发型 <span id="hsv">短发</span></label><input type="range" id="hs" min="0" max="3" value="0" step="1"></div>
  <div class="btn a" onclick="baocun()">保存造型</div>
  <div class="btn" onclick="fuyuan()">恢复默认</div>
  <div id="msg">加载完成 — 拖动滑块捏脸</div>
</div>
<script type="importmap">
{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const c=document.getElementById('c'),msg=document.getElementById('msg');

const ren=new THREE.WebGLRenderer({antialias:true,alpha:true});
ren.setPixelRatio(Math.min(window.devicePixelRatio,2));
ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFSoftShadowMap;
ren.toneMapping=THREE.ACESFilmicToneMapping;ren.toneMappingExposure=1.3;
c.appendChild(ren.domElement);

const scn=new THREE.Scene();
scn.background=new THREE.Color('#070b14');
scn.fog=new THREE.Fog('#070b14',5,15);

// 光照
scn.add(new THREE.AmbientLight('#3a5a8a',0.5));
const kl=new THREE.DirectionalLight('#ffe8d0',5);kl.position.set(4,6,4);
kl.castShadow=true;kl.shadow.mapSize.set(2048,2048);
kl.shadow.camera.near=0.5;kl.shadow.camera.far=20;kl.shadow.camera.left=-5;
kl.shadow.camera.right=5;kl.shadow.camera.top=5;kl.shadow.camera.bottom=-5;
scn.add(kl);
scn.add(new THREE.DirectionalLight('#8899cc',1).position.set(-2,2,-1));
scn.add(new THREE.DirectionalLight('#aabbdd',1).position.set(0,1,-3));
scn.add(new THREE.HemisphereLight('#8899cc','#1a1a2a',0.4));

// 地面
const dm=new THREE.Mesh(new THREE.PlaneGeometry(12,12),new THREE.MeshStandardMaterial({color:'#101520',roughness:0.85,metalness:0.1}));
dm.rotation.x=-Math.PI/2;dm.position.y=-2;dm.receiveShadow=true;scn.add(dm);
const gd=new THREE.GridHelper(8,24,'#1a2a3a','#080810');gd.position.y=-1.99;scn.add(gd);

// 粒子
const pg=new THREE.BufferGeometry();const pp=new Float32Array(300*3);
for(let i=0;i<300;i++){pp[i*3]=(Math.random()-0.5)*8;pp[i*3+1]=Math.random()*4;pp[i*3+2]=(Math.random()-0.5)*8}
pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
const pt=new THREE.Points(pg,new THREE.PointsMaterial({color:'#3a6a9a',size:0.015,transparent:true,opacity:0.5}));
scn.add(pt);

// 相机
const cam=new THREE.PerspectiveCamera(40,2,0.1,30);cam.position.set(1.8,2.2,4);
const ctrl=new OrbitControls(cam,ren.domElement);ctrl.target.set(0,1.3,0);
ctrl.enableDamping=true;ctrl.dampingFactor=0.08;ctrl.minDistance=1.5;ctrl.maxDistance=8;ctrl.maxPolarAngle=Math.PI*0.7;

// === 程序化角色 ===
const jiaose=new THREE.Group();scn.add(jiaose);

// 材质
const mat_skin=new THREE.MeshStandardMaterial({color:'#f5d0b8',roughness:0.6,metalness:0.02});
const mat_hair=new THREE.MeshStandardMaterial({color:'#2a1a0a',roughness:0.7,metalness:0.05});
const mat_cloth=new THREE.MeshStandardMaterial({color:'#1a2a3a',roughness:0.5,metalness:0.1});
const mat_eye=new THREE.MeshStandardMaterial({color:'#1a1a2a',roughness:0.2,metalness:0.3});
const mat_eyew=new THREE.MeshStandardMaterial({color:'#ffffff',roughness:0.1,metalness:0});
const mat_mouth=new THREE.MeshStandardMaterial({color:'#d08080',roughness:0.3,metalness:0});

// 身体组
const body=new THREE.Group();jiaose.add(body);
const torso=new THREE.Mesh(new THREE.CapsuleGeometry(0.35,0.6,4,8),mat_cloth);
torso.position.y=1.05;torso.castShadow=true;body.add(torso);

// 头部
const head=new THREE.Group();body.add(head);head.position.y=1.6;
const skull=new THREE.Mesh(new THREE.SphereGeometry(0.32,32,24),mat_skin);
skull.scale.set(1,1.05,0.95);skull.castShadow=true;head.add(skull);

// 眼睛
const leye=new THREE.Group();head.add(leye);leye.position.set(-0.1,0.04,-0.28);
leye.add(new THREE.Mesh(new THREE.SphereGeometry(0.07,16,16),mat_eyew));
const lp=new THREE.Mesh(new THREE.SphereGeometry(0.04,8,8),mat_eye);lp.position.z=-0.03;leye.add(lp);

const reye=new THREE.Group();head.add(reye);reye.position.set(0.1,0.04,-0.28);
reye.add(new THREE.Mesh(new THREE.SphereGeometry(0.07,16,16),mat_eyew));
const rp=new THREE.Mesh(new THREE.SphereGeometry(0.04,8,8),mat_eye);rp.position.z=-0.03;reye.add(rp);

// 嘴巴
const mouth=new THREE.Mesh(new THREE.TorusGeometry(0.04,0.012,8,8,Math.PI),mat_mouth);
mouth.position.set(0,-0.05,-0.28);mouth.rotation.z=Math.PI;head.add(mouth);

// 头发（短发默认）
const hair=new THREE.Group();head.add(hair);
function shengcheng_toufa(leixing){
  while(hair.children.length) hair.remove(hair.children[0]);
  const c=mat_hair.color;
  if(leixing===0){ // 短发
    const m=new THREE.Mesh(new THREE.SphereGeometry(0.36,32,16),new THREE.MeshStandardMaterial({color:c,roughness:0.7,metalness:0.05}));
    m.scale.set(0.95,0.5,0.95);m.position.y=0.15;m.castShadow=true;hair.add(m);
    for(let i=0;i<8;i++){
      const a=i/8*Math.PI*2;const s=new THREE.Mesh(new THREE.BoxGeometry(0.04,0.25,0.06),new THREE.MeshStandardMaterial({color:c,roughness:0.7}));
      s.position.set(Math.cos(a)*0.3,0.05,Math.sin(a)*0.3);s.rotation.y=-a;s.castShadow=true;hair.add(s);
    }
  }else if(leixing===1){ // 长发
    const m=new THREE.Mesh(new THREE.SphereGeometry(0.34,32,16),new THREE.MeshStandardMaterial({color:c,roughness:0.7}));
    m.scale.set(0.95,0.3,0.95);m.position.y=0.18;hair.add(m);
    const b=new THREE.Mesh(new THREE.CylinderGeometry(0.33,0.28,0.8,16),new THREE.MeshStandardMaterial({color:c,roughness:0.7}));
    b.position.y=-0.45;hair.add(b);
    for(let i=0;i<5;i++){
      const a=i/5*Math.PI*2;const s=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.3,0.04),new THREE.MeshStandardMaterial({color:c,roughness:0.7}));
      s.position.set(Math.cos(a)*0.31,0.1,Math.sin(a)*0.31);s.rotation.y=-a;hair.add(s);
    }
  }else if(leixing===2){ // 马尾
    const m=new THREE.Mesh(new THREE.SphereGeometry(0.34,32,16),new THREE.MeshStandardMaterial({color:c,roughness:0.7}));
    m.scale.set(0.95,0.3,0.95);m.position.y=0.18;hair.add(m);
    const p=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.12,0.6,8),new THREE.MeshStandardMaterial({color:c,roughness:0.7}));
    p.position.set(0,-0.15,-0.15);p.rotation.x=0.3;hair.add(p);
  }else{ // 丸子头
    const m=new THREE.Mesh(new THREE.SphereGeometry(0.34,32,16),new THREE.MeshStandardMaterial({color:c,roughness:0.7}));
    m.scale.set(0.95,0.3,0.95);m.position.y=0.18;hair.add(m);
    const b=new THREE.Mesh(new THREE.SphereGeometry(0.15,16,16),new THREE.MeshStandardMaterial({color:c,roughness:0.7}));
    b.position.y=0.3;hair.add(b);
  }
}
shengcheng_toufa(0);

// 手臂
for(let s of[-1,1]){
  const arm=new THREE.Mesh(new THREE.CapsuleGeometry(0.1,0.55,4,8),mat_skin);
  arm.position.set(s*0.4,1.35,0);arm.castShadow=true;body.add(arm);
}

// === 参数应用 ===
function yingyong(){
  mat_skin.color.set(document.getElementById('sc').value);
  mat_hair.color.set(document.getElementById('hc').value);
  mat_cloth.color.set(document.getElementById('oc').value);
  const es=parseFloat(document.getElementById('es').value);
  leye.scale.setScalar(es);reye.scale.setScalar(es);
  document.getElementById('esv').textContent=es.toFixed(2);
  const fs=parseFloat(document.getElementById('fs').value);
  skull.scale.x=fs;document.getElementById('fsv').textContent=fs.toFixed(2);
  const bs=parseFloat(document.getElementById('bs').value);
  body.scale.setScalar(bs);document.getElementById('bsv').textContent=bs.toFixed(2);
  const hs=parseInt(document.getElementById('hs').value);
  const hsm=['短发','长发','马尾','丸子头'];
  document.getElementById('hsv').textContent=hsm[hs];
  shengcheng_toufa(hs);
}

['sc','hc','oc'].forEach(id=>{
  const el=document.getElementById(id);
  el.addEventListener('input',()=>{document.getElementById(id+'v').textContent=el.value;yingyong();});
});
['es','fs','bs','hs'].forEach(id=>{document.getElementById(id).addEventListener('input',yingyong);});

// 初始化显示
['sc','hc','oc'].forEach(id=>document.getElementById(id+'v').textContent=document.getElementById(id).value);

window.baocun=()=>{
  ['sc','hc','oc','es','fs','bs','hs'].forEach(k=>localStorage.setItem('nl_'+k,document.getElementById(k).value));
  msg.textContent='已保存 ✓';
};
window.fuyuan=()=>{
  document.getElementById('sc').value='#f5d0b8';document.getElementById('hc').value='#2a1a0a';
  document.getElementById('oc').value='#1a2a3a';document.getElementById('es').value=1;
  document.getElementById('fs').value=1;document.getElementById('bs').value=1;document.getElementById('hs').value=0;
  ['sc','hc','oc'].forEach(id=>document.getElementById(id+'v').textContent=document.getElementById(id).value);
  yingyong();msg.textContent='已恢复默认';
};
(function(){
  const g=(k,d)=>localStorage.getItem('nl_'+k)||d;
  document.getElementById('sc').value=g('sc','#f5d0b8');document.getElementById('hc').value=g('hc','#2a1a0a');
  document.getElementById('oc').value=g('oc','#1a2a3a');document.getElementById('es').value=g('es','1');
  document.getElementById('fs').value=g('fs','1');document.getElementById('bs').value=g('bs','1');document.getElementById('hs').value=g('hs','0');
  ['sc','hc','oc'].forEach(id=>document.getElementById(id+'v').textContent=document.getElementById(id).value);
  yingyong();
})();

function donghua(t){
  requestAnimationFrame(donghua);
  ctrl.update();
  pt.rotation.y+=0.0003;
  ren.render(scn,cam);
}
function tiaozheng(){
  const w=c.clientWidth,h=c.clientHeight;
  ren.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();
}
window.addEventListener('resize',tiaozheng);
tiaozheng();requestAnimationFrame(donghua);
</script>
</body>
</html>
