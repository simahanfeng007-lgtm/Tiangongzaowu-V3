[pytest]
testpaths =
    tests
    app/backend/tiangong-backend/omni_body_skill/tests
python_files = test_*.py
pythonpath =
    src
    tests
    app/backend/tiangong-backend
    app/life-service/runtime314
norecursedirs =
    .git
    .pytest_cache
    node_modules
    release-stage
    release-artifacts
    _internal
    bundled_skills
addopts = --strict-markers
markers =
    ci_fragile: fails only on shared CI Windows runners due to environment limitations (short-path aliases, AppContainer profile restrictions, missing release artifacts, TTS network); skipped when TIANGONG_CI_ENV=1 on Windows
